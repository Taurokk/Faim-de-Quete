<script>
/* ---------- Écran de MJ ---------- */
const sessName=s=>s.session||'Sans session';
function sessionsList(){return [...new Set(list('scenes').map(sessName))].sort(natural);}
function currentSession(){const ss=sessionsList();return S.session&&ss.includes(S.session)?S.session:ss[ss.length-1];}
function fearHTML(){
  const v=num(S.table&&S.table.peur),ed=canEditLore();let pips='';
  for(let i=1;i<=12;i++) pips+=`<button type="button" class="slot fear ${i<=v?'on':''}" ${ed?`data-act="peur" data-n="${i}"`:'disabled'} aria-label="Peur ${i}"></button>`;
  return `<section class="panel"><header><h2>Peur</h2><span class="big-tally">${v}<small>/12</small></span></header><div class="slots">${pips}</div>
  ${ed?`<div class="btns"><button type="button" class="btn small" data-act="peur" data-d="-1">−1</button><button type="button" class="btn small" data-act="peur" data-d="1">+1</button></div>`:''}</section>`;
}
function countsHTML(){
  const arr=list('comptes').sort((a,b)=>num(a.cree)-num(b.cree)),ed=canEditLore();
  return `<section class="panel"><header><h2>Comptes à rebours</h2></header>
  ${arr.length?`<div class="cdowns">${arr.map(c=>{const v=num(c.valeur),m=num(c.max,6);let d='';for(let i=1;i<=m;i++) d+=`<i class="cd ${i<=v?'on':''}"></i>`;
    return `<div class="cdown ${c.type==='consequence'?'cons':''}"><div class="min0"><strong>${esc(c.nom)}</strong> <span class="label">· ${c.type==='consequence'?'Conséquence':'Progression'} · ${v}/${m}</span><div class="cds">${d}</div></div>
    ${ed?`<div class="btns"><button type="button" class="btn small" data-act="cpt" data-id="${c.id}" data-d="-1" aria-label="Retirer un cran">−</button><button type="button" class="btn small" data-act="cpt" data-id="${c.id}" data-d="1" aria-label="Ajouter un cran">+</button>${delBtn('comptes',c.id,true)}</div>`:''}</div>`;}).join('')}</div>`:emptyMsg('Aucun compte à rebours en cours.')}
  ${ed?`<form class="inline-form" data-form="compte"><input type="text" name="nom" id="f-cnom" placeholder="Nom du compte à rebours" required aria-label="Nom"><input type="number" name="max" id="f-cmax" min="1" max="12" value="6" aria-label="Nombre de crans"><select name="type" id="f-ctype" aria-label="Type"><option value="progression">Progression</option><option value="consequence">Conséquence</option></select><button class="btn small" type="submit">${ico('plus')} Ajouter</button></form>`:''}
  </section>`;
}
function sceneLinks(s){
  const out={pnj:[],faction:[],lieu:[],autre:[],manquants:[]},seen=new Set();
  for(const t of linksIn(sceneText(s))){const id=TI.get(norm(t));
    if(!id){if(!out.manquants.includes(t)) out.manquants.push(t);continue;}
    if(seen.has(id)) continue;seen.add(id);const p={...D.lore[id],id};(out[typeOf(p)]||out.autre).push(p);}
  return out;
}
function treeHTML(arr){
  const ids=new Set(arr.map(s=>s.id)),byId=Object.fromEntries(arr.map(s=>[s.id,s])),inc={};
  arr.forEach(s=>(s.suites||[]).forEach(t=>{if(ids.has(t)&&t!==s.id)(inc[t]||(inc[t]=[])).push(s.id);}));
  const sorted=arr.slice().sort(byCode);let roots=sorted.filter(s=>!inc[s.id]);if(!roots.length) roots=[sorted[0]];
  const depth={},q=[];roots.forEach(r=>{depth[r.id]=0;q.push(r.id);});
  while(q.length){const id=q.shift();(byId[id].suites||[]).forEach(t=>{if(ids.has(t)&&depth[t]===undefined){depth[t]=depth[id]+1;q.push(t);}});}
  const cols=[];sorted.forEach(s=>{const d=depth[s.id]??0;(cols[d]||(cols[d]=[])).push(s);});
  S.treeEdges=[];arr.forEach(s=>(s.suites||[]).forEach(t=>{if(ids.has(t)&&t!==s.id) S.treeEdges.push([s.id,t]);}));
  return `<div class="tree-wrap"><div class="tree" id="tree"><svg class="links" id="tree-links" aria-hidden="true"></svg>
  ${cols.map(c=>`<div class="col">${(c||[]).map(s=>{const L=sceneLinks(s);return `<a class="block" href="#scene-${s.id}" data-sid="${s.id}"><span class="code">${esc(s.code||'?')}</span><strong>${esc(s.titre||'Sans titre')}</strong>${s.resume?`<span class="muted small clamp">${esc(s.resume)}</span>`:''}${L.pnj.length?`<span class="faint small">${L.pnj.length} PNJ · ${L.pnj.map(p=>esc(p.titre)).join(', ')}</span>`:''}</a>`;}).join('')}</div>`).join('')}
  </div></div>`;
}
function drawTree(){
  const tree=document.getElementById('tree'),svg=document.getElementById('tree-links');if(!tree||!svg) return;
  const W=tree.scrollWidth,H=tree.scrollHeight,base=tree.getBoundingClientRect();
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const rect=id=>{const el=tree.querySelector(`[data-sid="${id}"]`);if(!el) return null;const r=el.getBoundingClientRect();return {l:r.left-base.left,r:r.right-base.left,t:r.top-base.top,b:r.bottom-base.top};};
  const paths=S.treeEdges.map(([a,b])=>{const A=rect(a),B=rect(b);if(!A||!B) return '';
    if(B.t>=A.b){const x1=(A.l+A.r)/2,y1=A.b,x2=(B.l+B.r)/2,y2=B.t-2,my=(y1+y2)/2;return `<path d="M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}" marker-end="url(#arr)"/>`;}
    const x1=A.r,y1=(A.t+A.b)/2,x2=B.r+2,y2=(B.t+B.b)/2,mx=Math.max(x1,x2)+50;return `<path class="back" d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" marker-end="url(#arr)"/>`;}).join('');
  svg.innerHTML=`<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9a24a" stroke="none"/></marker></defs>${paths}`;
}
function vEcran(){
  const ss=sessionsList(),cur=currentSession(),inS=list('scenes').filter(s=>sessName(s)===cur);
  return `<div class="wrap wide">
  <header class="row-between"><div class="page-head"><p class="eyebrow">Réservé au MJ</p><h1>Écran de MJ</h1></div>${canEditLore()?`<button type="button" class="btn primary" data-act="newscene">${ico('plus')} Nouvelle scène</button>`:''}</header>
  <div class="table-tools">${fearHTML()}${countsHTML()}</div>
  <section class="panel"><header><h2>Déroulé de session</h2>${ss.length>1?`<div class="chips">${ss.map(s=>`<button type="button" class="chip" data-act="session" data-s="${esc(s)}" aria-pressed="${s===cur}">${esc(s)}</button>`).join('')}</div>`:ss.length?`<span class="label">${esc(cur)}</span>`:''}</header>
  ${inS.length?treeHTML(inS):emptyMsg('Aucune scène. Crée la scène A, puis ses suites A1, A2, A3 : l’arbre se dessine tout seul.')}
  </section></div>`;
}
function linkGroup(title,arr){return arr.length?`<section><h3 class="label">${title}</h3><ul class="plain links">${arr.sort(byTitle).map(p=>`<li><a href="#page-${p.id}" style="--tc:${TYPES[typeOf(p)].c}"><i class="dot"></i>${esc(p.titre)}</a>${p.resume?`<div class="faint small">${esc(p.resume)}</div>`:''}</li>`).join('')}</ul></section>`:'';}
function vScene(id){
  const s=D.scenes[id];if(!s) return notFound('Cette scène n’existe pas (ou plus).','#ecran');
  const L=sceneLinks(s),kids=(s.suites||[]).filter(t=>D.scenes[t]).map(t=>({...D.scenes[t],id:t})).sort(byCode);
  const parents=list('scenes').filter(x=>(x.suites||[]).includes(id)).sort(byCode);
  const poss=String(s.possibilites||'').split('\n').map(x=>x.trim().replace(/^[-•*]\s*/,'')).filter(Boolean);
  const any=L.pnj.length+L.faction.length+L.lieu.length+L.autre.length;
  return `<div class="wrap">
  <nav class="crumbs"><a href="#ecran">Écran de MJ</a><span>›</span><span>${esc(sessName(s))}</span></nav>
  <div class="scene"><article class="stack">
   <header class="page-head"><div class="scene-title"><span class="code-badge">${esc(s.code||'?')}</span><h1>${esc(s.titre||'Sans titre')}</h1></div>${s.resume?`<p class="lede">${inline(s.resume)}</p>`:''}</header>
   ${poss.length?`<section class="panel"><header><h2>Possibilités</h2></header><ul class="poss">${poss.map(x=>`<li>${inline(x)}</li>`).join('')}</ul></section>`:''}
   ${s.contenu?`<section class="panel"><header><h2>Détail</h2></header><div class="prose">${md(s.contenu)}</div></section>`:''}
   <section class="panel"><header><h2>Mène à</h2>${canEditLore()?`<button type="button" class="btn small" data-act="addsuite" data-id="${id}">${ico('plus')} Ajouter une suite</button>`:''}</header>
    <div class="btns">${kids.length?kids.map(k=>`<a class="btn" href="#scene-${k.id}"><b>${esc(k.code||'?')}</b> ${esc(k.titre||'')} ${ico('arrow')}</a>`).join(''):'<span class="empty">Fin de branche.</span>'}</div>
    ${parents.length?`<p class="muted small">Vient de : ${parents.map(x=>`<a href="#scene-${x.id}">${esc(x.code||'?')} ${esc(x.titre||'')}</a>`).join(', ')}</p>`:''}</section>
   ${canEditLore()?`<div class="btns"><button type="button" class="btn" data-act="editscene" data-id="${id}">${ico('edit')} Modifier</button>${delBtn('scenes',id,false,'Supprimer la scène')}</div>`:''}
  </article>
  <aside class="side-panel">${linkGroup('PNJ présents',L.pnj)}${linkGroup('Factions',L.faction)}${linkGroup('Lieux',L.lieu)}${linkGroup('Autres pages liées',L.autre)}
   ${!any?'<p class="empty">Écris [[Nom d’un PNJ]] dans la scène : il apparaîtra ici, rangé avec les factions et les lieux.</p>':''}
   ${L.manquants.length&&canEditLore()?`<section><h3 class="label">Pages à créer</h3><div class="btns">${L.manquants.map(t=>`<button type="button" class="btn small ghost" data-act="newpage" data-title="${esc(t)}">${ico('plus')} ${esc(t)}</button>`).join('')}</div></section>`:''}
  </aside></div></div>`;
}
function sceneForm(){
  const e=S.editing,s=e.id?D.scenes[e.id]:e.draft,sess=s.session||'';
  const sessions=[...new Set(list('scenes').map(x=>x.session).filter(Boolean))].sort(natural);
  const others=list('scenes').filter(x=>x.id!==e.id&&(x.session||'')===sess).sort(byCode);
  e.shown=others.map(o=>o.id);
  const from=new Set(e.id?others.filter(o=>(o.suites||[]).includes(e.id)).map(o=>o.id):(s.from||[]));
  const pick=(name,checked)=>others.length?`<div class="picker">${others.map(o=>`<label class="pick"><input type="checkbox" name="${name}" value="${o.id}" ${checked(o)?'checked':''}><span><b>${esc(o.code||'?')}</b> ${esc(o.titre||'')}</span></label>`).join('')}</div>`:'<p class="empty">Pas d’autre scène dans cette session pour l’instant.</p>';
  return `<div class="wrap narrow"><form class="form panel" data-form="scene"><header><h2>${e.id?'Modifier la scène':'Nouvelle scène'}</h2></header>
  <div class="row"><label class="field"><span>Code</span><input type="text" name="code" id="f-code" placeholder="A, A1, B…" required value="${esc(s.code||'')}"></label><label class="field"><span>Titre</span><input type="text" name="titre" id="f-stitre" value="${esc(s.titre||'')}"></label></div>
  <label class="field"><span>Session</span><input type="text" name="session" id="f-session" list="dl-sessions" placeholder="Date 1 · Épisode 1" value="${esc(sess)}"><datalist id="dl-sessions">${sessions.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
  <label class="field"><span>Résumé</span><input type="text" name="resume" id="f-scresume" value="${esc(s.resume||'')}"></label>
  <label class="field"><span>Possibilités : une par ligne</span><textarea name="possibilites" id="f-poss" rows="5">${esc(s.possibilites||'')}</textarea></label>
  <label class="field"><span>Détail de la scène</span><textarea name="contenu" id="f-sccontenu" rows="8">${esc(s.contenu||'')}</textarea><small class="hint">Écris [[Nom du PNJ]], [[Nom de la faction]]… : la scène range les pages liées par type.</small></label>
  <fieldset><legend>Vient de</legend>${pick('from',o=>from.has(o.id))}</fieldset>
  <fieldset><legend>Mène à</legend>${pick('suites',o=>(s.suites||[]).includes(o.id))}</fieldset>
  <div class="btns"><button class="btn primary" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-act="cancel">Annuler</button></div></form></div>`;
}
function formHTML(){return ({lore:loreForm,perso:persoForm,sort:sortForm,scene:sceneForm,config:configForm,levelup:levelForm,sondage:sondageForm})[S.editing.kind]();}
</script>
<script>
/* ---------- Domaines accessibles et cartes ---------- */
function domainsOf(p){const c=CLASSES[p.classe],d=c?[...c.dom]:[];if(p.multiclasse&&p.multiclasse.domaine&&!d.includes(p.multiclasse.domaine)) d.push(p.multiclasse.domaine);return d;}
function cardAllowed(c,classe,L,multi){
  const cl=CLASSES[classe],lv=num(c.niveau,1);
  if(!cl) return lv<=L;
  if(cl.dom.includes(c.domaine)) return lv<=L;
  return !!(multi&&multi.domaine===c.domaine&&lv<=Math.floor(L/2));
}
function expectedCards(p){const L=num(p.niveau,1);return 2+(L-1)+Object.entries(p.avancements||{}).filter(([k])=>k.endsWith('-carte')).reduce((t,[,v])=>t+num(v),0);}
function pickerHTML(classe,L,sel,all,p){
  const cards=list('sorts').filter(c=>sel.has(c.id)||all||cardAllowed(c,classe,L,p.multiclasse));
  if(!list('sorts').length) return '<p class="empty">Aucune carte n’existe encore : elles se créent dans la page Sorts.</p>';
  const doms=domainsOf({...p,classe});
  cards.sort((a,b)=>(doms.includes(b.domaine)-doms.includes(a.domaine))||bySort(a,b));
  const exp=expectedCards({...p,niveau:L});
  return `<p class="hint" id="cardcount">${cardCountHTML(sel.size,L,exp)}</p>
  ${!CLASSES[classe]&&!all?'<p class="hint">Choisis une classe pour ne voir que ses domaines.</p>':''}
  ${cards.length?`<div class="picker">${cards.map(c=>`<label class="pick" style="--dom:${domC(c.domaine)}"><input type="checkbox" name="cartes" value="${c.id}" ${sel.has(c.id)?'checked':''}><i class="dot"></i><span><b>${esc(c.nom)}</b> <small class="muted">${esc(c.domaine||'')} · niv. ${num(c.niveau,1)}</small><small class="faint">${esc(c.resume||'')}</small></span></label>`).join('')}</div>`:'<p class="empty">Aucune carte disponible pour ce choix.</p>'}`;
}
function cardCountHTML(n,L,exp){return `${n} carte${n>1?'s':''} cochée${n>1?'s':''} · au niveau ${L}, tu en as normalement ${exp}${L===1?' : deux cartes de niveau 1, prises dans les domaines de ta classe':''}.`;}
function updCardCount(){const box=document.getElementById('cardpicker'),c=document.getElementById('cardcount');if(!box||!c||!S.editing) return;const e=S.editing,p=e.id?D.persos[e.id]:e.draft;c.innerHTML=cardCountHTML(box.querySelectorAll('input[name=cartes]:checked').length,num(p.niveau,1),expectedCards(p));}
function updLvlCheck(){const p=S.editing&&D.persos[S.editing.id],b=document.getElementById('lvl-check');if(!p||!b) return;const pr=lvlProblems(p);b.innerHTML=pr.length?`<ul class="plain lvl-probs">${pr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="tok">Tout est prêt.</p>';const btn=document.querySelector('#lvlform button[type=submit]');if(btn) btn.disabled=!!pr.length;}
function refreshPicker(){
  const box=document.getElementById('cardpicker');if(!box||!S.editing||S.editing.kind!=='perso') return;
  const sel=new Set([...box.querySelectorAll('input[name=cartes]:checked')].map(x=>x.value));
  const e=S.editing,p=e.id?D.persos[e.id]:e.draft,cl=(document.getElementById('f-classe')||{}).value||'';
  box.innerHTML=pickerHTML(cl,num(p.niveau,1),sel,!!(document.getElementById('f-allcards')||{}).checked,p);
}

/* ---------- Répartition des traits ---------- */
function traitCheckHTML(vals){
  const pool=vals.slice(),chips=TRAIT_ARRAY.map(v=>{const i=pool.indexOf(v);if(i>=0){pool.splice(i,1);return {v,on:true};}return {v,on:false};});
  const ok=!pool.length&&chips.every(c=>c.on);
  return `<div class="tchips" aria-label="Valeurs à répartir">${chips.map(c=>`<span class="tchip ${c.on?'on':''}">${fmtMod(c.v)}</span>`).join('')}</div>
  <p class="${ok?'tok':'hint'}">${ok?'Répartition valide.':'Répartis exactement +2, +1, +1, 0, 0 et −1 entre tes six traits.'+(pool.length?' En trop : '+pool.map(fmtMod).join(', ')+'.':'')}</p>`;
}
function traitVals(){return TRAITS.map(([k])=>num((document.getElementById('f-t-'+k)||{}).value));}
function traitsValid(vals){return JSON.stringify(vals.slice().sort())===JSON.stringify(TRAIT_ARRAY.slice().sort());}
function updTraitCheck(){const b=document.getElementById('tcheck');if(b) b.innerHTML=traitCheckHTML(traitVals());}
function traitStepper(tr,L){
  const locked=L>1&&!isMJ();
  return `<div class="tsteps">${TRAITS.map(([k,l,v])=>`<div class="tstep"><span class="label">${l}</span>
    <div class="tstep-ctl">${locked?'':`<button type="button" class="btn small" data-act="tstep" data-k="${k}" data-d="-1" aria-label="Retirer 1 en ${l}">−</button>`}<b id="tv-${k}">${fmtMod(tr[k])}</b>${locked?'':`<button type="button" class="btn small" data-act="tstep" data-k="${k}" data-d="1" aria-label="Ajouter 1 en ${l}">+</button>`}</div>
    <small class="faint">${v}</small><input type="hidden" name="t-${k}" id="f-t-${k}" value="${num(tr[k])}"></div>`).join('')}</div>
  ${L<=1?`<div class="tcheck"><div id="tcheck">${traitCheckHTML(TRAITS.map(([k])=>num(tr[k])))}</div><button type="button" class="btn small ghost" data-act="tsug">Appliquer la répartition suggérée pour la classe</button></div>`
  :`<p class="hint">${locked?'Après le niveau 1, les traits montent avec la montée de niveau.':'Correction manuelle (version MJ) : les traits montent normalement avec la montée de niveau.'}</p>`}`;
}

/* ---------- Montée de niveau ---------- */
function lvlCost(){return Object.entries(S.lvl.sel).reduce((t,[k,n])=>t+n*ADV.find(a=>a.k===k.split('-')[1]).cost,0);}
function selCount(k){return Object.entries(S.lvl.sel).filter(([key])=>key.endsWith('-'+k)).reduce((t,[,n])=>t+n,0);}
function lvlCards(p,L,exclude){const own=new Set([...(p.cartes||[]),...exclude]);return list('sorts').filter(c=>!own.has(c.id)&&cardAllowed(c,p.classe,L,S.lvl.sel&&selCount('multi')&&S.lvl.mdom?{domaine:S.lvl.mdom}:p.multiclasse)).sort(bySort);}
function lvlProblems(p){
  const L=num(p.niveau,1)+1,out=[],c=lvlCost();
  if([2,5,8].includes(L)&&!S.lvl.newxp.trim()) out.push('Écris ta nouvelle Expérience.');
  if(c<2) out.push(c===1?'Choisis encore une amélioration.':'Choisis deux améliorations.');
  const nt=2*selCount('traits');if(nt&&S.lvl.traits.size!==nt) out.push(`Coche ${nt} traits à augmenter.`);
  const nx=2*selCount('xp');if(nx&&S.lvl.xp.size!==Math.min(nx,(p.experiences||[]).length)) out.push('Coche deux Expériences à augmenter.');
  if(selCount('carte')&&!S.lvl.extra) out.push('Choisis ta carte de domaine en plus.');
  if(selCount('multi')&&(!S.lvl.mclasse||!S.lvl.mdom)) out.push('Choisis la classe et le domaine du multiclassage.');
  if(!S.lvl.carte&&lvlCards(p,L,[S.lvl.extra].filter(Boolean)).length) out.push('Choisis ta nouvelle carte de domaine.');
  if(S.lvl.carte&&S.lvl.carte===S.lvl.extra) out.push('Choisis deux cartes différentes.');
  return out;
}
function cardSelect(name,val,cards){return `<select name="${name}" id="f-${name}"><option value="">Choisir une carte…</option>${cards.map(c=>`<option value="${c.id}" ${val===c.id?'selected':''}>${esc(c.domaine)} · niv. ${num(c.niveau,1)} · ${esc(c.nom)}${c.resume?' : '+esc(c.resume):''}</option>`).join('')}</select>`;}
function levelBody(p){
  const L=num(p.niveau,1)+1,T=tierOf(L),ach=[2,5,8].includes(L),clear=L===5||L===8;
  const marked=clear?[]:(p.traitsMarques||[]),used=p.avancements||{},sel=S.lvl.sel,cost=lvlCost(),R=computeStats(p),R2=computeStats({...p,niveau:L});
  const multiTaken=Object.keys(used).some(k=>k.endsWith('-multi')&&used[k]>0)||!!p.multiclasse;
  let tiers='';
  for(let t=2;t<=T;t++){
    tiers+=`<div class="tier"><h3 class="label">Palier ${t} · niveaux ${TIER_LV[t]}</h3>${ADV.filter(a=>a.t<=t).map(a=>{
      const key=t+'-'+a.k,u=num(used[key]),s=num(sel[key]);
      const crossed=a.k==='multi'?!!(multiTaken||num(used[t+'-sousclasse'])||num(sel[t+'-sousclasse']))
        :a.k==='sousclasse'?!!(num(used[t+'-multi'])||num(sel[t+'-multi'])||(!s&&RANGS.indexOf(p.sousClasseRang||'Fondation')+selCount('sousclasse')>=2)):false;
      let boxes='';
      for(let i=0;i<a.n;i++){
        const st=i<u?'used':i<u+s?'on':'free';
        const dis=st==='used'||(st==='free'&&(crossed||cost+a.cost>2||(a.k==='multi'&&selCount('multi'))));
        boxes+=`<button type="button" class="lbox ${st} ${a.cost===2?'wide':''}" ${dis?'disabled':''} ${st!=='used'?`data-act="lsel" data-key="${key}" data-on="${st==='on'?1:0}"`:''} aria-label="${esc(a.l)}${st==='used'?' : déjà pris':''}"></button>`;
      }
      return `<div class="adv ${crossed&&!s?'crossed':''}"><div class="lboxes">${boxes}</div><span>${a.l}</span></div>`;}).join('')}</div>`;
  }
  const nt=2*selCount('traits'),nx=2*selCount('xp');
  const subs=[];
  if(nt) subs.push(`<div class="field"><span>Traits à augmenter (${S.lvl.traits.size}/${nt})</span><div class="chips">${TRAITS.map(([k,l])=>{const m=marked.includes(k);return `<label class="pick ${m?'dim':''}"><input type="checkbox" name="ltrait" value="${k}" ${S.lvl.traits.has(k)?'checked':''} ${m?'disabled':''}><span>${l} ${fmtMod(R['t-'+k].total)}${m?' · marqué':''}</span></label>`;}).join('')}</div></div>`);
  if(nx) subs.push(`<div class="field"><span>Expériences à augmenter (${S.lvl.xp.size}/${Math.min(nx,(p.experiences||[]).length)})</span>${(p.experiences||[]).length?`<div class="chips">${p.experiences.map((x,i)=>`<label class="pick"><input type="checkbox" name="lxp" value="${i}" ${S.lvl.xp.has(String(i))?'checked':''}><span>${esc(x.nom)} +${num(x.bonus,2)}</span></label>`).join('')}</div>`:'<p class="empty">Aucune Expérience sur la fiche.</p>'}</div>`);
  if(selCount('carte')) subs.push(`<label class="field"><span>Carte de domaine en plus</span>${cardSelect('lextra',S.lvl.extra,lvlCards(p,L,[S.lvl.carte].filter(Boolean)))}</label>`);
  if(selCount('sousclasse')) subs.push(`<p class="hint">Sous-classe : tu passes à la carte « ${RANGS[Math.min(2,RANGS.indexOf(p.sousClasseRang||'Fondation')+1)]} » de ta sous-classe.</p>`);
  if(selCount('maitrise')) subs.push('<p class="hint">Maîtrise +1 : tes dés de dégâts d’arme augmentent d’un cran.</p>');
  if(selCount('multi')){const oc=Object.keys(CLASSES).filter(c=>c!==p.classe),mc=CLASSES[S.lvl.mclasse];
    subs.push(`<div class="row"><label class="field"><span>Classe du multiclassage</span><select name="lmclasse" id="f-lmclasse"><option value="">Choisir…</option>${oc.map(c=>`<option value="${c}" ${S.lvl.mclasse===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="field"><span>Domaine gagné</span><select name="lmdom" id="f-lmdom"><option value="">Choisir…</option>${(mc?mc.dom:[]).map(d=>`<option ${S.lvl.mdom===d?'selected':''}>${d}</option>`).join('')}</select></label></div><p class="hint">Prends aussi le trait de classe et la carte de fondation d’une sous-classe de cette classe.</p>`);}
  const probs=lvlProblems(p);
  return `${ach?`<section class="lstep"><h3>Étape 1 · Palier atteint</h3><ul class="poss"><li>+1 en Maîtrise (${R.maitrise.total} → ${R.maitrise.total+1})</li>${clear?'<li>Les marques sur tes traits sont effacées.</li>':''}</ul>
    <label class="field"><span>Nouvelle Expérience à +2</span><input type="text" id="f-newxp" data-lvl="newxp" value="${esc(S.lvl.newxp)}" placeholder="Ex. Ancienne dame de compagnie"></label></section>`:''}
  <section class="lstep"><h3>Étape ${ach?2:1} · Deux améliorations</h3><p class="hint">Coche deux cases, dans ton palier ou un palier inférieur. Les cases grisées sont déjà prises. Choix faits : ${cost}/2.</p>${tiers}${subs.length?`<div class="stack">${subs.join('')}</div>`:''}</section>
  <section class="lstep"><h3>Étape ${ach?3:2} · Seuils de dégâts</h3><p>Majeur ${R.seuilMajeur.total} → <b>${R2.seuilMajeur.total}</b> · Grave ${R.seuilGrave.total} → <b>${R2.seuilGrave.total}</b> <span class="muted small">(automatique, selon ton armure et ton niveau)</span></p></section>
  <section class="lstep"><h3>Étape ${ach?4:3} · Nouvelle carte de domaine</h3><label class="field"><span>Une carte de niveau ${L} ou moins, dans tes domaines</span>${cardSelect('lcarte',S.lvl.carte,lvlCards(p,L,[S.lvl.extra].filter(Boolean)))}</label><p class="hint">Tu peux aussi échanger une ancienne carte contre une autre de même niveau ou moins : fais-le ensuite dans « Modifier ».</p></section>
  <div id="lvl-check">${probs.length?`<ul class="plain lvl-probs">${probs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="tok">Tout est prêt.</p>'}</div>
  <div class="btns"><button class="btn primary" type="submit" ${probs.length?'disabled':''}>Passer au niveau ${L}</button><button class="btn ghost" type="button" data-act="cancel">Annuler</button></div>`;
}
function levelForm(){
  const p=D.persos[S.editing.id];if(!p) return notFound('Ce personnage n’existe pas (ou plus).','#persos');
  const L=num(p.niveau,1)+1;
  return `<div class="wrap narrow"><form class="form panel" data-form="levelup" id="lvlform"><header><h2>${esc(p.nom)} passe au niveau ${L}</h2><span class="label">Palier ${tierOf(L)}</span></header><div class="stack" id="lvl-body">${levelBody(p)}</div></form></div>`;
}
function rerenderLvl(){const b=document.getElementById('lvl-body'),p=S.editing&&D.persos[S.editing.id];if(b&&p) b.innerHTML=levelBody(p);}
function applyLevel(){
  const id=S.editing.id,p=D.persos[id];if(!p) return;
  if(lvlProblems(p).length){rerenderLvl();return;}
  const L=num(p.niveau,1)+1,d=JSON.parse(JSON.stringify(p)),log=[],tn=k=>(TRAITS.find(t=>t[0]===k)||[])[1],src='Niveau '+L;
  d.niveau=L;d.mods=d.mods||[];d.avancements=d.avancements||{};d.experiences=d.experiences||[];
  if(!d.traitsBase&&d.traits){d.traitsBase=d.traits;delete d.traits;}
  d.traitsMarques=(L===5||L===8)?[]:(d.traitsMarques||[]);
  if([2,5,8].includes(L)){d.experiences.push({nom:S.lvl.newxp.trim(),bonus:2});d.mods.push({k:'maitrise',v:1,src:src+' (palier)'});log.push(`Nouvelle Expérience « ${S.lvl.newxp.trim()} » +2, Maîtrise +1`+(L>2?', traits démarqués':''));}
  for(const [key,n] of Object.entries(S.lvl.sel)){
    const k=key.split('-')[1];d.avancements[key]=num(d.avancements[key])+n;
    if(k==='traits'){for(const t of S.lvl.traits){d.mods.push({k:'t-'+t,v:1,src});d.traitsMarques.push(t);}log.push('+1 en '+[...S.lvl.traits].map(tn).join(' et '));}
    if(k==='pv'){d.mods.push({k:'pvMax',v:n,src});log.push(`+${n} PV`);}
    if(k==='stress'){d.mods.push({k:'stressMax',v:n,src});log.push(`+${n} Stress`);}
    if(k==='xp'){for(const i of S.lvl.xp){const x=d.experiences[+i];if(x) x.bonus=num(x.bonus,2)+1;}log.push('+1 en '+[...S.lvl.xp].map(i=>(d.experiences[+i]||{}).nom).join(' et '));}
    if(k==='carte'&&S.lvl.extra){log.push('Carte en plus : '+((D.sorts[S.lvl.extra]||{}).nom||''));}
    if(k==='evasion'){d.mods.push({k:'evasion',v:n,src});log.push('+1 Évasion');}
    if(k==='sousclasse'){d.sousClasseRang=RANGS[Math.min(2,RANGS.indexOf(d.sousClasseRang||'Fondation')+1)];log.push('Sous-classe : '+d.sousClasseRang);}
    if(k==='maitrise'){d.mods.push({k:'maitrise',v:1,src});log.push('Maîtrise +1');}
    if(k==='multi'){d.multiclasse={classe:S.lvl.mclasse,domaine:S.lvl.mdom};log.push(`Multiclasse ${S.lvl.mclasse} (${S.lvl.mdom})`);}
  }
  if(S.lvl.carte) log.push('Nouvelle carte : '+((D.sorts[S.lvl.carte]||{}).nom||''));
  d.cartes=[...new Set([...(d.cartes||[]),S.lvl.carte,S.lvl.extra].filter(Boolean))];
  d.historique=[...(d.historique||[]),{niveau:L,date:todayISO(),choix:log}];d.maj=Date.now();d.v=2;
  for(const f of ['evasion','armure','maitrise','seuilMajeur','seuilGrave','pvMax','stressMax']) delete d[f];
  put('persos',id,d);S.lvl=null;closeEdit();go('#perso-'+id);toast(`${d.nom} passe au niveau ${L}.`);
}
</script>
<script>
/* ---------- Sondages de dates ---------- */
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const pad2=n=>String(n).padStart(2,'0');
const isoOf=dt=>dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
const addDays=(iso,n)=>{const d=dayDate(iso);d.setDate(d.getDate()+n);return isoOf(d);};
const fmtDay=iso=>{const d=dayDate(iso);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS_L[d.getMonth()];};
const fmtShort=iso=>{const d=dayDate(iso);return d.getDate()+' '+MOIS[d.getMonth()];};
const hhmm=t=>{const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes());};
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const DEF_REGLES='Le MJ doit être présent. Idéalement toute la table ; à la rigueur un seul joueur absent. Espacer les séances d’au moins une semaine si possible.';
ICONS.agenda='<rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>';

const pollOf=id=>D.sondages[id]?{...D.sondages[id],id}:null;
function pollDays(p){const out=[];if(!isISO(p.debut)||!isISO(p.fin)||p.fin<p.debut) return out;let d=p.debut;while(d<=p.fin&&out.length<190){out.push(d);d=addDays(d,1);}return out;}
const nameSlug=n=>norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'x';
const dispoId=(pid,nom)=>pid+'--'+nameSlug(nom);
const pollResp=pid=>list('dispos').filter(r=>r.sondage===pid).sort(byNom);
function expectedNames(){const m=new Map();list('persos').forEach(p=>{const j=String(p.joueur||'').trim();if(j&&!m.has(norm(j))) m.set(norm(j),j);});return [...m.values()];}
function missingNames(pid){const got=new Set(pollResp(pid).map(r=>norm(r.nom)));return expectedNames().filter(n=>!got.has(norm(n)));}
function pollMeta(p){const nb=Math.max(1,num(p.nb,1));
  return `${isISO(p.debut)&&isISO(p.fin)?`Du ${fmtShort(p.debut)} au ${fmtShort(p.fin)}`:'Période à définir'} · ${nb} date${nb>1?'s':''} à trouver${p.heure?' · vers '+p.heure:''}${p.statut==='clos'?' · clos':''}`;}

/* brouillon de la réponse en cours (sur cet appareil) */
function loadDraft(pid,nom){const doc=nom?D.dispos[dispoId(pid,nom)]:null;
  S.pollDraft={poll:pid,nom:nom||'',mj:doc?!!doc.mj:isMJ(),oui:new Set(doc&&doc.oui||[]),pt:new Set(doc&&doc.pt||[]),texte:doc?String(doc.texte||''):'',dirty:false,src:doc?num(doc.maj):0};}
function syncDraft(pid){const dr=S.pollDraft;
  if(!dr||dr.poll!==pid){loadDraft(pid,LS.get('nom','')||'');return;}
  if(!dr.dirty&&dr.nom){const doc=D.dispos[dispoId(pid,dr.nom)];if(doc&&num(doc.maj)!==dr.src) loadDraft(pid,dr.nom);}
}
function draftCount(){const d=S.pollDraft;if(!d) return '';const o=d.oui.size,p=d.pt.size;
  return o||p?`${o} jour${o>1?'s':''} disponible${o>1?'s':''}${p?` · ${p} si besoin`:''}`:'Aucun jour coché';}
function heatOf(pid,exceptId){const h={};
  for(const r of pollResp(pid)){if(r.id===exceptId) continue;
    for(const d of r.oui||[]) (h[d]||(h[d]={o:[],p:[]})).o.push(r.nom);
    for(const d of r.pt||[]) (h[d]||(h[d]={o:[],p:[]})).p.push(r.nom);}
  return h;}
function gridHTML(p){
  const days=pollDays(p);if(!days.length) return emptyMsg('La période du sondage est vide : le MJ doit la corriger.');
  const dr=S.pollDraft,me=dr&&dr.nom?dispoId(p.id,dr.nom):'',H=heatOf(p.id,me),tot=pollResp(p.id).filter(r=>r.id!==me).length,today=todayISO(),open=p.statut!=='clos';
  const months=[];days.forEach(d=>{const k=d.slice(0,7);let m=months[months.length-1];if(!m||m.k!==k){m={k,days:new Set()};months.push(m);}m.days.add(d);});
  return months.map(m=>{
    const first=dayDate(m.k+'-01'),lead=(first.getDay()+6)%7,dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),mname=cap(MOIS_L[first.getMonth()])+' '+first.getFullYear();
    const cl=[];for(let i=0;i<lead;i++) cl.push(['','<span class="day pad"></span>']);
    for(let n=1;n<=dim;n++){const iso=m.k+'-'+pad2(n);
      if(!m.days.has(iso)){cl.push(['',`<span class="day out"><b>${n}</b></span>`]);continue;}
      let cells='';
      const st=dr&&dr.oui.has(iso)?'oui':dr&&dr.pt.has(iso)?'pt':'',h=H[iso]||{o:[],p:[]},past=iso<today,we=[0,6].includes(dayDate(iso).getDay());
      const lab=`${fmtDay(iso)} : ${st==='oui'?'tu es disponible':st==='pt'?'si besoin':'pas coché'}${h.o.length?` ; disponibles : ${h.o.join(', ')}`:''}${h.p.length?` ; si besoin : ${h.p.join(', ')}`:''}`;
      cells+=`<button type="button" class="day ${st} ${we?'we':''}" data-act="pday" data-d="${iso}" ${past||!open?'disabled':''} title="${esc(lab)}" aria-label="${esc(lab)}"><b>${n}</b>${h.o.length||h.p.length?`<small>${h.o.length}${h.p.length?'+'+h.p.length:''}</small>`:''}${tot?`<i class="heat" style="--h:${Math.min(1,(h.o.length+h.p.length/2)/tot).toFixed(2)}"></i>`:''}</button>`;
      cl.push([iso,cells]);}
    let cells='';for(let i=0;i<cl.length;i+=7){const wk=cl.slice(i,i+7);if(wk.some(c=>c[0])) cells+=wk.map(c=>c[1]).join('');}
    return `<div class="month"><h3 class="label">${mname}</h3><div class="mgrid" role="group" aria-label="${mname}">${['L','M','M','J','V','S','D'].map(x=>`<span class="dow" aria-hidden="true">${x}</span>`).join('')}${cells}</div></div>`;
  }).join('');
}
function refreshGrid(){const p=pollOf(S.route.id),g=document.getElementById('pgrid'),c=document.getElementById('pcount');
  if(p&&g) g.innerHTML=gridHTML(p);if(c) c.textContent=draftCount();}

/* ---------- Vue d'un sondage ---------- */
function vSondage(id){
  const p=pollOf(id);if(!p) return notFound('Ce sondage n’existe pas ou a été supprimé.','#accueil');
  syncDraft(id);
  const dr=S.pollDraft,resp=pollResp(id),miss=missingNames(id),open=p.statut!=='clos',canW=canCreate();
  const mineId=dr.nom?dispoId(id,dr.nom):'',mine=mineId&&D.dispos[mineId];
  const names=[...new Set([...expectedNames(),...resp.map(r=>r.nom)])];
  return `<div class="wrap">
  <div class="page-head"><nav class="crumbs"><a href="#accueil">Accueil</a><span>›</span><span>Sondage de dates</span></nav>
   <div class="row-between"><div class="min0"><h1>${esc(p.titre||'Sondage de dates')}</h1><p class="muted">${esc(pollMeta(p))}</p></div>
   ${canEditLore()?`<div class="btns"><button type="button" class="btn small" data-act="editpoll" data-id="${id}">${ico('edit')} Modifier</button><button type="button" class="btn small ghost" data-act="pstatut" data-id="${id}">${open?'Clore le sondage':'Rouvrir le sondage'}</button>${delBtn('sondages',id,false,'Supprimer')}</div>`:''}</div></div>
  <div class="poll">
   <section class="panel">
    <header><h2>Mes disponibilités</h2><span class="label" id="pcount">${esc(draftCount())}</span></header>
    ${open?'':`<p class="banner">Ce sondage est clos : les réponses ne sont plus modifiables.</p>`}
    <form class="form" data-form="dispo" id="pform">
     <div class="row"><label class="field"><span>Ton nom</span><input type="text" name="nom" id="f-pnom" list="dl-noms" data-nokeep data-input="pnom" value="${esc(dr.nom)}" placeholder="Prénom ou pseudo" autocomplete="off" required ${open?'':'disabled'}></label>
     ${isMJ()?`<label class="toggle"><input type="checkbox" id="f-pmj" data-nokeep data-input="pmj" ${dr.mj?'checked':''} ${open?'':'disabled'}> Réponse du MJ</label>`:''}</div>
     <datalist id="dl-noms">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
     <div class="legend"><span><i class="sw oui"></i>Disponible</span><span><i class="sw pt"></i>Si besoin</span><span><i class="sw hb"></i>Dispos des autres</span></div>
     ${open?`<p class="hint">Touche un jour une fois pour « disponible », deux fois pour « si besoin », trois fois pour l’effacer. Le chiffre indique combien d’autres sont disponibles (+ si besoin).</p>
     <div class="chips">${[['5','Tous les vendredis'],['6','Tous les samedis'],['0','Tous les dimanches'],['we','Tous les week-ends']].map(([w,l])=>`<button type="button" class="chip" data-act="pfill" data-w="${w}">${l}</button>`).join('')}<button type="button" class="chip" data-act="pclear">Tout effacer</button></div>`:''}
     <div id="pgrid" class="months">${gridHTML(p)}</div>
     <label class="field"><span>Ou dis-le avec tes mots</span><textarea name="texte" id="f-ptexte" rows="4" maxlength="1500" data-nokeep data-input="ptexte" placeholder="Ex. : libre tous les vendredis soir sauf le 12, pas avant 20 h. Le week-end du 19, je suis chez ma famille." ${open?'':'disabled'}>${esc(dr.texte)}</textarea></label>
     <p class="hint">Coche des jours, écris un texte, ou les deux. Claude lit tout ; si ton texte contredit tes cases, il suit le texte.</p>
     ${open&&canW?`<div class="btns"><button class="btn primary" type="submit">Enregistrer mes dispos</button>${mine?delBtn('dispos',mineId,false,'Retirer ma réponse'):''}</div>`:''}
     ${canW?'':`<p class="hint">Tu es en lecture seule : demande au MJ de t’inviter comme éditeur pour répondre.</p>`}
    </form>
   </section>
   <div class="stack">${bestHTML(p,resp)}${respHTML(p,resp,miss)}</div>
  </div></div>`;
}
function respSummary(r){const o=(r.oui||[]).length,t=(r.pt||[]).length;
  return [o?`${o} jour${o>1?'s':''} dispo`:'',t?`${t} si besoin`:'',r.texte?'texte':''].filter(Boolean).join(' · ')||'rien coché';}
function respHTML(p,resp,miss){
  const me=norm(LS.get('nom','')||''),open=p.statut!=='clos'&&canCreate();
  return `<section class="panel"><header><h2>Réponses</h2><span class="label">${resp.length} reçue${resp.length>1?'s':''}</span></header>
  ${miss.length?`<p class="small muted">En attente : ${esc(miss.join(', '))}</p>`:''}
  ${resp.length?`<ul class="plain resp">${resp.map(r=>`<li><div class="row-between"><strong>${esc(r.nom)}${r.mj?' <span class="chip">MJ</span>':''}</strong><span class="muted small">${esc(respSummary(r))}</span></div>
   ${r.texte?`<blockquote>${esc(r.texte)}</blockquote>`:''}
   ${open&&(isMJ()||norm(r.nom)===me)?`<div><button type="button" class="btn small ghost" data-act="pload" data-nom="${esc(r.nom)}">${ico('edit')} Modifier</button></div>`:''}</li>`).join('')}</ul>`:emptyMsg('Personne n’a encore répondu.')}</section>`;
}
function latestAnalyse(p){return [S.pollAI[p.id],p.analyse].filter(a=>a&&Array.isArray(a.dates)).sort((a,b)=>num(b.quand)-num(a.quand))[0]||null;}
function bestHTML(p,resp){
  const run=S.pollRun&&S.pollRun.id===p.id?S.pollRun:null,an=latestAnalyse(p);
  const newer=an&&resp.some(r=>num(r.maj)>num(an.quand));
  let ai;
  if(run) ai=`<div class="ai-run" role="status"><span class="spin" aria-hidden="true"></span><span>${run.phase==='ecrit'?'Claude rédige le classement…':'Claude lit les réponses…'}</span><button type="button" class="btn small ghost" data-act="pstop">Arrêter</button></div>`;
  else if(S.sample&&!S.sampleOff) ai=`<div class="btns"><button type="button" class="btn primary" data-act="pai" data-id="${p.id}" ${resp.length?'':'disabled'}>${ico('bolt')} ${an?'Relancer l’analyse':'Trouver les meilleures dates avec Claude'}</button></div>
    <p class="hint">Claude lit les cases et les textes de chacun, puis classe les dates. L’analyse passe par ton compte Claude ; la première fois, il te demande l’autorisation.</p>`;
  else ai=`<p class="hint">${S.sampleOff?'Claude n’est pas autorisé sur cette page pour toi':'L’analyse par Claude n’est pas disponible ici'} : le décompte des cases ci-dessous reste disponible.</p>`;
  if(S.pollErr&&S.pollErr.id===p.id) ai+=`<p class="banner">${esc(S.pollErr.msg)}</p>`;
  return `<section class="panel"><header><h2>Meilleures dates</h2>${an?`<span class="label">Analyse du ${esc(fmtShort(isoOf(new Date(an.quand))))} à ${hhmm(an.quand)}</span>`:''}</header>
   ${ai}${an?analyseHTML(p,an,newer):''}${tallyHTML(p,resp)}</section>`;
}
function analyseHTML(p,an,newer){
  const nb=Math.max(1,num(p.nb,1)),fixed=new Set(list('dates').map(d=>d.date)),pl=(n,w)=>`${n} ${w}${n>1?'s':''}`;
  return `${newer?`<p class="banner">De nouvelles réponses sont arrivées depuis cette analyse : relance-la pour en tenir compte.</p>`:''}
  ${an.resume?`<p class="ai-resume">${esc(an.resume)}</p>`:''}
  <ol class="sugg">${an.dates.map((d,i)=>`<li class="${i<nb?'top':''}">
   <div class="sugg-head"><span class="rank">${i+1}</span><div class="min0"><strong>${esc(cap(fmtDay(d.date)))}</strong>${i<nb?` <span class="chip best">Sélection conseillée</span>`:''}
    <div class="muted small">${pl(d.presents.length,'présent')}${d.incertains.length?' · '+pl(d.incertains.length,'incertain'):''}${d.absents.length?' · '+pl(d.absents.length,'absent'):''}</div></div>
    ${canEditLore()?(fixed.has(d.date)?`<span class="chip ok">Fixée</span>`:`<button type="button" class="btn small" data-act="pfix" data-id="${p.id}" data-d="${d.date}">Fixer</button>`):''}</div>
   <div class="who">${d.presents.map(n=>`<span class="chip yes">${esc(n)}</span>`).join('')}${d.incertains.map(n=>`<span class="chip maybe">${esc(n)} ?</span>`).join('')}${d.absents.map(n=>`<span class="chip no">${esc(n)}</span>`).join('')}</div>
   ${d.note?`<p class="small">${esc(d.note)}</p>`:''}</li>`).join('')}</ol>
  ${an.questions&&an.questions.length?`<div class="grid-tight"><h3 class="label">À clarifier</h3><ul class="plain small">${an.questions.map(q=>`<li>· ${esc(q)}</li>`).join('')}</ul></div>`:''}`;
}
function tallyHTML(p,resp){
  const boxed=resp.filter(r=>(r.oui||[]).length||(r.pt||[]).length);if(!boxed.length) return '';
  const mjs=boxed.filter(r=>r.mj),today=todayISO(),has=(r,k,d)=>(r[k]||[]).includes(d);
  const rows=pollDays(p).filter(d=>d>=today).map(d=>({d,o:boxed.filter(r=>has(r,'oui',d)).length,t:boxed.filter(r=>has(r,'pt',d)).length,mjOk:!mjs.length||mjs.some(r=>has(r,'oui',d)||has(r,'pt',d))}))
    .filter(x=>x.o||x.t).sort((a,b)=>(b.mjOk-a.mjOk)||(b.o+b.t/2)-(a.o+a.t/2)||a.d.localeCompare(b.d)).slice(0,5);
  const textOnly=resp.filter(r=>!(r.oui||[]).length&&!(r.pt||[]).length).map(r=>r.nom);
  return `<div class="tally"><h3 class="label">Décompte des cases, sans Claude</h3>
   ${rows.length?`<ol class="plain">${rows.map(x=>`<li><strong>${esc(cap(fmtDay(x.d)))}</strong> <span class="muted small">${x.o} dispo${x.t?` · ${x.t} si besoin`:''} sur ${resp.length}${x.mjOk?'':' · MJ indisponible'}</span></li>`).join('')}</ol>`:emptyMsg('Aucun jour à venir n’est coché.')}
   ${textOnly.length?`<p class="hint">Pas comptés ici, car ils ont seulement écrit un texte : ${esc(textOnly.join(', '))}.</p>`:''}</div>`;
}

/* ---------- Analyse par Claude ---------- */
function pollPrompt(p,resp){
  const today=todayISO(),wd=iso=>JOURS[dayDate(iso).getDay()],days=pollDays(p).filter(d=>d>=today);
  const lst=a=>a&&a.length?a.map(d=>`${d} (${wd(d)})`).join(', '):'aucune case';
  const nb=Math.max(1,num(p.nb,1)),miss=missingNames(p.id);
  return `Tu aides une table de jeu de rôle (campagne Daggerheart « Faim de Quête ») à choisir ses prochaines dates de séance.

Aujourd’hui : ${today} (${wd(today)}).
Sondage : « ${p.titre||'Sondage de dates'} ».
Période : du ${p.debut} au ${p.fin}. Ne propose que des jours de la liste ci-dessous.
Nombre de dates à trouver : ${nb}.
Horaire habituel : ${p.heure?'à partir de '+p.heure:'non précisé'}, durée d’environ ${num(p.duree,4)} h.
Règles de la table : ${p.regles||DEF_REGLES}

Jours possibles :
${days.map(d=>`${d} ${wd(d)}`).join('\n')}

Réponses (${resp.length}) :
${resp.map(r=>`- ${r.nom}${r.mj?' (MJ)':''}
  Disponible : ${lst(r.oui)}
  Si besoin : ${lst(r.pt)}
  Texte libre : ${r.texte?'« '+String(r.texte).replace(/\s+/g,' ').trim()+' »':'aucun'}`).join('\n')}
${miss.length?`\nJoueurs attendus qui n’ont pas encore répondu : ${miss.join(', ')}.\n`:''}
Consignes :
1. Pour chaque personne, combine ses cases et son texte. Si le texte contredit les cases, suis le texte. Applique aux jours de la liste les formulations comme « tous les vendredis sauf le 12 », « pas avant 20 h » ou « plutôt le week-end ».
2. Un jour qu’une personne n’a ni coché ni évoqué, elle est incertaine, pas absente. « Si besoin » compte comme présent, mais moins bien que « disponible ». Un joueur qui n’a pas répondu est incertain partout.
3. Si l’horaire habituel pose problème à quelqu’un un jour donné, signale-le dans la note de ce jour.
4. Classe les jours : d’abord ceux qui respectent les règles de la table, puis le plus de présents, puis le moins d’incertains.
5. Propose de ${nb} à ${Math.min(12,nb+4)} jours, le meilleur en premier. ${nb>1?`Les ${nb} premiers doivent former ensemble la meilleure sélection (en respectant l’espacement demandé par les règles), même si un autre jour a un peu plus de présents.`:'Le premier est ta recommandation.'}
6. N’invente aucune disponibilité. Écris les noms exactement comme ci-dessus.

Réponds uniquement avec un objet JSON de cette forme :
{"resume":"2 à 4 phrases en français, adressées à la table, qui expliquent la sélection conseillée","dates":[{"date":"AAAA-MM-JJ","presents":["Nom"],"incertains":["Nom"],"absents":["Nom"],"note":"une phrase courte"}],"questions":["une question courte à poser à quelqu’un dont la réponse est ambiguë"]}`;
}
function cleanAnalyse(o,p){
  const arr=(a,n)=>(Array.isArray(a)?a:[]).map(x=>String(x).trim().slice(0,n)).filter(Boolean).slice(0,20);
  const seen=new Set(),dates=[];
  for(const x of (o&&Array.isArray(o.dates)?o.dates:[])){const d=String(x&&x.date||'');
    if(!isISO(d)||d<p.debut||d>p.fin||seen.has(d)) continue;seen.add(d);
    dates.push({date:d,presents:arr(x.presents,60),incertains:arr(x.incertains,60),absents:arr(x.absents,60),note:String(x.note||'').slice(0,300)});
    if(dates.length>=15) break;}
  return {quand:Date.now(),resume:String(o&&o.resume||'').slice(0,900),dates,questions:arr(o&&o.questions,240).slice(0,6)};
}
const SAMPLE_OFF=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
const SAMPLE_MSG={rate_limited:'Trop de demandes, ou ta limite d’usage Claude est atteinte : réessaie plus tard.',session_expired:'Ta session Claude a expiré : reconnecte-toi, puis réessaie.',invalid_json:'La réponse de Claude était illisible. Réessaie.',empty_completion:'Claude n’a rien proposé. Réessaie.',empty_result:'Claude n’a trouvé aucune date dans la période. Vérifie les réponses, puis réessaie.',refused:'Claude a refusé cette demande. Relis les textes des réponses.',prompt_too_large:'Les réponses sont trop longues pour une seule analyse : raccourcis les textes.'};
async function runPoll(id){
  const p=pollOf(id);if(!p||!S.sample||S.pollRun) return;
  const resp=pollResp(id);if(!resp.length){toast('Personne n’a encore répondu.');return;}
  const ctl=new AbortController();S.pollRun={id,ctl,phase:'pense'};S.pollErr=null;render();
  try{
    const out=await S.sample.json(pollPrompt(p,resp),{modelTier:'default',cache:false,signal:ctl.signal,
      onText:()=>{if(S.pollRun&&S.pollRun.phase!=='ecrit'){S.pollRun.phase='ecrit';scheduleRender();}}});
    const an=cleanAnalyse(out,p);
    if(!an.dates.length) throw {code:'empty_result'};
    S.pollAI[id]=an;
    if(canCreate()) patch('sondages',id,{analyse:an});
  }catch(e){const c=e&&e.code;
    if(SAMPLE_OFF.includes(c)) S.sampleOff=true;
    else if(c!=='cancelled') S.pollErr={id,msg:SAMPLE_MSG[c]||'Claude n’a pas pu répondre. Réessaie dans un instant.'};}
  S.pollRun=null;render();
}

/* ---------- Agenda ---------- */
function evTimes(d){
  if(!/^\d{1,2}:\d{2}/.test(d.heure||'')) return {allDay:true,start:d.date.replace(/-/g,''),end:addDays(d.date,1).replace(/-/g,'')};
  const [y,m,dd]=d.date.split('-').map(Number),[h,mi]=d.heure.split(':').map(Number),s=new Date(y,m-1,dd,h,mi),e=new Date(s.getTime()+num(d.duree,4)*3600e3);
  const f=t=>t.getFullYear()+pad2(t.getMonth()+1)+pad2(t.getDate())+'T'+pad2(t.getHours())+pad2(t.getMinutes())+'00';
  return {allDay:false,start:f(s),end:f(e)};
}
function gcalURL(d){
  const t=evTimes(d),c=S.config||{};let tz='Europe/Paris';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz;}catch(e){}
  const details=`Faim de Quête, deuxième campagne Daggerheart.${c.discord?'\nDiscord : '+c.discord:''}`;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Faim de Quête · '+(d.titre||'Tournage'))+'&dates='+t.start+'/'+t.end+'&details='+encodeURIComponent(details)+(t.allDay?'':'&ctz='+encodeURIComponent(tz));
}
function soonHTML(up){
  return up.filter(d=>daysUntil(d.date)<=7).map(d=>{const n=daysUntil(d.date);
    return `<div class="soon" role="note">${ico('agenda')}<span><strong>${n===0?'C’est aujourd’hui':n===1?'C’est demain':'Dans '+n+' jours'}</strong> : ${esc(d.titre||'Tournage')}, ${esc(fmtDay(d.date))}${d.heure?' à '+esc(d.heure):''}.</span></div>`;}).join('');
}

/* ---------- Accueil : liste des sondages ---------- */
function pollsHTML(){
  const all=list('sondages').sort((a,b)=>num(b.cree)-num(a.cree)),open=all.filter(p=>p.statut!=='clos'),closed=all.filter(p=>p.statut==='clos').slice(0,3);
  const me=norm(LS.get('nom','')||'');
  const item=p=>{const r=pollResp(p.id),miss=missingNames(p.id),done=me&&r.some(x=>norm(x.nom)===me);
    return `<li class="poll-item"><a href="#sondage-${p.id}" class="min0"><strong>${esc(p.titre||'Sondage de dates')}</strong><span class="muted small">${esc(pollMeta(p))}</span><span class="small">${r.length} réponse${r.length>1?'s':''}${miss.length?` · en attente : ${esc(miss.join(', '))}`:''}</span></a>
    ${p.statut==='clos'?'<span class="chip">Clos</span>':done?'<span class="chip ok">Tu as répondu</span>':`<a class="btn small primary" href="#sondage-${p.id}">Répondre</a>`}</li>`;};
  return `<section class="panel"><header><h2>Sondages de dates</h2>${canEditLore()&&!S.newPoll?`<button type="button" class="btn small" data-act="newpoll">${ico('plus')} Nouveau sondage</button>`:''}</header>
   ${canEditLore()&&S.newPoll?newPollForm():''}
   ${open.length?`<ul class="plain polls">${open.map(item).join('')}</ul>`:emptyMsg(canEditLore()?'Aucun sondage en cours. Lance-en un pour décider ensemble des prochaines dates.':'Aucun sondage en cours.')}
   ${isMJ()&&closed.length?`<h3 class="label">Sondages clos</h3><ul class="plain polls">${closed.map(item).join('')}</ul>`:''}</section>`;
}

   <div class="row"><label class="field"><span>Du</span><input type="date" name="debut" id="f-npd" value="${addDays(t,1)}" required></label><label class="field"><span>Au</span><input type="date" name="fin" id="f-npf" value="${addDays(t,42)}" required></label></div>
   <div class="row"><label class="field"><span>Dates à trouver</span><input type="number" name="nb" id="f-npn" min="1" max="10" value="2"></label><label class="field"><span>Heure habituelle</span><input type="time" name="heure" id="f-nph" value="${esc(last?last.heure:'')}"></label></div>
   <div class="btns"><button class="btn primary" type="submit">Créer et répondre</button><button class="btn ghost" type="button" data-act="newpoll-cancel">Annuler</button></div></form>`;
}
function sondageForm(){const e=S.editing,p=D.sondages[e.id]||{};
  return `<div class="wrap narrow"><form class="form panel" data-form="sondage"><header><h2>Modifier le sondage</h2></header>

   <label class="field"><span>Dates à trouver</span><input type="number" min="1" max="10" name="nb" id="f-snb" value="${num(p.nb,1)}"></label></div>
  <div class="row"><label class="field"><span>Heure de début habituelle</span><input type="time" name="heure" id="f-sheure" value="${esc(p.heure||'')}"></label>
   <label class="field"><span>Durée d’une séance (heures)</span><input type="number" min="1" max="12" step="0.5" name="duree" id="f-sduree" value="${num(p.duree,4)}"></label></div>

  <div class="btns"><button class="btn primary" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-act="cancel">Annuler</button></div></form></div>`;}
function checkPeriod(debut,fin){
  if(!isISO(debut)||!isISO(fin)) return 'Indique le début et la fin de la période.';
  if(fin<debut) return 'La fin de la période doit venir après le début.';
  if(addDays(debut,185)<fin) return 'Période trop longue : six mois au maximum.';
  return '';
}

/* ---------- Actions et formulaires des sondages ---------- */
const ACT_POLL={

  pday(el){const dr=S.pollDraft,d=el.dataset.d;if(!dr) return;

    const days=pollDays(p).filter(d=>d>=today&&wds.includes(dayDate(d).getDay()));if(!days.length) return;

  pfix(el){const p=pollOf(el.dataset.id),d=el.dataset.d;if(!p) return;

};
const FORM_POLL={
  newpoll(f){const fd=new FormData(f),debut=str(fd,'debut'),fin=str(fd,'fin'),bad=checkPeriod(debut,fin);if(bad){toast(bad);return;}
    const id=uid();put('sondages',id,{titre:str(fd,'titre')||'Prochaines séances',debut,fin,nb:clamp(num(fd.get('nb'),1),1,10),heure:str(fd,'heure'),duree:4,regles:DEF_REGLES,statut:'ouvert',cree:Date.now()});

    put('sondages',e.id,{...(D.sondages[e.id]||{}),titre:str(fd,'titre')||'Prochaines séances',debut,fin,nb:clamp(num(fd.get('nb'),1),1,10),heure:str(fd,'heure'),

    closeEdit();},
  dispo(){const p=pollOf(S.route.id),dr=S.pollDraft;if(!p||!dr) return;const nom=String(dr.nom||'').trim();

    if(!dr.oui.size&&!dr.pt.size&&!dr.texte.trim()){toast('Coche au moins un jour, ou décris tes dispos dans le texte.');return;}
    const id=dispoId(p.id,nom),maj=Date.now();
    put('dispos',id,{sondage:p.id,nom,mj:!!dr.mj,oui:[...dr.oui].sort(),pt:[...dr.pt].sort(),texte:dr.texte.trim().slice(0,1500),maj});
    dr.nom=nom;dr.dirty=false;dr.src=maj;if(!isMJ()||dr.mj) LS.set('nom',nom);toast('Dispos enregistrées. Merci !');},
};
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.input,dr=S.pollDraft;if(!dr) return;
  if(k==='pnom') dr.nom=t.value;
  else if(k==='ptexte'){dr.texte=t.value;dr.dirty=true;}

});
</script>
<script>
/* ---------- Petits outils d'interface ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},3600);}
function openEdit(kind,id,draft){S.editing={kind,id:id||null,draft:draft||{}};S.formOpen=false;S.modal=null;render();window.scrollTo(0,0);}
function closeEdit(){S.editing=null;S.formOpen=false;scheduleRender();}
function go(hash){if(location.hash===hash) scheduleRender();else location.hash=hash;}

/* ---------- Actions (clics) ---------- */
const ACT={
  mode(el){S.mode=el.dataset.mode;LS.set('mode',S.mode);S.editing=null;S.formOpen=false;

  levelup(el){S.lvl={sel:{},traits:new Set(),xp:new Set(),newxp:'',extra:'',carte:'',mclasse:'',mdom:''};openEdit('levelup',el.dataset.id);},
  lsel(el){const k=el.dataset.key,a=ADV.find(x=>x.k===k.split('-')[1]),cur=num(S.lvl.sel[k]);
    if(el.dataset.on==='1'){if(cur<=1) delete S.lvl.sel[k];else S.lvl.sel[k]=cur-1;}

    if(!selCount('traits')) S.lvl.traits.clear();if(!selCount('xp')) S.lvl.xp.clear();if(!selCount('carte')) S.lvl.extra='';if(!selCount('multi')){S.lvl.mclasse='';S.lvl.mdom='';}

  claim(el){S.mine.add(el.dataset.id);LS.set('mine',[...S.mine]);toast('Fiche ajoutée à « Mes personnages » sur cet appareil.');render();},

Object.assign(ACT,ACT_POLL);
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el) return;const f=ACT[el.dataset.act];if(f) f(el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}});

async function uploadInto(inp){
  const name=inp.dataset.upload,file=inp.files&&inp.files[0],st=document.getElementById('st-'+name);if(!file) return;

  catch(err){st.textContent=({too_large:'Image trop lourde : 20 Mo au maximum.',unsupported_type:'Format non pris en charge : utilise PNG, JPEG, WebP ou GIF.',quota_or_state:'Le stockage d’images est plein.',rate_limited:'Trop d’envois d’un coup : réessaie dans un instant.'})[err&&err.code]||'L’envoi a échoué. Réessaie.';}

}

  config(f){const fd=new FormData(f);setConfig({accroche:str(fd,'accroche'),saison:str(fd,'saison'),discord:str(fd,'discord')});closeEdit();},
  date(f){const fd=new FormData(f);if(!fd.get('date')) return;put('dates',uid(),{date:fd.get('date'),heure:str(fd,'heure'),titre:str(fd,'titre')});f.reset();},
  todo(f){const fd=new FormData(f);const t=str(fd,'texte');if(!t) return;put('todos',uid(),{texte:t,pour:fd.get('pour')==='mj'?'mj':'joueurs',fait:false,cree:Date.now()});f.reset();},
  compte(f){const fd=new FormData(f);const n=str(fd,'nom');if(!n) return;put('comptes',uid(),{nom:n,max:clamp(num(fd.get('max'),6),1,12),valeur:0,type:fd.get('type')==='consequence'?'consequence':'progression',cree:Date.now()});f.reset();},
  lore(f){const fd=new FormData(f),e=S.editing,titre=str(fd,'titre');if(!titre) return;
    const dup=TI.get(norm(titre));if(dup&&dup!==e.id){toast('Une page porte déjà ce titre : choisis-en un autre pour que les liens restent clairs.');return;}
    const id=e.id||slugId(titre);
    put('lore',id,{...(e.id?D.lore[e.id]:{}),titre,type:fd.get('type'),resume:str(fd,'resume'),secret:fd.get('secret')==='on',contenu:String(fd.get('contenu')||''),notesMJ:String(fd.get('notesMJ')||''),image:fd.get('image')||'',maj:Date.now()});
    closeEdit();go('#page-'+id);},
  perso(f){const fd=new FormData(f),e=S.editing,nom=str(fd,'nom');if(!nom) return;
    const id=e.id||slugId(nom),prev=e.id?D.persos[e.id]:e.draft,n=k=>num(fd.get(k));
    if(n('niveau')<=1&&!traitsValid(TRAITS.map(([k])=>n('t-'+k)))){
      if(!isMJ()){toast('Répartis exactement +2, +1, +1, 0, 0 et −1 entre tes traits avant d’enregistrer.');document.getElementById('tcheck')?.scrollIntoView({block:'center'});return;}
      toast('Attention : la répartition des traits ne suit pas celle du livre.');}
    const bon=parseBonus(fd.get('bonus'));
    if(bon.bad.length){toast(`Bonus non reconnu : « ${bon.bad[0]} ». Écris par exemple « Untouchable : Évasion +1 ».`);document.getElementById('f-bonus')?.focus();return;}
    const wpn=k=>({nom:str(fd,k+'-nom'),trait:str(fd,k+'-trait'),portee:str(fd,k+'-portee'),degats:str(fd,k+'-degats')});
    const av=fd.get('armure')||'';
    const armureEq=!av?null:av==='__autre'?{nom:str(fd,'armNom')||'Armure',score:Math.max(0,n('armScore')),maj:Math.max(0,n('armMaj')),gra:Math.max(0,n('armGra')),effet:str(fd,'armEffet')}:{nom:av};
    const d={...prev,nom,joueur:str(fd,'joueur'),pronoms:str(fd,'pronoms'),classe:fd.get('classe')||'',sousClasse:str(fd,'sousClasse'),niveau:clamp(n('niveau')||1,1,10),
      ascendance:str(fd,'ascendance'),communaute:str(fd,'communaute'),portrait:fd.get('portrait')||'',
      traitsBase:Object.fromEntries(TRAITS.map(([k])=>[k,clamp(n('t-'+k),-3,8)])),
      evasionBase:n('evasionBase'),pvBase:clamp(n('pvBase')||6,1,12),armureEq,bonus:bon.ok,
      arme1:wpn('arme1'),arme2:wpn('arme2'),experiences:parseExp(fd.get('experiences')||''),capacites:parseCap(fd.get('capacites')||''),cartes:fd.getAll('cartes'),
      or:{poignees:Math.max(0,n('or-poignees')),bourses:Math.max(0,n('or-bourses')),coffre:Math.max(0,n('or-coffre'))},
      vitalite:fd.getAll('vitalite').slice(0,2),
      inventaire:String(fd.get('inventaire')||''),secret:String(fd.get('secret')||''),notes:String(fd.get('notes')||''),maj:Date.now(),v:2};
    for(const k of ['traits','evasion','armure','maitrise','seuilMajeur','seuilGrave','pvMax','stressMax']) delete d[k];
    const R=computeStats(d);
    d.pv=Math.min(num(d.pv),clamp(R.pvMax.total,1,12));d.stress=Math.min(num(d.stress),clamp(R.stressMax.total,1,12));d.armureMarques=Math.min(num(d.armureMarques),clamp(R.armure.total,0,12));d.espoir=clamp(num(d.espoir,2),0,6);
    if(!e.id&&!isMJ()){S.mine.add(id);LS.set('mine',[...S.mine]);}
    put('persos',id,d);closeEdit();go('#perso-'+id);},
  sort(f){const fd=new FormData(f),e=S.editing,data=readSort(fd);if(!data.nom) return;
    const id=e.id||slugId(data.nom);
    if(!e.id&&!isMJ()){S.mySorts.add(id);LS.set('mysorts',[...S.mySorts]);}
    put('sorts',id,{...(e.id?D.sorts[e.id]:{}),...data,maj:Date.now()});closeEdit();S.modal={id};go('#sorts');},
  levelup(){applyLevel();},
  scene(f){const fd=new FormData(f),e=S.editing,code=str(fd,'code');if(!code) return;
    const id=e.id||'sc-'+uid();
    const data={...(e.id?D.scenes[e.id]:{}),code,titre:str(fd,'titre'),session:str(fd,'session'),resume:str(fd,'resume'),possibilites:String(fd.get('possibilites')||''),contenu:String(fd.get('contenu')||''),suites:fd.getAll('suites').filter(x=>x!==id),maj:Date.now()};
    delete data.from;put('scenes',id,data);
    const from=new Set(fd.getAll('from'));
    for(const oid of e.shown||[]){const o=D.scenes[oid];if(!o) continue;const has=(o.suites||[]).includes(id);
      if(from.has(oid)&&!has) put('scenes',oid,{...o,suites:[...(o.suites||[]),id]});
      else if(!from.has(oid)&&has) put('scenes',oid,{...o,suites:o.suites.filter(x=>x!==id)});}
    S.session=data.session||'Sans session';LS.set('session',S.session);closeEdit();go('#scene-'+id);},
};
Object.assign(FORM,FORM_POLL);
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f) return;e.preventDefault();const h=FORM[f.dataset.form];if(h) h(f);});

/* ---------- Sauvegardes ---------- */
function exportObj(){const c={...S.config};delete c.sauvegardes;return {app:'faim-de-quete',version:1,date:new Date().toISOString(),config:c,table:{...S.table},collections:Object.fromEntries(COLS.map(k=>[k,D[k]]))};}
async function saveFile(name,text){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(!dl){toast('Le téléchargement n’est pas disponible ici.');return;}
  try{await dl.save({filename:name,data:text});toast('Fichier téléchargé.');}
  catch(e){if(!e||e.code!=='declined') toast(e&&e.code==='rate_limited'?'Une demande de téléchargement est déjà ouverte.':'Le téléchargement a échoué.');}
}
function exportAll(){saveFile(`faim-de-quete-${todayISO()}.json`,JSON.stringify(exportObj(),null,2));}
async function downloadBackup(date,parts){
  if(!S.db) return noDb();
  try{let json='';for(let i=0;i<parts;i++){const d=await S.db.collection('sauvegardes').doc(`${date}_p${i}`).get();if(!d.exists) throw {code:'missing'};json+=d.data().json||'';}
    saveFile(`faim-de-quete-sauvegarde-${date}.json`,json);}
  catch(e){toast(e&&e.code==='missing'?'Cette sauvegarde est incomplète.':errMsg(e));}
}
async function maybeBackup(){
  if(maybeBackup.done||!S.db||S.readOnly) return;maybeBackup.done=true;
  const today=todayISO(),bl=S.config.sauvegardes||[];
  if(bl.some(b=>b.date===today)) return;
  if(!COLS.some(c=>Object.keys(D[c]).length)) return;
  const json=JSON.stringify(exportObj()),size=90000,parts=Math.max(1,Math.ceil(json.length/size));
  try{
    for(let i=0;i<parts;i++) await S.db.collection('sauvegardes').doc(`${today}_p${i}`).set({date:today,part:i,parts,json:json.slice(i*size,(i+1)*size)});
    const next=[{date:today,parts},...bl.filter(b=>b.date!==today)].sort((a,b)=>b.date.localeCompare(a.date));
    await setConfig({sauvegardes:next.slice(0,7)});
    for(const b of next.slice(7)) for(let i=0;i<num(b.parts,1);i++) await S.db.collection('sauvegardes').doc(`${b.date}_p${i}`).delete();
  }catch(e){}
}
function readImport(inp){
  const file=inp.files&&inp.files[0];if(!file) return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='faim-de-quete'||!o.collections) throw 0;S.importData=o;render();}catch(e){toast('Ce fichier n’est pas une sauvegarde de Faim de Quête.');}};
  r.readAsText(file);inp.value='';
}
async function doImport(){
  const o=S.importData;S.importData=null;if(!o||!S.db) return noDb();
  S.busy='Restauration en cours… ne ferme pas la page.';render();
  try{
    for(const c of COLS){const inc=o.collections[c]||{};
      for(const id of Object.keys(D[c])) if(!(id in inc)) await S.db.collection(c).doc(id).delete();
      for(const [id,v] of Object.entries(inc)) await S.db.collection(c).doc(id).set(v);}
    if(o.config) await S.db.doc('meta/config').set({...o.config,sauvegardes:S.config.sauvegardes||[]});
    if(o.table) await S.db.doc('meta/table').set(o.table);
    toast('Sauvegarde restaurée.');
  }catch(e){toast(errMsg(e));}
  S.busy=null;render();
}

/* ---------- Navigation et démarrage ---------- */
function parseRoute(){const h=decodeURIComponent(location.hash.slice(1));let m;
  if((m=h.match(/^(page|perso|scene|sondage)-([A-Za-z0-9_.~:@+-]+)$/))) return {v:m[1],id:m[2]};
  return {v:['lore','graphe','persos','sorts','ecran'].includes(h)?h:'accueil',id:null};}
window.addEventListener('hashchange',()=>{S.route=parseRoute();S.editing=null;S.formOpen=false;S.confirm=null;S.modal=S.route.v==='sorts'?S.modal:null;render();window.scrollTo(0,0);});
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawTree,150);});
document.getElementById('dl-asc').innerHTML=ASC.map(x=>`<option value="${x}">`).join('');
document.getElementById('dl-com').innerHTML=COM.map(x=>`<option value="${x}">`).join('');

async function init(){
  S.route=parseRoute();render();
  const c=window.claude;
  if(!c||!c.use){S.dbState='absent';render();return;}
  c.use('sample').then(s=>{S.sample=s||null;scheduleRender();}).catch(()=>{});
  let db=null,user=null,assets=null;
  try{[db,user,assets]=await Promise.all([c.use('db'),c.use('user').catch(()=>null),c.use('assets').catch(()=>null)]);}catch(e){}
  if(!db){S.dbState='absent';render();return;}
  S.db=db;S.assets=assets;
  try{const w=user&&user.can?await user.can('data.write'):null;if(w===false) S.readOnly=true;}catch(e){}
  const timer=setTimeout(()=>{if(S.dbState==='loading'){S.dbState='slow';scheduleRender();}},10000);
  const need=COLS.length+2,confirmed=new Set();
  const done=(k,meta)=>{if(meta&&!meta.fromCache) confirmed.add(k);
    if(confirmed.size===need&&S.dbState!=='ok'){S.dbState='ok';clearTimeout(timer);maybeBackup();}
    scheduleRender();};
  const fail=e=>{clearTimeout(timer);S.dbState=e&&e.code==='revoked'?'absent':'slow';scheduleRender();};
  COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{let v=d.data();const p=PEND[col+'/'+d.id];if(p) v={...v,...p.data};m[d.id]=v;});
    D[col]=m;done(col,snap.metadata);},fail));
  db.doc('meta/config').onSnapshot(d=>{S.config=d.exists?d.data():{};done('config',d.metadata);},fail);
  db.doc('meta/table').onSnapshot(d=>{if(!PDOC.table) S.table=d.exists?d.data():{peur:0};done('table',d.metadata);},fail);
}
if(!window.FB_MODE) init();
</script>
<script>
/* ---------- Version Firebase : données, connexion du MJ, images ---------- */
const FB_MJ_ONLY=['scenes','comptes'];
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const IMG={};
let FB=null,UNSUB=[];
window.FBREADY=new Promise((res,rej)=>{window.__fbResolve=res;window.__fbReject=rej;});

/* Images rangées dans la base (collection images), chargées à la demande */
imgAttr=function(id){return `src="${IMG[id]||BLANK}" data-img="${esc(id)}"`;};
async function loadImg(id){
  IMG[id]=null;
  try{const d=await S.db.doc('images/'+id).get();IMG[id]=d.exists?String(d.data().data||''):'';}catch(e){IMG[id]='';}
  if(IMG[id]) document.querySelectorAll('img[data-img]').forEach(im=>{if(im.dataset.img===id) im.src=IMG[id];});
}
new MutationObserver(()=>{if(!S.db) return;document.querySelectorAll('img[data-img]').forEach(im=>{const id=im.dataset.img;if(id&&!(id in IMG)) loadImg(id);});})
  .observe(document.body,{childList:true,subtree:true});
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:'unsupported_type'});i.src=url;});
    let max=1400,q=.82;
    for(let k=0;k<7;k++){
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let out=c.toDataURL('image/webp',q);if(!out.startsWith('data:image/webp')) out=c.toDataURL('image/jpeg',q);
      if(out.length<700000) return out;
      max=Math.round(max*.75);q=Math.max(.5,q-.08);
    }
    throw {code:'too_large'};
  }finally{URL.revokeObjectURL(url);}
}
const fbAssets={async upload(file){
  const data=await compressImage(file),id=uid()+uid();
  await S.db.doc('images/'+id).set({data,maj:Date.now()});IMG[id]=data;return {id,url:data};
}};

/* Téléchargement direct (hors de Claude, le navigateur s'en charge) */
saveFile=async function(name,text){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Fichier téléchargé.');}
  catch(e){toast('Le téléchargement a échoué.');}
};

/* Sauvegarde du jour : seulement quand le MJ est connecté */
const _maybeBackup=maybeBackup;
maybeBackup=function(){if(!S.fbMJ) return;return _maybeBackup();};

/* Messages d'erreur adaptés à Firebase */
const _errMsg=errMsg;
errMsg=function(e){
  if(e&&e.code==='resource_exhausted') return 'Limite gratuite du jour atteinte : réessaie demain.';
  return _errMsg(e);
};
writeErr=function(e,op){
  if(isRefusal(e)){keepUnsent(op);toast(S.fbMJ?'Modification refusée : vérifie les règles Firebase (étape 4 du guide).':'Modification refusée : réservée au MJ. Elle reste gardée sur cet appareil.');scheduleRender();}
  else{if(e&&e.code==='unavailable') keepUnsent(op);toast(errMsg(e));}
};
function fbErrBanner(){
  const m={config:'La configuration Firebase manque dans index.html (étape 2 du guide).',
    sdk:'Impossible de charger Firebase : vérifie la connexion internet, puis recharge la page.',
    admin_restricted_operation:'La connexion anonyme n’est pas activée dans Firebase (étape 5 du guide).',
    operation_not_allowed:'La connexion anonyme n’est pas activée dans Firebase (étape 5 du guide).',
    permission_denied:'Firebase refuse l’accès aux données : vérifie les règles (étape 4 du guide).'}[S.fbErr];
  return m?`<div class="banner">${m}</div>`:'';
}

/* Un envoi refusé ne bascule pas le site en lecture seule : seul le MJ a plus de droits */
const _sendUnsent=sendUnsent;
sendUnsent=async function(){await _sendUnsent();S.readOnly=false;render();};

/* Mode MJ = connexion Google au compte du MJ */
const _modeAct=ACT.mode;
ACT.mode=async function(el){
  if(el.dataset.mode!=='mj'||S.fbMJ) return _modeAct(el);
  if(!FB){toast('La connexion n’est pas encore prête.');return;}
  S.wantMJ=true;
  try{await FB.google();}
  catch(e){S.wantMJ=false;
    if(e.code==='popup_closed_by_user'||e.code==='cancelled_popup_request') return;
    toast(({popup_blocked:'Fenêtre bloquée : autorise les pop-up pour ce site, puis reclique sur MJ.',
      unauthorized_domain:'Adresse du site non autorisée dans Firebase (étape 7 du guide).',
      operation_not_allowed:'Connexion Google non activée dans Firebase (étape 5 du guide).',
      network_request_failed:'Pas de connexion internet.'})[e.code]||'La connexion a échoué.');}
};
ACT.fblogout=async function(){S.wantMJ=false;S.mode='joueur';LS.set('mode','joueur');S.editing=null;S.formOpen=false;
  if(S.route.v==='ecran'||S.route.v==='scene') go('#accueil');try{await FB.out();}catch(e){}};

async function onAuthFB(u){
  if(!u){S.fbMJ=false;
    try{await FB.anon();}catch(e){S.fbErr=e.code;S.dbState='absent';render();}
    return;}
  let mj=false;
  if(!u.isAnonymous){
    try{await S.db.doc('prive/mj').get();mj=true;}catch(e){mj=false;}
    if(!mj){S.wantMJ=false;toast('Ce compte Google n’est pas celui du MJ.');try{await FB.out();}catch(e){}return;}
  }
  S.fbMJ=mj;S.fbErr=null;S.readOnly=false;
  if(mj&&S.wantMJ){S.mode='mj';LS.set('mode','mj');S.wantMJ=false;toast('Connecté en MJ.');}
  if(!mj&&S.mode==='mj') S.mode='joueur';
  subscribeFB();
}
function subscribeFB(){
  UNSUB.forEach(f=>{try{f();}catch(e){}});UNSUB=[];
  const db=S.db,mj=S.fbMJ,cols=COLS.filter(c=>mj||!FB_MJ_ONLY.includes(c));
  if(!mj){FB_MJ_ONLY.forEach(c=>{D[c]={};});S.table={peur:0};}
  S.dbState='loading';scheduleRender();
  const timer=setTimeout(()=>{if(S.dbState==='loading'){S.dbState='slow';scheduleRender();}},10000);
  const need=cols.length+(mj?2:1),confirmed=new Set();
  const done=(k,meta)=>{if(!meta||!meta.fromCache) confirmed.add(k);
    if(confirmed.size>=need&&S.dbState!=='ok'){S.dbState='ok';clearTimeout(timer);if(mj) maybeBackup();}
    scheduleRender();};
  const fail=e=>{clearTimeout(timer);S.fbErr=e&&e.code;S.dbState=S.fbErr==='permission_denied'?'absent':'slow';scheduleRender();};
  cols.forEach(col=>{
    const src=col==='lore'&&!mj?db.collection('lore').where('secret','==',false):db.collection(col);
    UNSUB.push(src.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{let v=d.data();const p=PEND[col+'/'+d.id];if(p) v={...v,...p.data};m[d.id]=v;});
      D[col]=m;done(col,snap.metadata);},fail));
  });
  UNSUB.push(db.doc('meta/config').onSnapshot(d=>{S.config=d.exists?d.data():{};done('config',d.metadata);},fail));
  if(mj) UNSUB.push(db.doc('meta/table').onSnapshot(d=>{if(!PDOC.table) S.table=d.exists?d.data():{peur:0};done('table',d.metadata);},fail));
}
async function initFB(){
  S.route=parseRoute();
  if(S.mode==='mj'){S.wantMJ=true;S.mode='joueur';}
  render();
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey){S.fbErr='config';S.dbState='absent';render();return;}
  const t=setTimeout(()=>{if(!FB){S.fbErr='sdk';S.dbState='absent';render();}},15000);
  try{FB=await window.FBREADY;}catch(e){clearTimeout(t);S.fbErr='config';S.dbState='absent';render();return;}
  clearTimeout(t);if(S.fbErr==='sdk'){S.fbErr=null;S.dbState='loading';}
  S.db=FB.db;S.assets=fbAssets;S.sample=null;
  FB.onAuth(u=>{onAuthFB(u);});
}
initFB();
</script>

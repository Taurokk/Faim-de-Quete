<script>
/* ---------- Alertes : prochaine session et vote à faire (fenêtre à l'ouverture + bandeaux) ---------- */
S.alert={shown:false,open:false,html:''};
function nextSessions(){const t=todayISO();return list('dates').filter(d=>isISO(d.date)&&d.date>=t).sort((a,b)=>(a.date+(a.heure||'')).localeCompare(b.date+(b.heure||'')));}
const myName=()=>String((S.account&&S.account.nom)||LS.get('nom','')||'').trim();
function pendingPolls(){const me=norm(myName());
  return list('sondages').filter(p=>p.statut!=='clos'&&!(me&&pollResp(p.id).some(r=>norm(r.nom)===me))).sort((a,b)=>num(b.cree)-num(a.cree));}
function whenLabel(d){const n=daysUntil(d.date);return n===0?(d.heure?'Ce soir':'Aujourd’hui'):n===1?'Demain':'Dans '+n+' jours';}
function sessDay(d){return cap(fmtDay(d.date))+(d.heure?' à '+d.heure:'');}

/* Bandeaux en haut de chaque page */
function alertStripHTML(){
  if(S.dbState!=='ok'&&S.dbState!=='slow') return '';
  const s=nextSessions()[0],v=pendingPolls().filter(p=>!(S.route.v==='sondage'&&S.route.id===p.id));
  let h='';
  if(s) h+=`<div class="astrip sess" role="note"><span class="astrip-k">Prochaine session</span><span class="astrip-t"><strong>${esc(whenLabel(s))}</strong> · ${esc(sessDay(s))}${s.titre?' · '+esc(s.titre):''}</span></div>`;
  v.forEach(p=>{h+=`<div class="astrip vote" role="alert"><span class="astrip-k">Vote à faire</span><span class="astrip-t">${esc(p.titre||'Sondage de dates')}</span><button type="button" class="astrip-b" data-act="alertgo" data-id="${esc(p.id)}">Voter maintenant</button></div>`;});
  return h?`<div class="wrap astrips">${h}</div>`:'';
}

/* Fenêtre au milieu de l'écran, à chaque ouverture du site */
function alertPopHTML(){
  const ss=nextSessions(),s=ss[0],v=pendingPolls().filter(p=>!(S.route.v==='sondage'&&S.route.id===p.id)),me=myName();
  if(!s&&!v.length) return '';
  const voters=[...new Map(v.flatMap(p=>pollResp(p.id)).map(r=>[norm(r.nom),String(r.nom||'').trim()])).values()].filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));
  return `<div class="apop-back" data-act="alertclose"></div>
  <div class="apop" role="dialog" aria-modal="true" aria-labelledby="apop-t">
   ${s?`<section class="apop-sess">
     <p class="apop-k">Prochaine session</p>
     <h2 id="apop-t">${esc(whenLabel(s))}</h2>
     <p class="apop-date">${esc(sessDay(s))}</p>
     ${s.titre?`<p class="apop-sub">${esc(s.titre)}</p>`:''}
     <a class="apop-cal" href="${esc(gcalURL(s))}" target="_blank" rel="noopener">${ico('agenda','tiny')} Ajouter à Google Agenda</a>
     ${ss.length>1?`<p class="apop-more">Ensuite : ${ss.slice(1,4).map(d=>esc(fmtDay(d.date)+(d.heure?' à '+d.heure:''))).join(' · ')}</p>`:''}
   </section>`:''}
   ${v.length?`<section class="apop-vote">
     <p class="apop-k">Vote à faire</p>
     <h2 ${s?'':'id="apop-t"'}>${me?esc(me)+', tu n’as pas encore voté':'Tu n’as pas encore voté'}</h2>
     ${v.map(p=>`<div class="apop-poll"><span><strong>${esc(p.titre||'Sondage de dates')}</strong><small>${esc(pollMeta(p))}</small></span><button type="button" class="apop-go" data-act="alertgo" data-id="${esc(p.id)}">Voter maintenant</button></div>`).join('')}
     ${window.FB_MODE&&S.fbUser&&S.fbUser.anon?`<p class="apop-who">Connecte-toi une fois : le site saura que tu as voté, sur tous tes appareils.</p><button type="button" class="apop-login" data-act="fblogin">Se connecter avec Google</button>`:''}
     ${voters.length?`<p class="apop-who">${me?'Ce n’est pas toi ? Touche ton nom :':'Déjà voté depuis un autre appareil ? Touche ton nom :'}</p><div class="apop-names">${voters.filter(n=>norm(n)!==norm(me)).map(n=>`<button type="button" data-act="alertme" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
   </section>`:''}
   <button type="button" class="btn apop-ok" data-act="alertclose">J’ai vu</button>
  </div>`;
}
function renderAlert(){
  const el=document.getElementById('alertpop');if(!el) return;
  if(!S.alert.shown&&S.dbState==='ok'&&(!window.FB_MODE||S.accountReady)){S.alert.shown=true;
    const v=pendingPolls().filter(p=>!(S.route.v==='sondage'&&S.route.id===p.id));
    if(nextSessions().length||v.length) S.alert.open=true;}
  const h=S.alert.open?alertPopHTML():'';
  if(!h&&S.alert.open) S.alert.open=false;
  if(h!==S.alert.html){S.alert.html=h;el.innerHTML=h;if(h&&!el.contains(document.activeElement)) el.querySelector('.apop-ok')?.focus({preventScroll:true});}
  document.body.classList.toggle('apop-open',!!h);
}
function alertClose(){S.alert.open=false;renderAlert();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.alert.open) alertClose();});
const ACT_ALERT={
  alertclose(){alertClose();},
  alertgo(el){S.alert.open=false;go('#sondage-'+el.dataset.id);renderAlert();},
  alertme(el){LS.set('nom',el.dataset.n);S.pollDraft=null;toast('C’est noté : '+el.dataset.n+'.');render();},
};

async function maybeBackup(){
  if(maybeBackup.done||!S.db||S.readOnly) return;maybeBackup.done=true;
  const today=todayISO(),bl=S.config.sauvegardes||[];
  if(bl.some(b=>b.date===today)) return;
  if(!COLS.some(c=>Object.keys(D[c]).length)) return;

  try{
    for(let i=0;i<parts;i++) await S.db.collection('sauvegardes').doc(`${today}_p${i}`).set({date:today,part:i,parts,json:json.slice(i*size,(i+1)*size)});
    const next=[{date:today,parts},...bl.filter(b=>b.date!==today)].sort((a,b)=>b.date.localeCompare(a.date));
    await setConfig({sauvegardes:next.slice(0,7)});
    for(const b of next.slice(7)) for(let i=0;i<num(b.parts,1);i++) await S.db.collection('sauvegardes').doc(`${b.date}_p${i}`).delete();

async function init(){
  S.route=parseRoute();render();
  const c=window.claude;
  if(!c||!c.use){S.dbState='absent';render();return;}
  c.use('sample').then(s=>{S.sample=s||null;scheduleRender();}).catch(()=>{});
  let db=null,user=null,assets=null;
  try{[db,user,assets]=await Promise.all([c.use('db'),c.use('user').catch(()=>null),c.use('assets').catch(()=>null)]);}catch(e){}
  if(!db){S.dbState='absent';render();return;}
  S.db=db;S.assets=assets;
  try{const w=user&&user.can?await user.can('data.write'):null;if(w===false) S.readOnly=true;}catch(e){}
  const timer=setTimeout(()=>{if(S.dbState==='loading'){S.dbState='slow';scheduleRender();}},10000);
  const need=COLS.length+2,confirmed=new Set();
  const done=(k,meta)=>{if(meta&&!meta.fromCache) confirmed.add(k);
    if(confirmed.size===need&&S.dbState!=='ok'){S.dbState='ok';clearTimeout(timer);maybeBackup();}
    scheduleRender();};
  const fail=e=>{clearTimeout(timer);S.dbState=e&&e.code==='revoked'?'absent':'slow';scheduleRender();};
  COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{let v=d.data();const p=PEND[col+'/'+d.id];if(p) v={...v,...p.data};m[d.id]=v;});
    D[col]=m;done(col,snap.metadata);},fail));
  db.doc('meta/config').onSnapshot(d=>{S.config=d.exists?d.data():{};done('config',d.metadata);},fail);
  subscribeJets(db);
  db.doc('meta/table').onSnapshot(d=>{if(!PDOC.table) S.table=d.exists?d.data():{peur:0};done('table',d.metadata);},fail);
}
if(!window.FB_MODE) init();

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:'unsupported_type'});i.src=url;});
    let max=1400,q=.82;
    for(let k=0;k<7;k++){

      c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let out=c.toDataURL('image/webp',q);if(!out.startsWith('data:image/webp')) out=c.toDataURL('image/jpeg',q);
      if(out.length<700000) return out;
      max=Math.round(max*.75);q=Math.max(.5,q-.08);
    }
    throw {code:'too_large'};
  }finally{URL.revokeObjectURL(url);}
}

  const u=S.fbUser;if(!u||u.anon) return false;
  const old=S.account,d={nom:String(data.nom||'').trim().slice(0,40),perso:String(data.perso||''),maj:Date.now()};
  try{await S.db.doc('joueurs/'+u.uid).set(d);}
  catch(e){toast(isRefusal(e)?'Firebase refuse les comptes : le MJ doit ajouter la règle des comptes (guide, mise à jour « Comptes »).':errMsg(e));return false;}
  if(old&&old.perso&&old.perso!==d.perso){S.mine.delete(old.perso);LS.set('mine',[...S.mine]);}
  S.account=d;applyAccount();
  const p=d.perso&&D.persos[d.perso];if(p&&!String(p.joueur||'').trim()) patch('persos',d.perso,{joueur:d.nom});
  return true;
}
FORM.compte=async function(f){const fd=new FormData(f),nom=String(fd.get('nom')||'').trim();
  if(!nom){toast('Indique ton nom.');return;}
  if(await saveAccount({nom,perso:S.fbMJ?'':fd.get('perso')})){S.acctEdit=false;toast('Compte enregistré.');render();}};
const initial=n=>esc((String(n||'').trim()[0]||'?').toUpperCase());
function acctChipHTML(){const u=S.fbUser;if(!u) return '';
  if(u.anon) return `<button type="button" class="btn small acct-login" data-act="fblogin">${ico('users')} Se connecter</button>`;
  const n=S.account&&S.account.nom;
  return `<a class="acct-chip" href="#compte"><span class="acct-av">${initial(n||u.gname)}</span><span>${n?esc(n):'Mon compte'}</span></a>`;}
function acctTopHTML(){const u=S.fbUser;if(!u) return '';
  const n=S.account&&S.account.nom;
  return `<a class="acct-top ${u.anon?'anon':''}" href="#compte" aria-label="${u.anon?'Se connecter':'Mon compte'}">${u.anon?ico('users'):initial(n||u.gname)}</a>`;}
function vCompte(){
  const u=S.fbUser,a=S.account,mj=S.fbMJ;
  const shell=h=>`<div class="wrap narrow"><div class="page-head"><h1>Mon compte</h1></div>${h}</div>`;

  if(u.anon) return shell(`<section class="panel acct">
    <p class="acct-lead">Connecte-toi avec ton compte Google : le site saura qui tu es, sur tous tes appareils.</p>
    <ul class="acct-why"><li>Ton vote est reconnu partout : plus d’alerte « vote à faire » une fois que tu as voté.</li><li>Ta fiche de personnage est la tienne, sur ton téléphone comme sur ton ordinateur.</li><li>Ton nom est déjà rempli dans les sondages.</li></ul>
    <div class="btns"><button type="button" class="btn primary acct-big" data-act="fblogin">${ico('users')} Se connecter avec Google</button></div>
    <p class="hint">Le site garde seulement le nom et le personnage que tu choisis, pas ton adresse e-mail. Sans compte, tu peux toujours tout utiliser.</p></section>`);
  if(!S.accountReady) return shell(`<p class="empty">Chargement de ton compte…</p>`);
  if(S.acctErr) return shell(`<div class="banner">Les comptes ne sont pas encore activés dans Firebase : le MJ doit ajouter la règle des comptes (guide, mise à jour « Comptes »).</div>
    <div class="btns"><button type="button" class="btn ghost" data-act="fblogout">Se déconnecter</button></div>`);
  const persos=list('persos').sort(byNom);
  if(!a||S.acctEdit){
    const names=[...new Set([...expectedNames(),...list('dispos').map(r=>String(r.nom||'').trim()).filter(Boolean)])].sort((x,y)=>x.localeCompare(y,'fr'));
    const def=a?a.nom:(LS.get('nom','')||String(u.gname||'').split(' ')[0]||'');
    const cur=a?a.perso:([...S.mine].find(id=>D.persos[id])||'');
    return shell(`<form class="form panel acct" data-form="compte">
     <header><h2>${a?'Modifier mon compte':'Qui es-tu ?'}</h2>${mj?'<span class="chip">MJ</span>':''}</header>
     ${a?'':`<p class="acct-lead">Dernière étape : dis au site qui tu es. Tu ne le feras qu’une fois.</p>`}
     <label class="field"><span>Ton nom</span><input type="text" name="nom" id="f-anom" list="dl-anoms" value="${esc(def)}" maxlength="40" required placeholder="Prénom ou pseudo" autocomplete="off"></label>
     <datalist id="dl-anoms">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
     <p class="hint">${mj?'Tu es le MJ : ce nom sert pour tes réponses aux sondages.':'Le même nom que dans les sondages, pour que tes anciens votes soient reconnus.'}</p>
     ${mj?'':`<label class="field"><span>Ton personnage</span><select name="perso" id="f-aperso"><option value="">Pas encore de personnage</option>${persos.map(p=>`<option value="${esc(p.id)}" ${cur===p.id?'selected':''}>${esc(p.nom||'Sans nom')}${p.joueur?' · '+esc(p.joueur):''}</option>`).join('')}</select></label>`}
     <div class="btns"><button class="btn primary" type="submit">Enregistrer</button>${a?`<button type="button" class="btn ghost" data-act="acctcancel">Annuler</button>`:`<button type="button" class="btn ghost" data-act="fblogout">Se déconnecter</button>`}</div>
    </form>`);
  }
  const p=a.perso&&D.persos[a.perso];
  return shell(`<section class="panel acct">
    <div class="acct-id"><span class="acct-av big">${initial(a.nom)}</span><div class="min0"><strong>${esc(a.nom)}</strong><span class="muted">${mj?'Maître du jeu':p?'Joue '+esc(p.nom||'son personnage'):'Pas encore de personnage'}</span></div></div>
    <div class="btns"><button type="button" class="btn" data-act="acctedit">${ico('edit')} Modifier</button>${p?`<a class="btn ghost" href="#perso-${esc(a.perso)}">Ma fiche</a>`:''}<button type="button" class="btn ghost" data-act="fblogout">Se déconnecter</button></div>
    <p class="hint">Connecté avec Google${u.gname?' ('+esc(u.gname)+')':''}. Sur un autre appareil, clique sur « Se connecter » avec le même compte.</p>
  </section>${mj?joueursHTML():''}`);
}
function joueursHTML(){const js=list('joueurs').sort(byNom);
  return `<section class="panel"><header><h2>Comptes des joueurs</h2><span class="label">${js.length} compte${js.length>1?'s':''}</span></header>
  ${js.length?`<ul class="plain acct-list">${js.map(j=>{const p=j.perso&&D.persos[j.perso],k='joueurs:'+j.id;
    return `<li><span class="acct-av">${initial(j.nom)}</span><span class="min0"><strong>${esc(j.nom||'?')}</strong><span class="muted small">${j.id===S.fbUser.uid?'toi (MJ)':p?esc(p.nom):'pas de personnage'}</span></span>${j.id===S.fbUser.uid?'':`<button type="button" class="btn small danger" data-act="acctdel" data-id="${esc(j.id)}">${S.confirm===k?'Confirmer ?':ico('trash')}</button>`}</li>`;}).join('')}</ul>`
  :`<p class="empty">Aucun joueur n’a encore créé de compte.</p>`}
  <p class="hint">Supprimer un compte efface seulement le lien entre ce compte Google et un nom : le joueur choisira de nouveau à sa prochaine visite.</p></section>`;}

async function onAuthFB(u){
  if(ACCT_UNSUB){try{ACCT_UNSUB();}catch(e){}ACCT_UNSUB=null;}
  if(!u){S.fbMJ=false;S.fbUser=null;S.account=null;S.accountReady=false;
    try{await FB.anon();}catch(e){S.fbErr=e.code;S.dbState='absent';render();}
    return;}
  S.fbUser={uid:u.uid,anon:!!u.isAnonymous,gname:String(u.displayName||'').trim()};
  let mj=false;
  if(!u.isAnonymous){try{await S.db.doc('prive/mj').get();mj=true;}catch(e){mj=false;}}
  if(!u.isAnonymous&&!mj&&S.wantMJ){S.wantMJ=false;toast('Ce compte Google n’est pas celui du MJ : tu es connecté comme joueur.');}
  S.fbMJ=mj;S.fbErr=null;S.readOnly=false;
  if(mj&&S.wantMJ){S.mode='mj';LS.set('mode','mj');S.wantMJ=false;toast('Connecté en MJ.');}
  if(!mj&&S.mode==='mj') S.mode='joueur';
  if(u.isAnonymous){S.account=null;S.accountReady=true;}else watchAccount(u.uid);
  subscribeFB();
}
function subscribeFB(){
  UNSUB.forEach(f=>{try{f();}catch(e){}});UNSUB=[];
  const db=S.db,mj=S.fbMJ,cols=COLS.filter(c=>mj||!FB_MJ_ONLY.includes(c));
  if(!mj){FB_MJ_ONLY.forEach(c=>{D[c]={};});S.table={peur:0};}
  S.dbState='loading';scheduleRender();
  const timer=setTimeout(()=>{if(S.dbState==='loading'){S.dbState='slow';scheduleRender();}},10000);
  const need=cols.length+(mj?2:1),confirmed=new Set();
  const done=(k,meta)=>{if(!meta||!meta.fromCache) confirmed.add(k);
    if(confirmed.size>=need&&S.dbState!=='ok'){S.dbState='ok';clearTimeout(timer);if(mj) maybeBackup();}
    scheduleRender();};
  const fail=e=>{clearTimeout(timer);S.fbErr=e&&e.code;S.dbState=S.fbErr==='permission_denied'?'absent':'slow';scheduleRender();};
  cols.forEach(col=>{
    const src=col==='lore'&&!mj?db.collection('lore').where('secret','==',false):db.collection(col);
    UNSUB.push(src.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{let v=d.data();const p=PEND[col+'/'+d.id];if(p) v={...v,...p.data};m[d.id]=v;});
      D[col]=m;done(col,snap.metadata);},fail));
  });
  UNSUB.push(subscribeJets(db));
  UNSUB.push(db.doc('meta/config').onSnapshot(d=>{S.config=d.exists?d.data():{};done('config',d.metadata);},fail));
  if(mj) UNSUB.push(db.collection('joueurs').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});D.joueurs=m;scheduleRender();},()=>{}));
  else D.joueurs={};
  if(mj) UNSUB.push(db.doc('meta/table').onSnapshot(d=>{if(!PDOC.table) S.table=d.exists?d.data():{peur:0};done('table',d.metadata);},fail));
}
async function initFB(){
  S.route=parseRoute();
  if(S.mode==='mj'){S.wantMJ=true;S.mode='joueur';}
  render();
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey){S.fbErr='config';S.dbState='absent';render();return;}
  const t=setTimeout(()=>{if(!FB){S.fbErr='sdk';S.dbState='absent';render();}},15000);
  try{FB=await window.FBREADY;}catch(e){clearTimeout(t);S.fbErr='config';S.dbState='absent';render();return;}
  clearTimeout(t);if(S.fbErr==='sdk'){S.fbErr=null;S.dbState='loading';}
  S.db=FB.db;S.assets=fbAssets;S.sample=null;
  FB.onAuth(u=>{onAuthFB(u);});
}
initFB();

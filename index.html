."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Fallen Shock Troops à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 12 dégâts physiques ; additionne ces dégâts."}]},{"id":"fallen-sorcerer","nom":"Fallen Sorcerer","tier":4,"type":"Support","desc":"Un mage puissant, enchaîné par les marchés conclus de son vivant.","motifs":"Acquérir, décourager, dominer, tourmenter","diff":"19","seuils":"26/42","pv":"6","stress":"5","atk":"+4","arme":"Bâton corrompu","portee":"Far","degats":"4d6+10 mag","xp":"Savoir ancien +2","feats":[{"n":"Conflagration","k":"Action","t":"**Dépense une Peur** pour déchaîner une tempête de feu dévorante et attaquer toutes les cibles à portée proche. Les cibles touchées subissent **2d10+6** dégâts magiques directs."},{"n":"Nightmare Tableau","k":"Action","t":"**Marque un Stress** pour enfermer une cible à portée lointaine dans une illusion puissante de ses pires peurs. Prisonnière, la cible est *Entravée* et *Vulnérable* jusqu’à ce qu’elle se libère par un jet d’Instinct réussi, ce qui met fin aux deux états."},{"n":"Slippery","k":"Reaction","t":"Quand le Sorcier subit des dégâts d’une attaque, il peut se téléporter jusqu’à portée lointaine."}]},{"id":"fallen-warlord-realm-breaker","nom":"Fallen Warlord: Realm-Breaker","tier":4,"type":"Solo","desc":"Un Dieu Déchu nimbé de rage et de rancœur, fort de millénaires passés à briser l’esprit des héros.","motifs":"Corrompre, dominer, punir, briser les faibles","diff":"20","seuils":"36/66","pv":"8","stress":"5","atk":"+7","arme":"Fouet barbelé","portee":"Close","degats":"4d8+7 phy","xp":"Conquête +3, Histoire +2, Intimidation +3","feats":[{"n":"Relentless (2)","k":"Passive","t":"Le Briseur de royaumes peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Firespite Plate Armor","k":"Passive","t":"Quand le Briseur de royaumes subit des dégâts, réduis-les de **2d10**."},{"n":"Tormenting Lash","k":"Action","t":"**Marque un Stress** pour faire une attaque standard contre toutes les cibles à portée très proche. Une cible qui utilise son armure pour réduire les dégâts de cette attaque doit marquer 2 emplacements d’Armure."},{"n":"Doombringer","k":"Reaction","t":"Quand une cible marque des PV à cause d’une attaque du Briseur de royaumes, tous les PJ à portée lointaine de cette cible perdent un Espoir."},{"n":"I Have Never Known Defeat (Phase Change)","k":"Reaction","t":"Quand le Briseur de royaumes marque son dernier PV, remplace-le par le Champion invaincu (Undefeated Champion) et donne-lui aussitôt la main."}]},{"id":"fallen-warlord-undefeated-champion","nom":"Fallen Warlord: Undefeated Champion","tier":4,"type":"Solo","desc":"Ce que seuls les plus redoutés ont une chance de redouter.","motifs":"Donner une mort sans pitié, punir les insoumis, vaincre à tout prix","diff":"18","seuils":"35/58","pv":"11","stress":"5","atk":"+8","arme":"Épée brise-cœur","portee":"Very Close","degats":"4d12+13 phy","xp":"Conquête +3, Histoire +2, Intimidation +3","feats":[{"n":"Relentless (3)","k":"Passive","t":"Le Champion invaincu peut recevoir la main jusqu’à trois fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Faltering Armor","k":"Passive","t":"Quand le Champion invaincu subit des dégâts, réduis-les de **1d10**."},{"n":"Shattering Strike","k":"Action","t":"**Marque un Stress** pour faire une attaque standard contre toutes les cibles à portée très proche. Les PJ touchés perdent autant d’Espoir que de PV marqués à cause de cette attaque."},{"n":"Endless Legions","k":"Action","t":"**Dépense une Peur** pour invoquer deux fois plus de Fallen Shock Troops qu’il y a de PJ. Ils apparaissent à portée lointaine."},{"n":"Momentum","k":"Reaction","t":"Quand le Champion invaincu réussit une attaque contre un PJ, tu gagnes une Peur."},{"n":"Doombringer","k":"Reaction","t":"Quand une cible marque des PV à cause d’une attaque du Champion invaincu, tous les PJ à portée lointaine de cette cible perdent un Espoir."}]},{"id":"giant-beastmaster","nom":"Giant Beastmaster","tier":2,"type":"Leader","desc":"Un guerrier vêtu de cuir, armé d’un fouet et d’un arc gigantesque.","motifs":"Commander, gagner sa vie, manœuvrer, clouer sur place, protéger ses bêtes","diff":"16","seuils":"12/24","pv":"6","stress":"5","atk":"+2","arme":"Arc long","portee":"Far","degats":"2d8+4 phy","xp":"Dressage +3","feats":[{"n":"Two as One","k":"Passive","t":"Quand le Maître des bêtes reçoit la main, tu peux aussi la donner à un adversaire animal de rang 1 sous son contrôle."},{"n":"Pinning Strike","k":"Action","t":"Fais une attaque standard contre une cible. En cas de réussite, tu peux **marquer un Stress** pour la clouer à une surface proche. La cible clouée est *Entravée* jusqu’à ce qu’elle se libère par un jet de Finesse ou de Force réussi."},{"n":"Deadly Companion","k":"Action","t":"Deux fois par scène, invoque un Bear, un Dire Wolf ou un autre adversaire animal de rang 1 sous le contrôle du Maître des bêtes. Il apparaît à portée proche et reçoit aussitôt la main."}]},{"id":"giant-brawler","nom":"Giant Brawler","tier":2,"type":"Bruiser","desc":"Un géant particulièrement musclé, armé d’un marteau de guerre plus grand qu’un humain.","motifs":"Gagner sa vie, submerger, cogner, renverser","diff":"15","seuils":"14/28","pv":"7","stress":"4","atk":"+2","arme":"Marteau de guerre","portee":"Very Close","degats":"2d12+3 phy","xp":"Intrusion +2","feats":[{"n":"Battering Ram","k":"Action","t":"**Marque un Stress** : la Brute charge un objet inanimé à portée proche qu’elle pourrait raisonnablement fracasser (mur, charrette, étal…) et le détruit. Toutes les cibles à portée très proche de l’objet doivent réussir un jet de réaction d’Agilité, sinon elles subissent **2d4+3** dégâts physiques à cause des éclats."},{"n":"Bloody Reprisal","k":"Reaction","t":"Quand la Brute marque 2 PV ou plus à cause d’une attaque à portée très proche, tu peux faire une attaque standard contre l’attaquant. En cas de réussite, la Brute inflige **2d6+15** dégâts physiques au lieu de ses dégâts habituels."},{"n":"Momentum","k":"Reaction","t":"Quand la Brute réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"giant-eagle","nom":"Giant Eagle","tier":2,"type":"Skulk","desc":"Un rapace géant aux serres tachées de sang.","motifs":"Chasser, rester en mouvement, frapper de façon décisive","diff":"14","seuils":"8/19","pv":"4","stress":"4","atk":"+1","arme":"Serres et bec","portee":"Very Close","degats":"2d6+3 phy","xp":"","feats":[{"n":"Flight","k":"Passive","t":"En vol, l’Aigle gagne un bonus de +3 à sa Difficulté."},{"n":"Deadly Dive","k":"Action","t":"**Marque un Stress** pour attaquer une cible à portée lointaine. En cas de réussite, inflige **2d10+2** dégâts physiques et renverse la cible, qui est *Vulnérable* jusqu’à sa prochaine action."},{"n":"Take Off","k":"Action","t":"Fais une attaque contre une cible à portée très proche. En cas de réussite, inflige **2d4+3** dégâts physiques ; la cible doit réussir un jet de réaction d’Agilité, sinon elle est temporairement *Entravée* dans les serres énormes de l’Aigle. Si la cible est *Entravée*, l’Aigle s’élève aussitôt à portée très lointaine au-dessus du champ de bataille en la tenant."},{"n":"Deadly Drop","k":"Action","t":"En vol, l’Aigle peut lâcher une cible *Entravée* qu’il tient. Lâchée, elle n’est plus *Entravée* mais tombe. Si sa chute n’est pas empêchée pendant la prochaine action des PJ, elle subit **2d20** dégâts physiques à l’atterrissage."}]},{"id":"giant-mosquitoes","nom":"Giant Mosquitoes","tier":1,"type":"Horde (5/HP)","desc":"Des dizaines de moustiques gros comme le poing, qui volent en nuée pour se protéger.","motifs":"S’envoler, harceler, voler du sang","diff":"10","seuils":"5/9","pv":"6","stress":"3","atk":"-2","arme":"Trompe","portee":"Melee","degats":"1d8+3 phy","xp":"Camouflage +2","feats":[{"n":"Horde (1d4+1)","k":"Passive","t":"Quand les Moustiques ont marqué la moitié de leurs PV ou plus, leur attaque standard inflige **1d4+1** dégâts physiques à la place."},{"n":"Flying","k":"Passive","t":"En vol, les Moustiques gagnent un bonus de +2 à leur Difficulté."},{"n":"Bloodsucker","k":"Reaction","t":"Quand l’attaque des Moustiques fait marquer des PV à une cible, tu peux **marquer un Stress** pour qu’elle marque un PV supplémentaire."}]},{"id":"giant-rat","nom":"Giant Rat","tier":1,"type":"Minion","desc":"Un rongeur de la taille d’un chat, as de la récupération et de la survie.","motifs":"Creuser, avoir faim, fouiller les ordures, user l’ennemi","diff":"10","seuils":"None","pv":"1","stress":"1","atk":"-4","arme":"Griffes","portee":"Melee","degats":"1 phy","xp":"Sens aiguisés +3","feats":[{"n":"Minion (3)","k":"Passive","t":"Le Rat est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 3 dégâts qu’un PJ inflige au Rat, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Giant Rats à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 1 dégât physique ; additionne ces dégâts."}]},{"id":"giant-recruit","nom":"Giant Recruit","tier":2,"type":"Minion","desc":"Un combattant géant dans une armure d’emprunt.","motifs":"Cogner, gagner sa vie, submerger, terrifier","diff":"13","seuils":"None","pv":"1","stress":"2","atk":"+1","arme":"Marteau de guerre","portee":"Very Close","degats":"5 phy","xp":"","feats":[{"n":"Minion (7)","k":"Passive","t":"La Recrue est vaincue dès qu’elle subit des dégâts. Pour chaque tranche de 7 dégâts qu’un PJ inflige à la Recrue, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à toutes les Giant Recruits à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 5 dégâts physiques ; additionne ces dégâts."}]},{"id":"giant-scorpion","nom":"Giant Scorpion","tier":1,"type":"Bruiser","desc":"Un arachnide de taille humaine, aux pinces déchirantes et à la queue venimeuse.","motifs":"Tendre une embuscade, se nourrir, agripper, empoisonner","diff":"13","seuils":"7/13","pv":"6","stress":"3","atk":"+1","arme":"Pinces","portee":"Melee","degats":"1d12+2 phy","xp":"Camouflage +2","feats":[{"n":"Double Strike","k":"Action","t":"**Marque un Stress** pour faire une attaque standard contre deux cibles au contact."},{"n":"Venomous Stinger","k":"Action","t":"Fais une attaque contre une cible à portée très proche. En cas de réussite, **dépense une Peur** pour infliger **1d4+4** dégâts physiques et l’*Empoisonner* jusqu’à son prochain repos ou jusqu’à ce qu’elle réussisse un jet de Savoir (16). Tant qu’elle est *Empoisonnée*, la cible lance un **d6** avant chaque jet d’action : sur 4 ou moins, elle marque un Stress."},{"n":"Momentum","k":"Reaction","t":"Quand le Scorpion réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"glass-snake","nom":"Glass Snake","tier":1,"type":"Standard","desc":"Un serpent transparent à la tête énorme, qui laisse une traînée d’éclats de verre derrière lui.","motifs":"Grimper, se nourrir, garder ses distances, effrayer","diff":"14","seuils":"6/10","pv":"5","stress":"3","atk":"+2","arme":"Crocs de verre","portee":"Very Close","degats":"1d8+2 phy","xp":"","feats":[{"n":"Armor-Shredding Shards","k":"Passive","t":"Après une attaque réussie contre le Serpent au contact, l’attaquant marque un emplacement d’Armure. S’il ne peut pas, il marque un PV."},{"n":"Spinning Serpent","k":"Action","t":"**Marque un Stress** pour attaquer toutes les cibles à portée très proche. Les cibles touchées subissent **1d6+1** dégâts physiques."},{"n":"Spitter","k":"Action","t":"**Dépense une Peur** pour mettre en jeu un **d6** de crachat. Quand le Serpent a la main, lance ce dé : sur 5 ou plus, toutes les cibles devant le Serpent, à portée lointaine, doivent réussir un jet de réaction d’Agilité, sinon elles subissent **1d4** dégâts physiques. Le Serpent peut alors reprendre la main une seconde fois pendant ce tour du MJ."}]},{"id":"gorgon","nom":"Gorgon","tier":2,"type":"Solo","desc":"Un humanoïde à écailles et à chevelure de serpents, armé d’un arc doré, furieux qu’on ait troublé sa paix.","motifs":"Acculer, frapper puis fuir, pétrifier, se venger","diff":"15","seuils":"13/25","pv":"9","stress":"3","atk":"+4","arme":"Arc court brûle-soleil","portee":"Far","degats":"2d20+3 mag","xp":"Discrétion +3","feats":[{"n":"Relentless (2)","k":"Passive","t":"La Gorgone peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Sunsear Arrows","k":"Passive","t":"Quand la Gorgone réussit une attaque standard, la cible *Luit* jusqu’à la fin de la scène et ne peut pas devenir *Cachée*. Les jets d’attaque contre une cible qui *Luit* se font avec l’avantage."},{"n":"Crown of Serpents","k":"Action","t":"Fais un jet d’attaque contre une cible au contact avec les serpents protecteurs de la Gorgone. En cas de réussite, **marque un Stress** pour infliger **2d10+4** dégâts physiques ; la cible marque aussi un Stress."},{"n":"Petrifying Gaze","k":"Reaction","t":"Quand la Gorgone subit des dégâts d’une attaque à portée proche, tu peux **dépenser une Peur** pour que l’attaquant fasse un jet de réaction d’Instinct. En cas d’échec, il commence à se changer en pierre : il marque un PV et lance un compte à rebours de pétrification (4). Ce compte à rebours avance chaque fois que la Gorgone est attaquée. À son terme, la cible doit choisir une action de mort. Si la Gorgone est vaincue, tous les comptes à rebours de pétrification s’arrêtent."},{"n":"Momentum","k":"Reaction","t":"Quand la Gorgone réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"greater-earth-elemental","nom":"Greater Earth Elemental","tier":3,"type":"Bruiser","desc":"Un glissement de terrain vivant, fait de rochers et de poussière, grand comme une maison.","motifs":"Ensevelir, renverser, marteler","diff":"17","seuils":"22/40","pv":"10","stress":"4","atk":"+7","arme":"Poing de rocher","portee":"Very Close","degats":"3d10+1 phy","xp":"","feats":[{"n":"Slow","k":"Passive","t":"Quand tu donnes la main à l’Élémentaire et qu’il n’a pas de jeton sur son profil, il ne peut pas encore agir : pose un jeton sur son profil et décris ce qu’il s’apprête à faire. Quand tu lui donnes la main et qu’il a un jeton, retire-le : il peut agir."},{"n":"Crushing Blows","k":"Passive","t":"Quand l’Élémentaire réussit une attaque, la cible marque un emplacement d’Armure sans en tirer le bénéfice (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas marquer d’emplacement d’Armure, elle marque un PV supplémentaire."},{"n":"Immovable Object","k":"Passive","t":"Une attaque qui déplacerait l’Élémentaire le déplace de deux portées de moins (par exemple, lointaine devient très proche). Quand l’Élémentaire subit des dégâts physiques, réduis-les de 7."},{"n":"Rockslide","k":"Action","t":"**Marque un Stress** pour déclencher un éboulement qui ensevelit le terrain devant l’Élémentaire, à portée proche. Toutes les cibles dans cette zone font un jet de réaction d’Agilité (19). En cas d’échec, elles subissent **2d12+5** dégâts physiques et sont *Vulnérables* jusqu’à leur prochain jet avec l’Espoir. En cas de réussite, elles subissent la moitié des dégâts."},{"n":"Momentum","k":"Reaction","t":"Quand l’Élémentaire réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"greater-water-elemental","nom":"Greater Water Elemental","tier":3,"type":"Support","desc":"Une vague vivante gigantesque qui s’abat sur ses ennemis.","motifs":"Inonder, disperser, noyer","diff":"17","seuils":"17/34","pv":"5","stress":"5","atk":"+3","arme":"Vague déferlante","portee":"Very Close","degats":"3d4+1 mag","xp":"","feats":[{"n":"Water Jet","k":"Action","t":"**Marque un Stress** pour attaquer une cible à portée très proche. En cas de réussite, inflige **2d4+7** dégâts physiques et la prochaine action de la cible se fait avec le désavantage. En cas d’échec, la cible marque un Stress."},{"n":"Drowning Embrace","k":"Action","t":"**Dépense une Peur** pour attaquer toutes les cibles à portée très proche. Les cibles touchées commencent à se noyer : elles sont *Entravées* et *Vulnérables*. Une cible peut se libérer, ce qui met fin aux deux états, par un jet de Force ou d’Instinct réussi."},{"n":"High Tide","k":"Reaction","t":"Quand l’Élémentaire réussit une attaque standard, tu peux **marquer un Stress** pour repousser la cible à portée proche."}]},{"id":"green-ooze","nom":"Green Ooze","tier":1,"type":"Skulk","desc":"Un tas mouvant de gelée verte translucide.","motifs":"Se camoufler, dévorer et se multiplier, s’approcher en douce, engloutir","diff":"8","seuils":"5/10","pv":"5","stress":"2","atk":"+1","arme":"Pseudopode","portee":"Melee","degats":"1d6+1 mag","xp":"Camouflage +3","feats":[{"n":"Slow","k":"Passive","t":"Quand tu donnes la main au Limon et qu’il n’a pas de jeton sur son profil, il ne peut pas encore agir : pose un jeton sur son profil et décris ce qu’il s’apprête à faire. Quand tu lui donnes la main et qu’il a un jeton, retire-le : il peut agir."},{"n":"Acidic Form","k":"Passive","t":"Quand le Limon réussit une attaque, la cible marque un emplacement d’Armure sans en tirer le bénéfice (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas marquer d’emplacement d’Armure, elle marque un PV supplémentaire."},{"n":"Envelop","k":"Action","t":"Fais une attaque standard contre une cible au contact. En cas de réussite, le Limon l’engloutit et elle marque 2 Stress. Elle marque ensuite un Stress supplémentaire à chaque jet d’action. Si le Limon subit des dégâts graves, la cible est libérée."},{"n":"Split","k":"Reaction","t":"Quand le Limon a 3 PV marqués ou plus, tu peux **dépenser une Peur** pour le scinder en deux Tiny Green Oozes (sans PV ni Stress marqués). Donne aussitôt la main aux deux."}]},{"id":"hallowed-archer","nom":"Hallowed Archer","tier":4,"type":"Ranged","desc":"Des soldats-esprits armés d’arcs consacrés.","motifs":"Concentrer les tirs, obéir, se repositionner, tirer en volée","diff":"19","seuils":"25/45","pv":"3","stress":"2","atk":"+4","arme":"Arc long consacré","portee":"Far","degats":"4d8+8 phy","xp":"","feats":[{"n":"Punish the Guilty","k":"Passive","t":"L’Archer inflige des dégâts doublés aux cibles marquées *Coupables* par un High Seraph."},{"n":"Divine Volley","k":"Action","t":"**Marque un Stress** pour faire une attaque standard contre jusqu’à trois cibles."}]},{"id":"hallowed-soldier","nom":"Hallowed Soldier","tier":4,"type":"Minion","desc":"Les âmes des fidèles, élevées et dotées d’armes divines.","motifs":"Obéir, déborder, punir, submerger","diff":"18","seuils":"None","pv":"1","stress":"2","atk":"+2","arme":"Épée et bouclier","portee":"Melee","degats":"10 phy","xp":"","feats":[{"n":"Minion (13)","k":"Passive","t":"Le Soldat est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 13 dégâts qu’un PJ inflige au Soldat, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Divine Flight","k":"Passive","t":"En vol, **dépense une Peur** pour que le Soldat se déplace jusqu’à portée lointaine au lieu de portée proche avant d’agir."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Hallowed Soldiers à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 10 dégâts physiques ; additionne ces dégâts."}]},{"id":"harrier","nom":"Harrier","tier":1,"type":"Standard","desc":"Un combattant agile armé de javelots.","motifs":"Prendre à revers, harceler, garder ses distances, en tirer profit","diff":"12","seuils":"5/9","pv":"3","stress":"3","atk":"+1","arme":"Javelot","portee":"Close","degats":"1d6+2 phy","xp":"Camouflage +2","feats":[{"n":"Maintain Distance","k":"Passive","t":"Après une attaque standard, le Harceleur peut se déplacer n’importe où à portée lointaine."},{"n":"Fall Back","k":"Reaction","t":"Quand une créature vient au contact pour attaquer, tu peux **marquer un Stress** avant le jet d’attaque pour que le Harceleur se déplace n’importe où à portée proche et attaque cette créature. En cas de réussite, il inflige **1d10+2** dégâts physiques."}]},{"id":"head-guard","nom":"Head Guard","tier":1,"type":"Leader","desc":"Un garde chevronné, avec une masse, un sifflet et une voix de stentor.","motifs":"Arrêter, fermer les portes, clouer sur place, chercher la gloire","diff":"15","seuils":"7/13","pv":"7","stress":"3","atk":"+4","arme":"Masse","portee":"Melee","degats":"1d10+4 phy","xp":"Commandement +2, Connaissance du coin +2","feats":[{"n":"Rally Guards","k":"Action","t":"**Dépense 2 Peurs** pour donner la main au Chef des gardes et à jusqu’à **2d4** alliés à portée lointaine."},{"n":"Momentum","k":"Reaction","t":"Quand le Chef des gardes réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"head-vampire","nom":"Head Vampire","tier":3,"type":"Leader","desc":"Un mort-vivant fascinant, paré d’atours aristocratiques.","motifs":"Faire des esclaves, charmer, commander, voler, intimider","diff":"17","seuils":"22/42","pv":"6","stress":"6","atk":"+5","arme":"Rapière","portee":"Melee","degats":"2d20+4 phy","xp":"Aristocrate +3","feats":[{"n":"Terrifying","k":"Passive","t":"Quand le Vampire réussit une attaque, tous les PJ à portée lointaine perdent un Espoir et tu gagnes une Peur."},{"n":"Look into My Eyes","k":"Passive","t":"Une créature qui vient au contact du Vampire fait un jet de réaction d’Instinct. En cas d’échec, tu gagnes **1d4** Peurs."},{"n":"Feed on Followers","k":"Action","t":"Quand le Vampire est au contact d’un allié, il peut lui faire marquer un PV. Le Vampire efface alors un PV."},{"n":"The Hunt Is On","k":"Action","t":"**Dépense 2 Peurs** pour invoquer **1d4** Vampires, qui apparaissent à portée lointaine et reçoivent aussitôt la main."},{"n":"Lifesuck","k":"Reaction","t":"Quand le Vampire reçoit la main, lance un **d8**. Sur 6 ou plus, toutes les cibles à portée très proche marquent un PV."}]},{"id":"high-seraph","nom":"High Seraph","tier":4,"type":"Leader","desc":"Un champion divin, à la tête d’une armée sacrée de guerriers qui imposent la volonté de leur dieu.","motifs":"Imposer le dogme, voler, prononcer un jugement, frapper","diff":"20","seuils":"37/70","pv":"7","stress":"5","atk":"+8","arme":"Épée sacrée","portee":"Very Close","degats":"4d10+10 phy","xp":"Savoir divin +3","feats":[{"n":"Relentless (3)","k":"Passive","t":"Le Séraphin peut recevoir la main jusqu’à trois fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Divine Flight","k":"Passive","t":"En vol, **dépense une Peur** pour que le Séraphin se déplace jusqu’à portée lointaine au lieu de portée proche avant d’agir."},{"n":"Judgment","k":"Action","t":"**Dépense une Peur** pour rendre une cible *Coupable* aux yeux du dieu du Séraphin, jusqu’à ce que le Séraphin soit vaincu. Tant qu’elle est *Coupable*, la cible ne gagne pas d’Espoir sur un résultat avec l’Espoir. Quand le Séraphin réussit une attaque standard contre une cible *Coupable*, il inflige des dégâts graves au lieu de ses dégâts habituels. Le Séraphin ne peut marquer qu’une cible à la fois."},{"n":"God Rays","k":"Action","t":"**Marque un Stress** pour renvoyer un éclat de divinité en un rayon de lumière brûlant qui frappe jusqu’à vingt cibles à portée très lointaine. Les cibles font un jet de réaction de Présence, avec le désavantage si elles sont *Coupables*. En cas d’échec, elles subissent **4d6+12** dégâts magiques ; en cas de réussite, la moitié."},{"n":"We Are One","k":"Action","t":"Une fois par scène, **dépense une Peur** pour donner la main à tous les autres adversaires à portée lointaine. Leurs attaques pendant cette main infligent la moitié des dégâts."}]},{"id":"huge-green-ooze","nom":"Huge Green Ooze","tier":3,"type":"Skulk","desc":"Un tas d’acide vert translucide, plus haut que la plupart des humains.","motifs":"Se camoufler, s’approcher en douce, engloutir, se multiplier","diff":"15","seuils":"15/30","pv":"7","stress":"4","atk":"+3","arme":"Pseudopode","portee":"Melee","degats":"3d8+1 mag","xp":"Se fondre dans le décor +3","feats":[{"n":"Slow","k":"Passive","t":"Quand tu donnes la main au Limon et qu’il n’a pas de jeton sur son profil, il ne peut pas encore agir : pose un jeton sur son profil et décris ce qu’il s’apprête à faire. Quand tu lui donnes la main et qu’il a un jeton, retire-le : il peut agir."},{"n":"Acidic Form","k":"Passive","t":"Quand le Limon réussit une attaque, la cible marque un emplacement d’Armure sans en tirer le bénéfice (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas marquer d’emplacement d’Armure, elle marque un PV supplémentaire."},{"n":"Envelop","k":"Action","t":"Fais une attaque contre une cible au contact. En cas de réussite, le Limon l’*Engloutit* et elle marque 2 Stress. Tant qu’elle est *Engloutie*, elle marque un Stress supplémentaire à chaque jet d’action. Quand le Limon subit des dégâts graves, toutes les cibles *Englouties* sont libérées et l’état prend fin."},{"n":"Split","k":"Reaction","t":"Quand le Limon a 4 PV marqués ou plus, tu peux **dépenser une Peur** pour le scinder en deux Green Oozes (sans PV ni Stress marqués). Donne aussitôt la main aux deux."}]},{"id":"hydra","nom":"Hydra","tier":3,"type":"Solo","desc":"Une bête quadrupède couverte d’écailles, aux multiples têtes sur de longs cous, toutes hérissées de crocs.","motifs":"Dévorer, se régénérer, terrifier","diff":"18","seuils":"19/35","pv":"10","stress":"5","atk":"+3","arme":"Morsure","portee":"Close","degats":"2d12+2 phy","xp":"","feats":[{"n":"Many-Headed Menace","k":"Passive","t":"L’Hydre commence avec trois têtes et peut en avoir jusqu’à cinq. Quand elle subit des dégâts majeurs ou plus, elle perd une tête."},{"n":"Relentless (X)","k":"Passive","t":"L’Hydre peut recevoir la main X fois par tour du MJ, X étant son nombre de têtes. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Regeneration","k":"Action","t":"Si l’Hydre a des PV marqués, **dépense une Peur** pour effacer un PV et lui faire pousser deux têtes."},{"n":"Terrifying Chorus","k":"Action","t":"Tous les PJ à portée lointaine perdent 2 Espoirs."},{"n":"Magical Weakness","k":"Reaction","t":"Quand l’Hydre subit des dégâts magiques, elle est *Hébétée* jusqu’au prochain jet avec la Peur. Tant qu’elle est *Hébétée*, elle ne peut pas utiliser Regeneration mais elle est immunisée contre les dégâts magiques."}]},{"id":"jagged-knife-bandit","nom":"Jagged Knife Bandit","tier":1,"type":"Standard","desc":"Un criminel rusé, vêtu d’une cape, armé d’un des couteaux emblématiques de la bande.","motifs":"S’échapper, en tirer profit, voler, lancer des fumigènes","diff":"12","seuils":"8/14","pv":"5","stress":"3","atk":"+1","arme":"Dagues","portee":"Melee","degats":"1d8+1 phy","xp":"Voleur +2","feats":[{"n":"Climber","k":"Passive","t":"Le Bandit grimpe aussi facilement qu’il court."},{"n":"From Above","k":"Passive","t":"Quand le Bandit réussit une attaque standard depuis une position surélevée par rapport à sa cible, il inflige **1d10+1** dégâts physiques au lieu de ses dégâts habituels."}]},{"id":"jagged-knife-hexer","nom":"Jagged Knife Hexer","tier":1,"type":"Support","desc":"Un bandit armé d’un bâton, à la cape ornée d’attirail magique, qui tourmente ses ennemis à coups de malédictions.","motifs":"Commander, jeter des sorts, en tirer profit","diff":"13","seuils":"5/9","pv":"4","stress":"4","atk":"+2","arme":"Bâton","portee":"Far","degats":"1d6+2 mag","xp":"Savoir magique +2","feats":[{"n":"Curse","k":"Action","t":"Choisis une cible à portée lointaine et *Maudis*-la temporairement. Tant qu’elle est *Maudite*, quand elle lance un jet avec l’Espoir, tu peux **marquer un Stress** pour que le jet devienne un jet avec la Peur."},{"n":"Chaotic Flux","k":"Action","t":"Fais une attaque contre jusqu’à trois cibles à portée très proche. **Marque un Stress** pour infliger **2d6+3** dégâts magiques aux cibles touchées."}]},{"id":"jagged-knife-kneebreaker","nom":"Jagged Knife Kneebreaker","tier":1,"type":"Bruiser","desc":"Un cogneur imposant, armé d’un gros gourdin.","motifs":"Agripper, intimider, en tirer profit, voler","diff":"12","seuils":"7/14","pv":"7","stress":"4","atk":"-3","arme":"Gourdin","portee":"Melee","degats":"1d4+6 phy","xp":"Voleur +2, Menaces à peine voilées +3","feats":[{"n":"I've Got 'Em","k":"Passive","t":"Les créatures *Entravées* par le Briseur de genoux subissent des dégâts doublés des attaques des autres adversaires."},{"n":"Hold Them Down","k":"Action","t":"Fais une attaque contre une cible au contact. En cas de réussite, la cible ne subit aucun dégât mais elle est *Entravée* et *Vulnérable*. Elle se libère, ce qui met fin aux deux états, par un jet de Force réussi, ou automatiquement si le Briseur de genoux subit des dégâts majeurs ou plus."}]},{"id":"jagged-knife-lackey","nom":"Jagged Knife Lackey","tier":1,"type":"Minion","desc":"Un voleur en habits simples, armé de petites dagues, pressé de faire ses preuves.","motifs":"S’échapper, en tirer profit, lancer des fumigènes","diff":"9","seuils":"None","pv":"1","stress":"1","atk":"-2","arme":"Dagues","portee":"Melee","degats":"2 phy","xp":"Voleur +2","feats":[{"n":"Minion (3)","k":"Passive","t":"Le Larbin est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 3 dégâts qu’un PJ inflige au Larbin, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Jagged Knife Lackeys à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 2 dégâts physiques ; additionne ces dégâts."}]},{"id":"jagged-knife-lieutenant","nom":"Jagged Knife Lieutenant","tier":1,"type":"Leader","desc":"Un bandit aguerri en cuir de qualité, à la voix forte et au regard rusé.","motifs":"Brutaliser, commander, en tirer profit, renforcer","diff":"13","seuils":"7/14","pv":"6","stress":"3","atk":"+2","arme":"Javelot","portee":"Close","degats":"1d8+3 phy","xp":"Connaissance du coin +2","feats":[{"n":"Tactician","k":"Action","t":"Quand tu donnes la main au Lieutenant, **marque un Stress** pour la donner aussi à deux alliés à portée proche."},{"n":"More Where That Came From","k":"Action","t":"Invoque trois Jagged Knife Lackeys, qui apparaissent à portée lointaine."},{"n":"Coup de Grace","k":"Action","t":"**Dépense une Peur** pour attaquer une cible *Vulnérable* à portée proche. En cas de réussite, inflige **2d6+12** dégâts physiques ; la cible marque aussi un Stress."},{"n":"Momentum","k":"Reaction","t":"Quand le Lieutenant réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"jagged-knife-shadow","nom":"Jagged Knife Shadow","tier":1,"type":"Skulk","desc":"Une crapule agile au couteau cruel, qui use de magie d’ombre pour isoler ses cibles.","motifs":"Tendre une embuscade, dissimuler, diviser, en tirer profit","diff":"12","seuils":"4/8","pv":"3","stress":"3","atk":"+1","arme":"Dagues","portee":"Melee","degats":"1d4+4 phy","xp":"Intrusion +3","feats":[{"n":"Backstab","k":"Passive","t":"Quand l’Ombre réussit une attaque standard faite avec l’avantage, elle inflige **1d6+6** dégâts physiques au lieu de ses dégâts habituels."},{"n":"Cloaked","k":"Action","t":"L’Ombre devient *Cachée* jusqu’après sa prochaine attaque. Les attaques faites en étant *Cachée* grâce à cette capacité se font avec l’avantage."}]},{"id":"jagged-knife-sniper","nom":"Jagged Knife Sniper","tier":1,"type":"Ranged","desc":"Un bandit dégingandé qui frappe à couvert avec un arc court.","motifs":"Tendre une embuscade, se cacher, en tirer profit, se repositionner","diff":"13","seuils":"4/7","pv":"3","stress":"2","atk":"-1","arme":"Arc court","portee":"Far","degats":"1d10+2 phy","xp":"Discrétion +2","feats":[{"n":"Unseen Strike","k":"Passive","t":"Si le Tireur est *Caché* quand il réussit une attaque standard, il inflige **1d10+4** dégâts physiques au lieu de ses dégâts habituels."}]},{"id":"juvenile-flickerfly","nom":"Juvenile Flickerfly","tier":2,"type":"Solo","desc":"Un insecte de la taille d’un cheval, aux écailles irisées et aux ailes cristallines trop rapides pour l’œil.","motifs":"Collectionner ce qui brille, chasser, fondre sur sa proie","diff":"14","seuils":"13/26","pv":"10","stress":"5","atk":"+3","arme":"Taillade d’aile","portee":"Very Close","degats":"2d10+4 phy","xp":"","feats":[{"n":"Relentless (3)","k":"Passive","t":"La Luciole peut recevoir la main jusqu’à trois fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Peerless Accuracy","k":"Passive","t":"Avant chaque attaque de la Luciole, lance un **d6**. Sur 4 ou plus, l’Évasion de la cible est divisée par deux contre cette attaque."},{"n":"Mind Dance","k":"Action","t":"**Marque un Stress** pour créer un spectacle magique éblouissant qui happe l’esprit des ennemis proches. Toutes les cibles à portée proche font un jet de réaction d’Instinct. Pour chaque cible qui échoue, tu gagnes une Peur et la Luciole apprend l’une de ses peurs."}]},{"id":"knight-of-the-realm","nom":"Knight of the Realm","tier":2,"type":"Leader","desc":"Un soldat décoré, en armure lourde, monté sur un puissant destrier.","motifs":"Renverser, chercher la gloire, affirmer sa domination","diff":"15","seuils":"13/26","pv":"6","stress":"4","atk":"+4","arme":"Épée longue","portee":"Melee","degats":"2d10+4 phy","xp":"Savoir ancien +3, Haute société +2, Tactique +2","feats":[{"n":"Chevalier","k":"Passive","t":"Tant qu’il est en selle, le Chevalier gagne un bonus de +2 à sa Difficulté. Quand il subit des dégâts graves, il est désarçonné et perd ce bonus jusqu’à ce qu’il reçoive de nouveau la main."},{"n":"Heavily Armored","k":"Passive","t":"Quand le Chevalier subit des dégâts physiques, réduis-les de 3."},{"n":"Cavalry Charge","k":"Action","t":"Si le Chevalier est en selle, il se déplace jusqu’à portée lointaine et fait une attaque standard contre une cible. En cas de réussite, il inflige **2d8+4** dégâts physiques ; la cible marque aussi un Stress."},{"n":"For the Realm!","k":"Action","t":"**Marque un Stress** pour donner la main à **1d4+1** alliés. Leurs attaques pendant cette main infligent la moitié des dégâts."}]},{"id":"kraken","nom":"Kraken","tier":4,"type":"Solo","desc":"Une bête légendaire des mers, plus grande que le plus grand galion, aux tentacules couverts de ventouses et à la gueule terrifiante.","motifs":"Dévorer, broyer, noyer, agripper","diff":"20","seuils":"35/70","pv":"11","stress":"8","atk":"+7","arme":"Tentacules","portee":"Close","degats":"4d12+10 phy","xp":"Nage +3","feats":[{"n":"Relentless (3)","k":"Passive","t":"Le Kraken peut recevoir la main jusqu’à trois fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Many Tentacles","k":"Passive","t":"Tant que le Kraken a 7 PV marqués ou moins, son attaque standard peut viser deux cibles à portée."},{"n":"Grapple and Drown","k":"Action","t":"Fais un jet d’attaque contre une cible à portée proche. En cas de réussite, **marque un Stress** pour la saisir avec un tentacule et l’entraîner sous l’eau. La cible est *Entravée* et *Vulnérable* jusqu’à ce qu’elle se libère par un jet de Force réussi, ou que le Kraken subisse des dégâts majeurs ou plus. Tant qu’elle est ainsi prise, elle marque un Stress à chaque jet d’action."},{"n":"Boiling Blast","k":"Action","t":"**Dépense une Peur** pour cracher un jet d’eau bouillante en ligne, jusqu’à portée lointaine, sur autant de cibles que tu veux. Toutes doivent réussir un jet de réaction d’Agilité, sinon elles subissent **4d6+9** dégâts physiques. Une cible qui marque un emplacement d’Armure pour réduire ces dégâts marque aussi un Stress."},{"n":"Momentum","k":"Reaction","t":"Quand le Kraken réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"masked-thief","nom":"Masked Thief","tier":2,"type":"Skulk","desc":"Un voleur rusé, acrobate, qui a le goût du spectacle.","motifs":"Esquiver, se cacher, chaparder, en tirer profit","diff":"14","seuils":"8/17","pv":"4","stress":"5","atk":"+3","arme":"Épée à un tranchant","portee":"Melee","degats":"2d8+3 phy","xp":"Acrobaties +3","feats":[{"n":"Quick Hands","k":"Action","t":"Fais une attaque contre une cible au contact. En cas de réussite, inflige **1d8+2** dégâts physiques, et le Voleur dérobe un objet ou un consommable dans l’inventaire de la cible."},{"n":"Escape Plan","k":"Action","t":"**Marque un Stress** pour révéler un collet que le Voleur a posé n’importe où sur le champ de bataille. Toutes les cibles à portée très proche du piège doivent réussir un jet de réaction d’Agilité (13), sinon elles sont soulevées et suspendues la tête en bas. La cible est *Entravée* et *Vulnérable* jusqu’à ce qu’elle se libère, ce qui met fin aux deux états, par un jet de Finesse ou de Force réussi (13)."}]},{"id":"master-assassin","nom":"Master Assassin","tier":2,"type":"Leader","desc":"Un tueur chevronné, à la voix menaçante et à la lame mortelle.","motifs":"Tendre une embuscade, s’en sortir vivant, tuer, tout prévoir","diff":"15","seuils":"12/25","pv":"7","stress":"5","atk":"+5","arme":"Dague dentelée","portee":"Close","degats":"2d10+2 phy","xp":"Commandement +3, Intrusion +3","feats":[{"n":"Won't See It Coming","k":"Passive","t":"L’Assassin inflige des dégâts directs tant qu’il est *Caché*."},{"n":"Strike as One","k":"Action","t":"**Marque un Stress** pour donner la main à autant d’autres Assassins que l’Assassin a de cases de Stress non marquées."},{"n":"The Subtle Blade","k":"Reaction","t":"Quand l’Assassin réussit une attaque standard contre une cible *Vulnérable*, tu peux **dépenser une Peur** pour infliger des dégâts graves au lieu de ses dégâts habituels."},{"n":"Momentum","k":"Reaction","t":"Quand l’Assassin réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"merchant-baron","nom":"Merchant Baron","tier":2,"type":"Social","desc":"Un marchand accompli, à la tête d’une vaste entreprise.","motifs":"Abuser de son pouvoir, amasser des ressources, mobiliser ses sbires","diff":"15","seuils":"9/19","pv":"5","stress":"3","atk":"-2","arme":"Rapière","portee":"Melee","degats":"1d6+2 phy","xp":"Noblesse +2, Commerce +2","feats":[{"n":"Everyone Has a Price","k":"Action","t":"**Dépense une Peur** pour proposer à une cible un marché dangereux contre une chose qu’elle veut ou dont elle a besoin. Contre un PJ, celui-ci fait un jet de réaction de Présence (17) : en cas d’échec, il marque 2 Stress ou accepte le marché."},{"n":"The Best Muscle Money Can Buy","k":"Action","t":"Une fois par scène, **marque un Stress** pour invoquer **1d4+1** adversaires de rang 1, qui apparaissent à portée lointaine pour imposer la volonté du Baron."}]},{"id":"merchant","nom":"Merchant","tier":1,"type":"Social","desc":"Un négociant bien habillé, à l’œil vif pour les bonnes affaires.","motifs":"Acheter bas et vendre haut, créer la demande, gonfler les prix, chercher le profit","diff":"12","seuils":"4/8","pv":"3","stress":"3","atk":"-4","arme":"Gourdin","portee":"Melee","degats":"1d4+1 phy","xp":"Négociateur retors +3","feats":[{"n":"Preferential Treatment","k":"Passive","t":"Un PJ qui réussit un jet de Présence contre le Marchand obtient une remise sur ses achats. Un PJ qui rate un jet de Présence contre le Marchand paie plus cher et a le désavantage à ses prochains jets de Présence contre lui."},{"n":"The Runaround","k":"Passive","t":"Quand un PJ obtient 14 ou moins à un jet de Présence contre le Marchand, il marque un Stress."}]},{"id":"minor-chaos-elemental","nom":"Minor Chaos Elemental","tier":1,"type":"Solo","desc":"Une masse scintillante de magie incontrôlable.","motifs":"Déconcerter, déstabiliser, transmuter","diff":"14","seuils":"7/14","pv":"7","stress":"3","atk":"+3","arme":"Décharge de distorsion","portee":"Close","degats":"1d12+6 mag","xp":"","feats":[{"n":"Arcane Form","k":"Passive","t":"L’Élémentaire est résistant aux dégâts magiques."},{"n":"Sickening Flux","k":"Action","t":"**Marque un PV** pour que toutes les cibles à portée proche marquent un Stress et soient *Vulnérables* jusqu’à leur prochain repos ou jusqu’à ce qu’elles effacent un PV."},{"n":"Remake Reality","k":"Action","t":"**Dépense une Peur** pour transformer la zone à portée très proche en un autre biome. Toutes les cibles dans cette zone subissent **2d6+3** dégâts magiques directs."},{"n":"Magical reflection","k":"Reaction","t":"Quand l’Élémentaire subit des dégâts d’une attaque à portée proche, l’attaquant subit la moitié des dégâts qu’il a infligés."},{"n":"Momentum","k":"Reaction","t":"Quand l’Élémentaire réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"minor-demon","nom":"Minor Demon","tier":1,"type":"Solo","desc":"Une créature écarlate venue des Cercles d’en bas, dévorée de rage contre tous les mortels.","motifs":"Agir de façon imprévisible, rabattre ses cibles, savourer la douleur, tourmenter","diff":"14","seuils":"8/15","pv":"8","stress":"4","atk":"+3","arme":"Griffes","portee":"Melee","degats":"1d8+6 phy","xp":"","feats":[{"n":"Relentless (2)","k":"Passive","t":"Le Démon peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"All Must Fall","k":"Passive","t":"Quand un PJ à portée proche du Démon rate un jet avec la Peur, il perd un Espoir."},{"n":"Hellfire","k":"Action","t":"**Dépense une Peur** pour faire pleuvoir le feu infernal à portée lointaine. Toutes les cibles de la zone font un jet de réaction d’Agilité. En cas d’échec, elles subissent **1d20+3** dégâts magiques ; en cas de réussite, la moitié."},{"n":"Reaper","k":"Reaction","t":"Avant de lancer les dégâts d’une attaque du Démon, tu peux **marquer un Stress** pour ajouter au jet de dégâts un bonus égal à son nombre actuel de PV marqués."},{"n":"Momentum","k":"Reaction","t":"Quand le Démon réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"minor-fire-elemental","nom":"Minor Fire Elemental","tier":1,"type":"Solo","desc":"Une flamme vivante de la taille d’un grand feu de joie.","motifs":"Encercler l’ennemi, grandir, intimider, allumer des incendies","diff":"13","seuils":"7/15","pv":"9","stress":"3","atk":"+3","arme":"Décharge élémentaire","portee":"Far","degats":"1d10+4 mag","xp":"","feats":[{"n":"Relentless (2)","k":"Passive","t":"L’Élémentaire peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Scorched Earth","k":"Action","t":"**Marque un Stress** et choisis un point à portée lointaine. Le sol à portée très proche de ce point s’embrase aussitôt. Toutes les créatures dans cette zone font un jet de réaction d’Agilité. En cas d’échec, elles subissent **2d8** dégâts magiques ; en cas de réussite, la moitié."},{"n":"Explosion","k":"Action","t":"**Dépense une Peur** pour exploser dans une gerbe de feu. Fais une attaque contre toutes les cibles à portée proche. Les cibles touchées subissent **1d8** dégâts magiques et sont repoussées à portée lointaine."},{"n":"Consume Kindling","k":"Reaction","t":"Trois fois par scène, quand l’Élémentaire passe sur des objets très inflammables, il les consume pour effacer un PV ou un Stress."},{"n":"Momentum","k":"Reaction","t":"Quand l’Élémentaire réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"minor-treant","nom":"Minor Treant","tier":1,"type":"Minion","desc":"Un jeune arbre ambulant, levé pour défendre sa forêt.","motifs":"Écraser, submerger, protéger","diff":"10","seuils":"None","pv":"1","stress":"1","atk":"-2","arme":"Branche griffue","portee":"Melee","degats":"4 phy","xp":"","feats":[{"n":"Minion (5)","k":"Passive","t":"Le Tréant est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 5 dégâts qu’un PJ inflige au Tréant, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Minor Treants à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 4 dégâts physiques ; additionne ces dégâts."}]},{"id":"minotaur-wrecker","nom":"Minotaur Wrecker","tier":2,"type":"Bruiser","desc":"Un firbolg massif à tête de taureau, au tempérament explosif.","motifs":"Dévorer, encorner, s’orienter, écraser, poursuivre","diff":"16","seuils":"14/27","pv":"7","stress":"5","atk":"+2","arme":"Hache de bataille","portee":"Very Close","degats":"2d8+5 phy","xp":"Orientation +2","feats":[{"n":"Ramp Up","k":"Passive","t":"Tu dois **dépenser une Peur** pour donner la main au Minotaure. Pendant sa main, son attaque standard peut viser toutes les cibles à portée."},{"n":"Charging Bull","k":"Action","t":"**Marque un Stress** pour charger à travers un groupe à portée proche et attaquer toutes les cibles sur le passage du Minotaure. Les cibles touchées subissent **2d6+8** dégâts physiques et sont repoussées à portée très lointaine. Une cible projetée contre un objet solide ou une autre créature subit **1d6** dégâts de plus (additionne les dégâts)."},{"n":"Gore","k":"Action","t":"Fais une attaque contre une cible à portée très proche ; le Minotaure vient à son contact. En cas de réussite, il inflige **2d8** dégâts physiques directs."}]},{"id":"monarch","nom":"Monarch","tier":3,"type":"Social","desc":"Le souverain d’une nation, drapé dans les privilèges de la tradition et doté d’un pouvoir sans égal sur son domaine.","motifs":"Contrôler ses vassaux, détruire ses rivaux, bâtir un héritage","diff":"16","seuils":"16/32","pv":"6","stress":"5","atk":"+0","arme":"Marteau de guerre","portee":"Melee","degats":"3d6+3 phy","xp":"Histoire +3, Noblesse +3","feats":[{"n":"Execute Them!","k":"Action","t":"**Dépense une Peur par PJ du groupe** pour faire condamner le groupe pour des crimes réels ou imaginaires. Un PJ qui réussit un jet de Présence peut exiger un duel judiciaire ou une autre forme de procès particulière."},{"n":"Crownsguard","k":"Action","t":"Une fois par scène, **marque un Stress** pour invoquer six Minions de rang 3, qui apparaissent à portée proche pour imposer la volonté du Monarque."}]},{"id":"mortal-hunter","nom":"Mortal Hunter","tier":2,"type":"Leader","desc":"Une silhouette morte-vivante en lourd manteau de cuir, au regard scrutateur et à la cruauté nonchalante.","motifs":"Dévorer, chasser, pister","diff":"16","seuils":"15/27","pv":"6","stress":"4","atk":"+5","arme":"Lacérer la chair","portee":"Very Close","degats":"2d12+1 phy","xp":"Limier +3","feats":[{"n":"Terrifying","k":"Passive","t":"Quand le Chasseur réussit une attaque, tous les PJ à portée lointaine perdent un Espoir et tu gagnes une Peur."},{"n":"Deathlock","k":"Action","t":"**Dépense une Peur** pour frapper une cible à portée très proche d’un *Verrou mortel* nécrotique jusqu’à la fin de la scène. Les attaques du Chasseur contre une cible sous *Verrou mortel* infligent des dégâts directs. Le Chasseur ne peut maintenir qu’un seul *Verrou mortel* à la fois."},{"n":"Inevitable Death","k":"Action","t":"**Marque un Stress** pour donner la main à **1d4** alliés. Leurs attaques pendant cette main infligent la moitié des dégâts."}]},{"id":"oak-treant","nom":"Oak Treant","tier":3,"type":"Bruiser","desc":"Un vieil arbre robuste, animé.","motifs":"Se cacher à la vue de tous, préserver la forêt, s’enraciner, balayer de ses branches","diff":"17","seuils":"22/40","pv":"7","stress":"4","atk":"+2","arme":"Branche","portee":"Very Close","degats":"3d8+2 phy","xp":"Connaissance de la forêt +3","feats":[{"n":"Just a Tree","k":"Passive","t":"Avant sa première attaque d’un combat, ou après être devenu *Caché*, le Tréant est impossible à distinguer des autres arbres jusqu’à sa prochaine action, ou jusqu’à ce qu’un PJ réussisse un jet d’Instinct pour le repérer."},{"n":"Seed Barrage","k":"Action","t":"**Marque un Stress** et attaque jusqu’à trois cibles à portée proche en les bombardant de glands géants. Les cibles touchées subissent **2d10+5** dégâts physiques."},{"n":"Take Root","k":"Action","t":"**Marque un Stress** pour *Enraciner* le Tréant sur place. *Enraciné*, il est *Entravé* ; quand il a la main, il peut mettre fin à cet effet au lieu de se déplacer. Tant qu’il est *Enraciné*, le Tréant est résistant aux dégâts physiques."}]},{"id":"oracle-of-doom","nom":"Oracle of Doom","tier":4,"type":"Solo","desc":"Un immortel immense, incarnation du destin, condamné à ne voir que les issues funestes.","motifs":"Changer l’environnement, condamner, décourager, balayer","diff":"20","seuils":"38/68","pv":"11","stress":"10","atk":"+8","arme":"Attaque psychique","portee":"Far","degats":"4d8+9 mag","xp":"Savoir sans limites +4","feats":[{"n":"Terrifying","k":"Passive","t":"Quand l’Oracle réussit une attaque, tous les PJ à portée lointaine perdent un Espoir et tu gagnes une Peur."},{"n":"Walls Closing In","k":"Passive","t":"Quand une créature à portée très lointaine de l’Oracle rate un jet, elle marque un Stress."},{"n":"Pronounce Fate","k":"Action","t":"**Dépense une Peur** pour montrer à une cible à portée lointaine une vision de son pire cauchemar. Elle fait un jet de réaction de Savoir. En cas d’échec, elle perd tout son Espoir et subit **2d20+4** dégâts magiques directs. En cas de réussite, elle subit la moitié des dégâts et perd un Espoir."},{"n":"Summon Tormentors","k":"Action","t":"Une fois par jour, **dépense 2 Peurs** pour invoquer **2d4** Minions de rang 2 ou moins, liés au pire cauchemar de l’un des PJ. Ils apparaissent à portée proche de ce PJ."},{"n":"Ominous Knowledge","k":"Reaction","t":"Quand l’Oracle voit une créature mortelle, il connaît aussitôt l’un de ses pires cauchemars."},{"n":"Vengeful Fate","k":"Reaction","t":"Quand l’Oracle marque des PV à cause d’une attaque à portée très proche, tu peux **marquer un Stress** pour repousser l’attaquant à portée lointaine et lui infliger **2d10+4** dégâts physiques."}]},{"id":"outer-realms-abomination","nom":"Outer Realms Abomination","tier":4,"type":"Bruiser","desc":"Une parodie chaotique de vie, en perpétuelle mutation.","motifs":"Démolir, dévorer, saper","diff":"19","seuils":"35/71","pv":"7","stress":"5","atk":"+2d4","arme":"Pseudopode massif","portee":"Very Close","degats":"4d6+13 mag","xp":"","feats":[{"n":"Chaotic Form","k":"Passive","t":"Quand l’Abomination attaque, lance **2d4** : le résultat est son modificateur d’attaque."},{"n":"Disorienting Presence","k":"Passive","t":"Quand une cible subit des dégâts de l’Abomination, elle fait un jet de réaction d’Instinct. En cas d’échec, elle a le désavantage à son prochain jet d’action et tu gagnes une Peur."},{"n":"Reality Quake","k":"Action","t":"**Dépense une Peur** pour ébranler les bords de la réalité à portée lointaine de l’Abomination. Toutes les cibles dans cette zone doivent réussir un jet de réaction de Savoir, sinon elles sont *Décrochées* de la réalité jusqu’à la fin de la scène. Quand une cible *Décrochée* dépense de l’Espoir ou marque des emplacements d’Armure, des PV ou du Stress, elle en dépense ou en marque le double."},{"n":"Unreal Form","k":"Reaction","t":"Quand l’Abomination subit des dégâts, réduis-les de **1d20**. Si l’Abomination marque 1 PV ou moins à cause d’une attaque réussie contre elle, tu gagnes une Peur."}]},{"id":"outer-realms-corrupter","nom":"Outer Realms Corrupter","tier":4,"type":"Support","desc":"Une masse informe et changeante, qui semble faite de lumière chromatique.","motifs":"Embrouiller, distraire, submerger","diff":"19","seuils":"27/47","pv":"4","stress":"3","atk":"+7","arme":"Pseudopode corrosif","portee":"Very Close","degats":"4d8+5 mag","xp":"","feats":[{"n":"Will-Shattering Touch","k":"Passive","t":"Quand un PJ subit des dégâts du Corrupteur, il perd un Espoir."},{"n":"Disgorge Reality Flotsam","k":"Action","t":"**Marque un Stress** pour cracher sur toutes les cibles à portée proche des morceaux à demi digérés de réalités englouties. Les cibles doivent réussir un jet de réaction de Savoir, sinon elles marquent 2 Stress."}]},{"id":"outer-realms-corruptor","nom":"Outer Realms Corruptor","tier":4,"type":"Support","desc":"Une masse informe et changeante, qui semble faite de lumière chromatique.","motifs":"Embrouiller, distraire, submerger","diff":"19","seuils":"27/47","pv":"4","stress":"3","atk":"+7","arme":"Pseudopode corrosif","portee":"Very Close","degats":"4d8+5 mag","xp":"","feats":[{"n":"Will-Shattering Touch","k":"Passive","t":"Quand un PJ subit des dégâts du Corrupteur, il perd un Espoir."},{"n":"Disgorge Reality Flotsam","k":"Action","t":"**Marque un Stress** pour cracher sur toutes les cibles à portée proche des morceaux à demi digérés de réalités englouties. Les cibles doivent réussir un jet de réaction de Savoir, sinon elles marquent 2 Stress."}]},{"id":"outer-realms-thrall","nom":"Outer Realms Thrall","tier":4,"type":"Minion","desc":"Une forme vaguement humanoïde, dépouillée de sa mémoire et de son identité.","motifs":"Détruire, dégoûter, désorienter, intimider","diff":"17","seuils":"None","pv":"1","stress":"1","atk":"+3","arme":"Griffes et crocs","portee":"Very Close","degats":"11 phy","xp":"","feats":[{"n":"Minion (13)","k":"Passive","t":"L’Esclave est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 13 dégâts qu’un PJ inflige à l’Esclave, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Outer Realm Thralls à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 11 dégâts physiques ; additionne ces dégâts."}]},{"id":"patchwork-zombie-hulk","nom":"Patchwork Zombie Hulk","tier":1,"type":"Solo","desc":"Un amas colossal de cadavres qui bougent comme un seul corps, aux membres gros comme des torses et aux poings grands comme un halfelin adulte.","motifs":"Absorber les cadavres, frapper en tous sens, avoir faim, terrifier","diff":"13","seuils":"8/15","pv":"10","stress":"3","atk":"+4","arme":"Trop de bras","portee":"Very Close","degats":"1d20 phy","xp":"Intimidation +2, Mettre en pièces +2","feats":[{"n":"Destructible","k":"Passive","t":"Quand le Zombie subit des dégâts majeurs ou plus, il marque un PV supplémentaire."},{"n":"Flailing Limbs","k":"Passive","t":"Quand le Zombie fait une attaque standard, il peut attaquer toutes les cibles à portée très proche."},{"n":"Another for the Pile","k":"Action","t":"Quand le Zombie est à portée très proche d’un cadavre, il peut l’absorber pour effacer un PV et un Stress."},{"n":"Tormented Screams","k":"Action","t":"**Marque un Stress** : tous les PJ à portée lointaine font un jet de réaction de Présence (13). Ceux qui échouent perdent un Espoir, et tu gagnes une Peur pour chacun. Ceux qui réussissent marquent un Stress."}]},{"id":"perfected-zombie","nom":"Perfected Zombie","tier":4,"type":"Bruiser","desc":"Un zombie immense et musclé, à la force et au savoir-faire nourris de magie.","motifs":"Dévorer, traquer, mutiler, terrifier","diff":"20","seuils":"40/70","pv":"9","stress":"4","atk":"+4","arme":"Hache à deux mains","portee":"Very Close","degats":"4d12+15 phy","xp":"","feats":[{"n":"Terrifying","k":"Passive","t":"Quand le Zombie réussit une attaque, tous les PJ à portée lointaine perdent un Espoir et tu gagnes une Peur."},{"n":"Fearsome Presence","k":"Passive","t":"Les PJ ne peuvent pas dépenser d’Espoir pour utiliser des capacités contre le Zombie."},{"n":"Perfect Strike","k":"Action","t":"**Marque un Stress** pour faire une attaque standard contre toutes les cibles à portée très proche. Les cibles touchées sont *Vulnérables* jusqu’à leur prochain repos."},{"n":"Skilled Opportunist","k":"Reaction","t":"Quand un autre adversaire inflige des dégâts à une cible à portée très proche du Zombie, tu peux **dépenser une Peur** pour ajouter les dégâts de l’attaque standard du Zombie au jet de dégâts."}]},{"id":"petty-noble","nom":"Petty Noble","tier":1,"type":"Social","desc":"Un aristocrate richement vêtu et paré, débordant d’arrogance.","motifs":"Abuser de son pouvoir, amasser des ressources, mobiliser ses sbires","diff":"14","seuils":"6/10","pv":"3","stress":"5","atk":"-3","arme":"Rapière","portee":"Melee","degats":"1d6+1 phy","xp":"Aristocrate +3","feats":[{"n":"My Land, My Rules","k":"Passive","t":"Sur ses terres, toutes les actions sociales contre le Noble se font avec le désavantage."},{"n":"Guards, Seize Them!","k":"Action","t":"Une fois par scène, **marque un Stress** pour invoquer **1d4** Bladed Guards, qui apparaissent à portée lointaine pour imposer la volonté du Noble."},{"n":"Exile","k":"Action","t":"**Dépense une Peur** et vise un PJ. Le Noble proclame que la cible et ses alliés sont bannis de son territoire. Tant qu’ils sont bannis, ils ont le désavantage dans les situations sociales sur le domaine du Noble."}]},{"id":"pirate-captain","nom":"Pirate Captain","tier":1,"type":"Leader","desc":"Un loup de mer charismatique, au chapeau impressionnant, avide de pillage.","motifs":"Commander, faire marcher sur la planche, piller, razzier","diff":"14","seuils":"7/14","pv":"7","stress":"5","atk":"+4","arme":"Sabre d’abordage","portee":"Melee","degats":"1d12+2 phy","xp":"Commandement +2, Marin +3","feats":[{"n":"Swashbuckler","k":"Passive","t":"Quand le Capitaine marque 2 PV ou moins à cause d’une attaque au contact, l’attaquant marque un Stress."},{"n":"Reinforcements","k":"Action","t":"Une fois par scène, **marque un Stress** pour invoquer une Horde de Pirate Raiders, qui apparaît à portée lointaine."},{"n":"No Quarter","k":"Action","t":"**Dépense une Peur** et choisis une cible qui a au moins trois Pirates à son contact. Le Capitaine mène les Pirates qui l’accablent de menaces et lui promettent une tombe liquide. La cible fait un jet de réaction de Présence. En cas d’échec, elle marque **1d4+1** Stress ; en cas de réussite, un Stress."},{"n":"Momentum","k":"Reaction","t":"Quand le Capitaine réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"pirate-raiders","nom":"Pirate Raiders","tier":1,"type":"Horde (3/HP)","desc":"Des forbans des mers qui avancent en meute dévastatrice.","motifs":"Se liguer, piller, razzier","diff":"12","seuils":"5/11","pv":"4","stress":"3","atk":"+1","arme":"Sabre d’abordage","portee":"Melee","degats":"1d8+2 phy","xp":"Marin +3","feats":[{"n":"Horde (1d4+1)","k":"Passive","t":"Quand les Pillards ont marqué la moitié de leurs PV ou plus, leur attaque standard inflige **1d4+1** dégâts physiques à la place."},{"n":"Swashbuckler","k":"Passive","t":"Quand les Pillards marquent 2 PV ou moins à cause d’une attaque au contact, l’attaquant marque un Stress."}]},{"id":"pirate-tough","nom":"Pirate Tough","tier":1,"type":"Bruiser","desc":"Un pirate tatoué, tout en muscles, aux poings gros comme des melons.","motifs":"Piller, razzier, fracasser, terroriser","diff":"13","seuils":"8/15","pv":"5","stress":"3","atk":"+1","arme":"Poings massifs","portee":"Melee","degats":"2d6 phy","xp":"Marin +2","feats":[{"n":"Swashbuckler","k":"Passive","t":"Quand le Dur à cuire marque 2 PV ou moins à cause d’une attaque au contact, l’attaquant marque un Stress."},{"n":"Clear the Decks","k":"Action","t":"Fais une attaque contre une cible à portée très proche. En cas de réussite, **marque un Stress** pour venir à son contact, lui infliger **3d4** dégâts physiques et la repousser à portée proche."}]},{"id":"red-ooze","nom":"Red erd **1d4** Espoirs."}]},{"id":"skeleton-warrior","nom":"Skeleton Warrior","tier":1,"type":"Standard","desc":"Un squelette couvert de terre, armé d’une lame rouillée.","motifs":"Feindre la mort, se liguer, voler la peau","diff":"10","seuils":"4/8","pv":"3","stress":"2","atk":"+0","arme":"Épée","portee":"Melee","degats":"1d6+2 phy","xp":"","feats":[{"n":"Only Bones","k":"Passive","t":"Le Guerrier est résistant aux dégâts physiques."},{"n":"Won't Stay Dead","k":"Reaction","t":"Quand le Guerrier est vaincu, tu peux lui donner la main et lancer un **d6**. Sur un 6, s’il reste d’autres adversaires sur le champ de bataille, le Guerrier se reforme sans PV marqués."}]},{"id":"spectral-archer","nom":"Spectral Archer","tier":2,"type":"Ranged","desc":"Un combattant fantôme à l’arc éthéré, qui ne peut trouver le repos tant que ce qu’il garde est menacé.","motifs":"Traverser les objets solides, rester hors de la mêlée, rejouer d’anciennes batailles","diff":"13","seuils":"6/14","pv":"3","stress":"3","atk":"+3","arme":"Arc long","portee":"Far","degats":"2d10+2 phy","xp":"Savoir ancien +2","feats":[{"n":"Ghost","k":"Passive","t":"L’Archer est résistant aux dégâts physiques. **Marque un Stress** pour qu’il se déplace jusqu’à portée proche à travers les objets solides."},{"n":"Pick Your Target","k":"Action","t":"**Dépense une Peur** pour attaquer, à portée lointaine, un PJ qui se trouve à portée très proche d’au moins deux autres PJ. En cas de réussite, la cible subit **2d8+12** dégâts physiques."}]},{"id":"spectral-captain","nom":"Spectral Captain","tier":2,"type":"Leader","desc":"Un commandant fantôme qui mène ses troupes au-delà de la mort.","motifs":"Traverser les objets solides, rallier les troupes, rejouer d’anciennes batailles","diff":"16","seuils":"13/26","pv":"6","stress":"4","atk":"+3","arme":"Arc long","portee":"Far","degats":"2d10+3 phy","xp":"Savoir ancien +3","feats":[{"n":"Ghost","k":"Passive","t":"Le Capitaine est résistant aux dégâts physiques. **Marque un Stress** pour qu’il se déplace jusqu’à portée proche à travers les objets solides."},{"n":"Unending Battle","k":"Action","t":"**Dépense 2 Peurs** pour ramener au combat jusqu’à **1d4+1** alliés Spectral vaincus, à l’endroit où ils sont apparus la première fois (sans PV ni Stress marqués)."},{"n":"Hold Fast","k":"Reaction","t":"Quand les alliés Spectral du Capitaine doivent faire un jet de réaction, tu peux **marquer un Stress** pour leur donner un bonus de +2 à ce jet."},{"n":"Momentum","k":"Reaction","t":"Quand le Capitaine réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"spectral-guardian","nom":"Spectral Guardian","tier":2,"type":"Standard","desc":"Un combattant fantôme armé de lances et d’épées, retenu par le devoir.","motifs":"Traverser les objets solides, protéger le trésor, rejouer d’anciennes batailles","diff":"15","seuils":"7/15","pv":"4","stress":"3","atk":"+1","arme":"Lance","portee":"Very Close","degats":"2d8+1 phy","xp":"Savoir ancien +2","feats":[{"n":"Ghost","k":"Passive","t":"Le Gardien est résistant aux dégâts physiques. **Marque un Stress** pour qu’il se déplace jusqu’à portée proche à travers les objets solides."},{"n":"Grave Blade","k":"Action","t":"**Dépense une Peur** pour attaquer une cible à portée très proche. En cas de réussite, inflige **2d10+6** dégâts physiques ; la cible marque aussi un Stress."}]},{"id":"spellblade","nom":"Spellblade","tier":1,"type":"Leader","desc":"Un mercenaire qui allie l’escrime et la magie, avec des effets mortels.","motifs":"Foudroyer, commander, tenir bon","diff":"14","seuils":"8/14","pv":"6","stress":"3","atk":"+3","arme":"Épée longue enchantée","portee":"Melee","degats":"1d8+4 phy/mag","xp":"Savoir magique +2","feats":[{"n":"Arcane Steel","k":"Passive","t":"Les dégâts de l’attaque standard de la Lame-sort sont à la fois physiques et magiques."},{"n":"Suppressing Blast","k":"Action","t":"**Marque un Stress** et vise un groupe à portée lointaine. Toutes les cibles doivent réussir un jet de réaction d’Agilité, sinon elles subissent **1d8+2** dégâts magiques. Tu gagnes une Peur pour chaque cible qui marque des PV à cause de cette attaque."},{"n":"Move as a Unit","k":"Action","t":"**Dépense 2 Peurs** pour donner la main à jusqu’à cinq alliés à portée lointaine."},{"n":"Momentum","k":"Reaction","t":"Quand la Lame-sort réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"spy","nom":"Spy","tier":2,"type":"Social","desc":"Un espion habile, doué pour se trouver au bon endroit au bon moment pour surprendre des secrets.","motifs":"Filer à l’anglaise, se déguiser, écouter aux portes","diff":"15","seuils":"8/17","pv":"4","stress":"3","atk":"-2","arme":"Dague","portee":"Melee","degats":"2d6+3 phy","xp":"Espionnage +3","feats":[{"n":"Gathering Secrets","k":"Action","t":"**Dépense une Peur** pour décrire comment l’Espion connaît un secret sur un PJ présent dans la scène."},{"n":"Fly on the Wall","k":"Reaction","t":"Quand un PJ ou un groupe parle de quelque chose de sensible, tu peux **marquer un Stress** pour révéler que l’Espion est dans la scène et les observe. Si l’Espion quitte la scène pour aller rapporter ce qu’il a appris, tu gagnes **1d4** Peurs."}]},{"id":"stag-knight","nom":"Stag Knight","tier":3,"type":"Standard","desc":"Un chevalier aux bois immenses et majestueux, vêtu d’une armure d’épines dangereuses.","motifs":"Isoler, manœuvrer, protéger la forêt, arracher les indésirables","diff":"17","seuils":"19/36","pv":"7","stress":"5","atk":"+3","arme":"Épée de ronces","portee":"Melee","degats":"3d8+3 phy","xp":"Connaissance de la forêt +3","feats":[{"n":"From Above","k":"Passive","t":"Quand le Chevalier réussit une attaque standard depuis une position surélevée par rapport à sa cible, il inflige **3d12+3** dégâts physiques au lieu de ses dégâts habituels."},{"n":"Blade of the Forest","k":"Action","t":"**Dépense une Peur** pour attaquer toutes les cibles à portée très proche. Chaque cible touchée subit des dégâts physiques égaux à **3d4** + son seuil de dégâts majeurs."},{"n":"Thorny Armor","k":"Reaction","t":"Quand le Chevalier subit des dégâts d’une attaque au contact, tu peux **marquer un Stress** pour infliger **1d10+5** dégâts physiques à l’attaquant."}]},{"id":"stonewraith","nom":"Stonewraith","tier":2,"type":"Skulk","desc":"Un chasseur rôdeur, sinueux comme un puma, au corps de pierre gris ardoise.","motifs":"Défendre son territoire, isoler la proie, traquer","diff":"13","seuils":"11/22","pv":"6","stress":"3","atk":"+3","arme":"Morsure et griffes","portee":"Melee","degats":"2d8+6 phy","xp":"Sens de la pierre +3","feats":[{"n":"Stonestrider","k":"Passive","t":"Le Spectre de pierre traverse la pierre et la terre aussi facilement que l’air. Tant qu’il est dans la pierre ou la terre, il est *Caché* et immunisé contre tous les dégâts."},{"n":"Rocky Ambush","k":"Action","t":"Tant qu’il est *Caché*, **marque un Stress** pour qu’il bondisse au contact d’une cible à portée très proche. La cible doit réussir un jet de réaction d’Agilité ou d’Instinct (15), sinon elle subit **2d8** dégâts physiques et elle est temporairement *Entravée*."},{"n":"Avalanche Roar","k":"Action","t":"**Dépense une Peur** pour qu’il rugisse dans une grotte et provoque un éboulement. Toutes les cibles à portée proche doivent réussir un jet de réaction d’Agilité (14), sinon elles subissent **2d10** dégâts physiques. Dégager les gravats demande un compte à rebours de progression (8)."},{"n":"Momentum","k":"Reaction","t":"Quand le Spectre de pierre réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"swarm-of-rats","nom":"Swarm of Rats","tier":1,"type":"Horde (?/HP)","desc":"Une masse grouillante de rongeurs ordinaires qui avancent comme une vague affamée.","motifs":"Dévorer, masquer la vue, déferler","diff":"10","seuils":"6/10","pv":"6","stress":"2","atk":"-3","arme":"Griffes","portee":"Melee","degats":"1d8+2 phy","xp":"","feats":[{"n":"Horde (1d4+1)","k":"Passive","t":"Quand la Nuée a marqué la moitié de ses PV ou plus, son attaque standard inflige **1d4+1** dégâts physiques à la place."},{"n":"In Your Face","k":"Passive","t":"Toutes les cibles au contact ont le désavantage pour attaquer une autre cible que la Nuée."}]},{"id":"sylvan-soldier","nom":"Sylvan Soldier","tier":1,"type":"Standard","desc":"Un guerrier féerique en armure de feuilles et d’écorce.","motifs":"Tendre une embuscade, se cacher, submerger, protéger, pister","diff":"11","seuils":"6/11","pv":"4","stress":"2","atk":"+0","arme":"Faux","portee":"Melee","degats":"1d8+1 phy","xp":"Pisteur +2","feats":[{"n":"Pack Tactics","k":"Passive","t":"Si le Soldat fait une attaque standard alors qu’un autre Sylvan Soldier est au contact de la cible, il inflige **1d8+5** dégâts physiques au lieu de ses dégâts habituels."},{"n":"Forest Control","k":"Action","t":"**Dépense une Peur** pour abattre un arbre à portée proche. Une créature touchée par l’arbre doit réussir un jet de réaction d’Agilité (15), sinon elle subit **1d10** dégâts physiques."},{"n":"Blend In","k":"Reaction","t":"Quand le Soldat réussit une attaque, tu peux **marquer un Stress** pour qu’il devienne *Caché* jusqu’à sa prochaine attaque, ou jusqu’à ce qu’un PJ réussisse un jet d’Instinct (14) pour le trouver."}]},{"id":"tangle-bramble-swarm","nom":"Tangle Bramble Swarm","tier":1,"type":"Horde (3/HP)","desc":"Un amas de virevoltants animés, buveurs de sang, chacun de la taille d’une grosse courge.","motifs":"Digérer, empêtrer, immobiliser","diff":"12","seuils":"6/11","pv":"6","stress":"3","atk":"+0","arme":"Épines","portee":"Melee","degats":"1d6+3 phy","xp":"Camouflage +2","feats":[{"n":"Horde (1d4+2)","k":"Passive","t":"Quand l’Essaim a marqué la moitié de ses PV ou plus, son attaque standard inflige **1d4+2** dégâts physiques à la place."},{"n":"Crush","k":"Action","t":"**Marque un Stress** pour infliger **2d6+8** dégâts physiques directs à une cible qui porte 3 jetons de ronce ou plus."},{"n":"Encumber","k":"Reaction","t":"Quand l’Essaim réussit une attaque, donne un jeton de ronce à la cible. Une cible qui a au moins un jeton de ronce est *Entravée* ; à partir de 3 jetons, elle est aussi *Vulnérable*. On retire tous les jetons de ronce en réussissant un jet de Finesse (12 + le nombre de jetons) ou en infligeant des dégâts majeurs ou plus à l’Essaim. Si les jetons sont retirés par un jet de Finesse, autant de Minions Tangle Bramble que de jetons retirés apparaissent au contact."}]},{"id":"tangle-bramble","nom":"Tangle Bramble","tier":1,"type":"Minion","desc":"Un virevoltant animé, buveur de sang.","motifs":"S’assembler, drainer, empêtrer","diff":"11","seuils":"None","pv":"1","stress":"1","atk":"-1","arme":"Épines","portee":"Melee","degats":"2 phy","xp":"","feats":[{"n":"Minion (4)","k":"Passive","t":"La Ronce est vaincue dès qu’elle subit des dégâts. Pour chaque tranche de 4 dégâts qu’un PJ inflige à la Ronce, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à toutes les Tangle Brambles à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 2 dégâts physiques ; additionne ces dégâts."},{"n":"Drain and Multiply","k":"Reaction","t":"Quand une attaque de la Ronce fait marquer des PV à une cible et qu’au moins trois Minions Tangle Bramble sont à portée proche, tu peux les fusionner en une Horde Tangle Bramble Swarm. Les PV de la Horde sont égaux au nombre de Minions fusionnés."}]},{"id":"tiny-green-ooze","nom":"Tiny Green Ooze","tier":1,"type":"Skulk","desc":"Un petit tas mouvant de gelée verte translucide.","motifs":"Se camoufler, s’approcher en douce","diff":"14","seuils":"4/None","pv":"2","stress":"1","atk":"-1","arme":"Pseudopode","portee":"Melee","degats":"1d4+1 mag","xp":"","feats":[{"n":"Acidic Form","k":"Passive","t":"Quand le Limon réussit une attaque, la cible marque un emplacement d’Armure sans en tirer le bénéfice (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas marquer d’emplacement d’Armure, elle marque un PV supplémentaire."}]},{"id":"tiny-red-ooze","nom":"Tiny Red Ooze","tier":1,"type":"Skulk","desc":"Un petit tas mouvant de gelée rouge translucide et enflammée.","motifs":"Flamber, se camoufler","diff":"11","seuils":"5/None","pv":"2","stress":"1","atk":"-1","arme":"Pseudopode","portee":"Melee","degats":"1d4+2 mag","xp":"","feats":[{"n":"Burning","k":"Reaction","t":"Quand une créature au contact inflige des dégâts au Limon, elle subit **1d6** dégâts magiques directs."}]},{"id":"treant-sapling","nom":"Treant Sapling","tier":3,"type":"Minion","desc":"Un petit arbrisseau doué de conscience.","motifs":"Se fondre dans le décor, préserver la forêt, marteler, encercler","diff":"14","seuils":"None","pv":"1","stress":"1","atk":"+0","arme":"Branches","portee":"Melee","degats":"8 phy","xp":"","feats":[{"n":"Minion (6)","k":"Passive","t":"L’Arbrisseau est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 6 dégâts qu’un PJ inflige à l’Arbrisseau, un autre Minion à portée de l’attaque, que l’attaque aurait touché, est aussi vaincu."},{"n":"Group Attack","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les Treant Saplings à portée proche d’elle. Ces Minions viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 8 dégâts physiques ; additionne ces dégâts."}]},{"id":"vampire","nom":"Vampire","tier":3,"type":"Standard","desc":"Un mort-vivant intelligent, aux lèvres tachées de sang et au sourire de prédateur.","motifs":"Mordre, charmer, tromper, se nourrir, intimider","diff":"16","seuils":"18/35","pv":"5","stress":"4","atk":"+3","arme":"Rapière","portee":"Melee","degats":"3d8 phy","xp":"Chasseur nocturne +3","feats":[{"n":"Draining Bite","k":"Action","t":"Fais une attaque contre une cible au contact. En cas de réussite, inflige **5d4** dégâts physiques. Une cible qui marque des PV à cause de cette attaque perd un Espoir et marque un Stress. Le Vampire efface ensuite un PV."},{"n":"Mistform","k":"Reaction","t":"Quand le Vampire subit des dégâts physiques, tu peux **dépenser une Peur** pour qu’il n’en subisse que la moitié."}]},{"id":"vault-guardian-gaoler","nom":"Vault Guardian Gaoler","tier":3,"type":"Support","desc":"Un construct massif et cubique, couvert de poussière, dont le torse s’ouvre sur d’épaisses portes de métal.","motifs":"Emporter, piéger, protéger, marteler","diff":"16","seuils":"19/33","pv":"5","stress":"3","atk":"+2","arme":"Coup de corps","portee":"Very Close","degats":"3d6+2 phy","xp":"","feats":[{"n":"Blocking Shield","k":"Passive","t":"Les créatures au contact du Geôlier ont le désavantage à leurs jets d’attaque contre lui. Les créatures enfermées dans le Geôlier ne sont pas concernées."},{"n":"Lock Up","k":"Action","t":"**Marque un Stress** pour attaquer une cible à portée très proche. En cas de réussite, elle est *Entravée* à l’intérieur du Geôlier jusqu’à ce qu’on la libère par un jet de Force réussi (18). Tant qu’elle est *Entravée*, elle ne peut attaquer que le Geôlier."}]},{"id":"vault-guardian-sentinel","nom":"Vault Guardian Sentinel","tier":3,"type":"Bruiser","desc":"Un construct doré couvert de poussière, aux membres cubiques, avec une masse énorme en guise de main.","motifs":"Détruire à tout prix, éliminer, protéger","diff":"17","seuils":"21/40","pv":"6","stress":"3","atk":"+3","arme":"Masse chargée","portee":"Very Close","degats":"2d12+1 phy","xp":"","feats":[{"n":"Kinetic Slam","k":"Passive","t":"Les cibles qui subissent des dégâts de l’attaque standard de la Sentinelle sont repoussées à portée très proche."},{"n":"Box In","k":"Action","t":"**Marque un Stress** pour choisir une cible à portée très proche sur laquelle la Sentinelle se concentre. Cette cible a le désavantage à ses jets d’attaque tant qu’elle est à portée très proche de la Sentinelle. La Sentinelle ne se concentre que sur une cible à la fois."},{"n":"Mana Bolt","k":"Action","t":"**Dépense une Peur** pour lancer une charge de magie explosive sur un point à portée lointaine. Toutes les cibles à portée très proche de ce point font un jet de réaction d’Agilité. En cas d’échec, elles subissent **2d8+20** dégâts magiques et sont repoussées à portée proche. En cas de réussite, elles subissent la moitié des dégâts et ne sont pas repoussées."},{"n":"Momentum","k":"Reaction","t":"Quand la Sentinelle réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"vault-guardian-turret","nom":"Vault Guardian Turret","tier":3,"type":"Ranged","desc":"Une tourelle vivante massive, en armure renforcée, montée sur douze pattes mécaniques à pistons.","motifs":"Concentrer le feu, verrouiller la zone, désigner une cible, protéger","diff":"16","seuils":"20/32","pv":"5","stress":"4","atk":"+3","arme":"Canon magitech","portee":"Far","degats":"3d10+3 mag","xp":"","feats":[{"n":"Slow Firing","k":"Passive","t":"Quand tu donnes la main à la Tourelle et qu’elle n’a pas de jeton sur son profil, elle ne peut pas faire d’attaque standard : pose un jeton sur son profil et décris ce qu’elle s’apprête à faire. Quand tu lui donnes la main et qu’elle a un jeton, retire-le : elle peut attaquer."},{"n":"Mark Target","k":"Action","t":"**Dépense une Peur** pour *Désigner* une cible à portée lointaine, jusqu’à ce que la Tourelle soit détruite ou que la cible devienne *Cachée*. Tant qu’elle est *Désignée*, son Évasion est divisée par deux."},{"n":"Concentrate Fire","k":"Reaction","t":"Quand un autre adversaire inflige des dégâts à une cible à portée lointaine de la Tourelle, tu peux **marquer un Stress** pour ajouter les dégâts de l’attaque standard de la Tourelle au jet de dégâts."},{"n":"Detonation","k":"Reaction","t":"Quand la Tourelle est détruite, elle explose. Toutes les cibles à portée proche font un jet de réaction d’Agilité. En cas d’échec, elles subissent **3d20** dégâts physiques ; en cas de réussite, la moitié."}]},{"id":"volcanic-dragon-ashen-tyrant","nom":"Volcanic Dragon: Ashen Tyrant","tier":4,"type":"Solo","desc":"Jamais aucun ennemi n’avait eu l’insolence de blesser ainsi le dragon. À mesure que la lave se fige, elle tombe en cendres, comme les anciens ennemis du dragon.","motifs":"Étouffer, voler, intimider, tuer ou être tué","diff":"18","seuils":"29/55","pv":"8","stress":"5","atk":"+10","arme":"Griffes et crocs","portee":"Close","degats":"4d12+15 phy","xp":"Chasse depuis les airs +5","feats":[{"n":"Relentless (4)","k":"Passive","t":"Le Tyran des cendres peut recevoir la main jusqu’à quatre fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Cornered","k":"Passive","t":"**Marque un Stress** au lieu de dépenser une Peur pour donner la main au Tyran des cendres."},{"n":"Injured Wings","k":"Passive","t":"En vol, le Tyran des cendres gagne un bonus de +1 à sa Difficulté."},{"n":"Ashes to Ashes","k":"Passive","t":"Quand un PJ à portée proche du Tyran des cendres rate un jet, il perd un Espoir et tu gagnes une Peur. S’il ne peut pas perdre d’Espoir, il marque un PV."},{"n":"Desperate Rampage","k":"Action","t":"**Marque un Stress** pour attaquer toutes les cibles à portée proche. Les cibles touchées subissent **2d20+2** dégâts physiques, sont repoussées à portée proche de leur position et marquent un Stress."},{"n":"Ashen Cloud","k":"Action","t":"**Dépense une Peur** pour frapper le sol et soulever un nuage de cendres à portée lointaine. Dans le nuage, une cible a le désavantage à ses jets d’action. Le nuage se dissipe la prochaine fois qu’un adversaire reçoit la main."}]},{"id":"volcanic-dragon-molten-scourge","nom":"Volcanic Dragon: Molten Scourge","tier":4,"type":"Solo","desc":"Enragé par ses blessures, le dragon éclate en lave en fusion.","motifs":"Arroser de lave, incinérer, repousser les envahisseurs, se repositionner","diff":"20","seuils":"30/58","pv":"7","stress":"5","atk":"+9","arme":"Griffes enrobées de lave","portee":"Close","degats

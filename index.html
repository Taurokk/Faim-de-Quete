":"4d12+4 phy","xp":"Chasse depuis les airs +5","feats":[{"n":"Relentless (3)","k":"Passive","t":"Le Fléau en fusion peut recevoir la main jusqu’à trois fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Cracked Scales","k":"Passive","t":"Quand le Fléau en fusion subit des dégâts, lance autant de **d6** que de PV marqués. Pour chaque résultat de 4 ou plus, tu gagnes une Peur."},{"n":"Shattering Might","k":"Action","t":"**Marque un Stress** pour attaquer une cible à portée très proche. En cas de réussite, elle subit **4d8+1** dégâts physiques, perd un Espoir et est repoussée à portée proche. Le Fléau en fusion efface un Stress."},{"n":"Eruption","k":"Action","t":"**Dépense une Peur** pour faire jaillir la lave sous les écailles du Fléau en fusion et remplir de lave la zone à portée très proche. Toutes les cibles dans cette zone doivent réussir un jet de réaction d’Agilité, sinon elles subissent **4d6+6** dégâts physiques et sont repoussées à portée proche. La zone reste couverte de lave : quand une créature autre que le Fléau y entre ou y agit, elle marque 6 PV."},{"n":"Volcanic Breath","k":"Reaction","t":"Quand le Fléau en fusion subit des dégâts majeurs, lance un **d10**. Sur 8 ou plus, il crache un flot de lave devant lui, à portée lointaine. Toutes les cibles dans cette zone font un jet de réaction d’Agilité. En cas d’échec, elles subissent **2d10+4** dégâts physiques, marquent **1d4 Stress** et sont *Vulnérables* jusqu’à ce qu’elles effacent un Stress. En cas de réussite, elles subissent la moitié des dégâts et marquent un Stress."},{"n":"Lava Splash","k":"Reaction","t":"Quand le Fléau en fusion subit des dégâts graves d’une attaque à portée très proche, du sang en fusion jaillit de la plaie et inflige **2d10+4** dégâts physiques directs à l’attaquant."},{"n":"Ashen Vengeance (Phase Change)","k":"Reaction","t":"Quand le Fléau en fusion marque son dernier PV, remplace-le par le Tyran des cendres (Ashen Tyrant) et donne-lui aussitôt la main."}]},{"id":"volcanic-dragon-obsidian-predator","nom":"Volcanic Dragon: Obsidian Predator","tier":4,"type":"Solo","desc":"Une créature ailée colossale, aux écailles d’obsidienne et aux griffes d’un tranchant impossible.","motifs":"Défendre son antre, piquer en plongée, voler, chasser, intimider","diff":"19","seuils":"33/65","pv":"6","stress":"5","atk":"+8","arme":"Griffes d’obsidienne","portee":"Close","degats":"4d10+4 phy","xp":"Chasse depuis les airs +5","feats":[{"n":"Relentless (2)","k":"Passive","t":"Le Prédateur d’obsidienne peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Flying","k":"Passive","t":"En vol, le Prédateur d’obsidienne gagne un bonus de +3 à sa Difficulté."},{"n":"Obsidian Scales","k":"Passive","t":"Le Prédateur d’obsidienne est résistant aux dégâts physiques."},{"n":"Avalanche Tail","k":"Action","t":"**Marque un Stress** pour attaquer toutes les cibles à portée proche. Les cibles touchées subissent **4d6+4** dégâts physiques, sont repoussées à portée lointaine et sont *Vulnérables* jusqu’à leur prochain jet avec l’Espoir."},{"n":"Dive-Bomb","k":"Action","t":"Si le Prédateur d’obsidienne est en vol, **marque un Stress** et choisis un point à portée lointaine. Il fond sur ce point et attaque toutes les cibles à portée très proche. Les cibles touchées subissent **2d10+6** dégâts physiques, marquent un Stress et perdent un Espoir."},{"n":"Erupting Rage (Phase Change)","k":"Reaction","t":"Quand le Prédateur d’obsidienne marque son dernier PV, remplace-le par le Fléau en fusion (Molten Scourge) et donne-lui aussitôt la main."}]},{"id":"war-wizard","nom":"War Wizard","tier":2,"type":"Ranged","desc":"Un mage aguerri, formé à la magie de destruction.","motifs":"Mettre au point de nouveaux sorts, chercher le pouvoir, briser les formations","diff":"16","seuils":"11/23","pv":"5","stress":"6","atk":"+4","arme":"Bâton","portee":"Far","degats":"2d10+4 mag","xp":"Savoir magique +2, Stratégie +2","feats":[{"n":"Battle Teleport","k":"Passive","t":"Avant ou après une attaque standard, tu peux **marquer un Stress** pour que le Mage se téléporte à un endroit à portée lointaine."},{"n":"Refresh Warding Sphere","k":"Action","t":"**Marque un Stress** pour recharger la réaction Warding Sphere du Mage."},{"n":"Eruption","k":"Action","t":"**Dépense une Peur** et choisis un point à portée lointaine. La zone à portée très proche de ce point se soulève et devient infranchissable. Toutes les cibles dans cette zone font un jet de réaction d’Agilité (14). En cas d’échec, elles subissent **2d10** dégâts physiques et sont projetées hors de la zone. En cas de réussite, elles subissent la moitié des dégâts et ne bougent pas."},{"n":"Arcane Artillery","k":"Action","t":"**Dépense une Peur** pour déchaîner une grêle précise de décharges magiques. Toutes les cibles de la scène font un jet de réaction d’Agilité. En cas d’échec, elles subissent **2d12** dégâts magiques ; en cas de réussite, la moitié."},{"n":"Warding Sphere","k":"Reaction","t":"Quand le Mage subit des dégâts d’une attaque à portée proche, inflige **2d6** dégâts magiques à l’attaquant. Cette réaction ne peut plus servir tant que le Mage ne l’a pas rechargée avec son action Refresh Warding Sphere."}]},{"id":"weaponmaster","nom":"Weaponmaster","tier":1,"type":"Bruiser","desc":"Un maître d’armes qui manie une épée deux fois plus grande que lui.","motifs":"Agir le premier, viser le plus faible, intimider","diff":"14","seuils":"8/15","pv":"6","stress":"3","atk":"+2","arme":"Claymore","portee":"Very Close","degats":"1d12+2 phy","xp":"","feats":[{"n":"Goading Strike","k":"Action","t":"Fais une attaque standard contre une cible. En cas de réussite, **marque un Stress** pour la *Provoquer* jusqu’à sa prochaine attaque réussie. La prochaine fois que la cible *Provoquée* attaque, elle a le désavantage contre toute autre cible que le Maître d’armes."},{"n":"Adrenaline Burst","k":"Action","t":"Une fois par scène, **dépense une Peur** pour effacer 2 PV et 2 Stress."},{"n":"Momentum","k":"Reaction","t":"Quand le Maître d’armes réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"young-dryad","nom":"Young Dryad","tier":1,"type":"Leader","desc":"Une personne-arbre impérieuse, qui mène la défense de sa forêt.","motifs":"Commander, faire grandir, élaguer les indésirables","diff":"11","seuils":"6/11","pv":"6","stress":"2","atk":"+0","arme":"Faux","portee":"Melee","degats":"1d8+5 phy","xp":"Commandement +3","feats":[{"n":"Voice of the Forest","k":"Action","t":"**Marque un Stress** pour donner la main à **1d4** alliés qui ont une cible à portée sans avoir à se déplacer. En cas de réussite, leurs attaques infligent la moitié des dégâts."},{"n":"Thorny Cage","k":"Action","t":"**Dépense une Peur** pour former une cage autour d’une cible à portée très proche et l’*Entraver* jusqu’à ce qu’elle se libère par un jet de Force réussi. Une créature qui fait un jet d’action contre la cage marque un Stress."},{"n":"Momentum","k":"Reaction","t":"Quand la Dryade réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"young-ice-dragon","nom":"Young Ice Dragon","tier":3,"type":"Solo","desc":"Un dragon bleu glacier aux quatre membres puissants et aux ailes givrées.","motifs":"Ensevelir, défendre son antre, voler, geler, défendre ce qui est à lui, déchiqueter","diff":"18","seuils":"21/41","pv":"10","stress":"6","atk":"+7","arme":"Morsure et griffes","portee":"Close","degats":"4d10 phy","xp":"Protéger ce qui est à moi +3","feats":[{"n":"Relentless (3)","k":"Passive","t":"Le Dragon peut recevoir la main jusqu’à trois fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Rend and Crush","k":"Passive","t":"Si une cible blessée par le Dragon ne marque pas d’emplacement d’Armure pour réduire les dégâts, elle marque un Stress."},{"n":"No Hope","k":"Passive","t":"Quand un PJ à portée lointaine du Dragon lance un jet avec la Peur, il perd un Espoir."},{"n":"Blizzard Breath","k":"Action","t":"**Dépense 2 Peurs** pour souffler un tourbillon glacé devant le Dragon, à portée proche. Toutes les cibles dans cette zone font un jet de réaction d’Agilité. En cas d’échec, elles subissent **4d6+5** dégâts magiques et sont *Entravées* par la glace jusqu’à ce qu’elles se libèrent par un jet de Force réussi. En cas de réussite, elles marquent 2 Stress ou subissent la moitié des dégâts."},{"n":"Avalanche","k":"Action","t":"**Dépense une Peur** pour que le Dragon déclenche une énorme chute de neige et de glace qui recouvre toutes les autres créatures à portée lointaine. Les cibles dans cette zone doivent réussir un jet de réaction d’Instinct, sinon elles sont ensevelies sous la neige et les rochers, et *Vulnérables* jusqu’à ce qu’elles se dégagent. Tu gagnes une Peur pour chaque PJ qui rate ce jet."},{"n":"Frozen Scales","k":"Reaction","t":"Quand une créature réussit une attaque contre le Dragon depuis une portée très proche, elle marque un Stress et elle est *Glacée* jusqu’à son prochain repos ou jusqu’à ce qu’elle efface un Stress. Tant qu’elle est *Glacée*, elle a le désavantage à ses jets d’attaque."},{"n":"Momentum","k":"Reaction","t":"Quand le Dragon réussit une attaque contre un PJ, tu gagnes une Peur."}]},{"id":"zombie-legion","nom":"Zombie Legion","tier":4,"type":"Horde (3/HP)","desc":"Une grande meute de morts-vivants, encore redoutables malgré leur chair pourrissante.","motifs":"Dévorer les cerveaux, déchiqueter la chair, encercler","diff":"17","seuils":"25/45","pv":"8","stress":"5","atk":"+2","arme":"Mains de mort-vivant","portee":"Close","degats":"4d6+10 phy","xp":"","feats":[{"n":"Horde (2d6+5)","k":"Passive","t":"Quand la Légion a marqué la moitié de ses PV ou plus, son attaque standard inflige **2d6+5** dégâts physiques à la place."},{"n":"Unyielding","k":"Passive","t":"La Légion est résistante aux dégâts physiques."},{"n":"Relentless (2)","k":"Passive","t":"La Légion peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Overwhelm","k":"Reaction","t":"Quand la Légion subit des dégâts mineurs d’une attaque au contact, tu peux **marquer un Stress** pour faire une attaque standard avec l’avantage contre l’attaquant."}]},{"id":"zombie-pack","nom":"Zombie Pack","tier":1,"type":"Horde (2/HP)","desc":"Un groupe de cadavres titubants qui avancent ensemble par instinct.","motifs":"Dévorer la chair, avoir faim, déchiqueter","diff":"8","seuils":"6/12","pv":"6","stress":"3","atk":"-1","arme":"Morsure","portee":"Melee","degats":"1d10+2 phy","xp":"","feats":[{"n":"Horde (1d4+2)","k":"Passive","t":"Quand les Zombies ont marqué la moitié de leurs PV ou plus, leur attaque standard inflige **1d4+2** dégâts physiques à la place."},{"n":"Overwhelm","k":"Reaction","t":"Quand les Zombies marquent des PV à cause d’une attaque au contact, tu peux **marquer un Stress** pour faire une attaque standard contre l’attaquant."}]}];
const ENV_SRD=[{"id":"abandoned-grove","nom":"Abandoned Grove","tier":1,"type":"Exploration","desc":"Un ancien bosquet druidique laissé à l’abandon, entièrement repris par la nature.","impulsions":"Attirer les curieux, faire résonner le passé","diff":"11","adv":"Bêtes (Bear, Dire Wolf, Glass Snake), Gardiens du bosquet (Minor Treant, Sylvan Soldier, Young Dryad)","feats":[{"n":"Overgrown Battlefield","k":"Passive","t":"Une bataille a eu lieu ici. Un PJ peut faire un jet d’Instinct pour en repérer les traces. Sur une réussite avec l’Espoir, il apprend les trois informations ci-dessous ; sur une réussite avec la Peur, deux. En cas d’échec, il peut marquer un Stress pour en apprendre une et avoir l’avantage à son prochain jet d’action pour enquêter ici. Un PJ au passé ou à l’Expérience adaptés apprend un détail de plus et peut poser une question sur la scène, à laquelle on lui répond honnêtement (mais pas toujours complètement). *Pourquoi ces groupes se sont-ils affrontés ? Pourquoi le bosquet est-il abandonné aujourd’hui ?*\n\n- Des traces de combat jonchent le sol : armes et branches brisées, entailles dans la terre.\n- Un tronc couvert de mousse est en réalité le cadavre d’un tréant.\n- Les arbres encore debout sont tordus de façon étrange, comme par une magie puissante."},{"n":"Barbed Vines","k":"Action","t":"Choisis un point dans le bosquet. Toutes les cibles à portée très proche de ce point doivent réussir un jet de réaction d’Agilité, sinon elles subissent **1d8+3** dégâts physiques et sont *Entravées* par des lianes barbelées, jusqu’à ce qu’elles se libèrent par un jet de Finesse ou de Force réussi, ou en infligeant au moins 6 dégâts aux lianes. *Combien y a-t-il de lianes ? Où t’attrapent-elles ? Te tirent-elles vers le sol ou te soulèvent-elles ?*"},{"n":"You Are Not Welcome Here","k":"Action","t":"Une Young Dryad, deux Sylvan Soldiers et autant de Minor Treants que de PJ apparaissent pour reprocher au groupe son intrusion. *Que cachent les gardiens du bosquet ? Quelle menace pour la forêt les PJ pourraient-ils affronter pour apaiser la Dryade ?*"},{"n":"Defiler","k":"Action","t":"**Dépense une Peur** pour invoquer un Minor Chaos Elemental, attiré par les échos de violence et de discorde. Il apparaît à portée lointaine d’un PJ choisi et reçoit aussitôt la main. *De quelle couleur devient l’herbe quand l’élémentaire apparaît ? Comment le chaos déforme-t-il les insectes et les petites bêtes du bosquet ?*"}]},{"id":"ambushed","nom":"Ambushed","tier":1,"type":"Événement","desc":"Une embuscade tendue pour prendre un groupe au dépourvu.","impulsions":"Submerger, disperser, encercler","diff":"Special (see \"Relative Strength\")","adv":"Au choix","feats":[{"n":"Relative Strength","k":"Passive","t":"La Difficulté de cet environnement est égale à celle de l’adversaire qui a la Difficulté la plus haute. *Qui donne le signal de l’embuscade ? Qu’est-ce qui montre clairement que c’est le chef ?*"},{"n":"Surprise!","k":"Action","t":"Les assaillants se révèlent au groupe, tu gagnes 2 Peurs et la main passe aussitôt à l’un des adversaires de l’embuscade. *Que veulent les assaillants au groupe ? Comment leur tactique le reflète-t-elle ?*"}]},{"id":"ambushers","nom":"Ambushers","tier":1,"type":"Événement","desc":"Une embuscade tendue par les PJ pour prendre des adversaires au dépourvu.","impulsions":"Fuir, se regrouper, protéger les plus vulnérables","diff":"Special (see \"Relative Strength\")","adv":"Au choix","feats":[{"n":"Relative Strength","k":"Passive","t":"La Difficulté de cet environnement est égale à celle de l’adversaire qui a la Difficulté la plus haute. *Quel adversaire est le moins préparé ? Lequel l’est le plus ?*"},{"n":"Where Did They Come From?","k":"Reaction","t":"Quand un PJ déclenche l’embuscade sur des adversaires qui ne se doutent de rien, tu perds 2 Peurs et le premier jet d’attaque d’un PJ se fait avec l’avantage. *Qu’étaient en train de faire les adversaires quand l’embuscade commence ? Comment cela change-t-il leur façon de combattre ?*"}]},{"id":"burning-heart-of-the-woods","nom":"Burning Heart of the Woods","tier":3,"type":"Exploration","desc":"Une épaisse cendre indigo emplit l’air autour d’un arbre immense couvert de mousse, qui brûle éternellement de flammes d’un bleu maladif.","impulsions":"Battre un rythme étrange que tous suivent, corrompre les bois","diff":"16","adv":"Bêtes (Bear, Glass Snake), Élémentaires (Elemental Spark), Défenseurs verdoyants (Dryad, Oak Treant, Stag Knight)","feats":[{"n":"Chaos Magic Locus","k":"Passive","t":"Quand un PJ fait un jet de Sort, il lance deux dés de Peur et garde le plus haut. *Que ressent-on en pratiquant la magie dans ce lieu touché par le chaos ? Que crains-tu qu’il arrive si tu perds le contrôle du sort ?*"},{"n":"The Indigo Flame","k":"Passive","t":"Les PJ qui approchent de l’arbre central peuvent faire un jet de Savoir pour identifier la magie qui a dévoré les lieux. *Quel culte des Déchus a corrompu ces bois ? Qu’a-t-il déjà fait du bois et de la sève maudits de cet arbre ?*\n\n- **En cas de réussite** : ils apprennent trois des détails ci-dessous ; sur une réussite avec la Peur, deux.\n- **En cas d’échec** : ils peuvent marquer un Stress pour en apprendre un et avoir l’avantage à leur prochain jet d’action pour enquêter ici.\n- **Détails** : c’est l’œuvre d’une magie des Déchus. La corruption se répand par la mousse cendrée. Seul un rituel de magie naturelle peut la purifier, avec un compte à rebours de progression (8)."},{"n":"Grasping Vines","k":"Action","t":"Des lianes animées hérissées d’épines jaillissent des broussailles pour saisir les PJ. Une cible doit réussir un jet de réaction d’Agilité, sinon elle est *Entravée* et *Vulnérable* jusqu’à ce qu’elle se libère, ce qui met fin aux deux états, par un jet de Finesse ou de Force réussi, ou en infligeant 10 dégâts aux lianes. Chaque fois qu’elle tente de s’échapper, elle subit **1d8+4** dégâts physiques et perd un Espoir. *Quels souvenirs douloureux les lianes font-elles remonter en perçant la chair ?*"},{"n":"Charcoal Constructs","k":"Action","t":"Des animaux difformes nimbés de flammes indigo piétinent un point de ton choix. Toutes les cibles à portée proche de ce point font un jet de réaction d’Agilité. En cas d’échec, elles subissent **3d12+3** dégâts physiques ; en cas de réussite, la moitié. *Sont-ce de vrais animaux dévorés par la flamme, ou de simples constructs de la magie corruptrice ?*"}]},{"id":"bustling-marketplace","nom":"Bustling Marketplace","tier":1,"type":"Social","desc":"Le cœur économique de la ville : artisans du coin, marchands itinérants et clients de toutes conditions.","impulsions":"Acheter bas et vendre haut, tenter et allécher avec des marchandises d’ici et d’ailleurs","diff":"10","adv":"Gardes (Bladed Guard, Head Guard), Masked Thief, Merchant","feats":[{"n":"Tip the Scales","k":"Passive","t":"Les PJ peuvent avoir l’avantage à un jet de Présence en glissant une poignée d’or dans l’échange. *N’importe quelle pièce fera-t-elle l’affaire, ou seulement la monnaie locale ? Les PJ sont-ils discrets en proposant ce pot-de-vin ?*"},{"n":"Unexpected Find","k":"Action","t":"Révèle aux PJ qu’un marchand a quelque chose qu’ils veulent ou dont ils ont besoin : de la nourriture de chez eux, un livre rare, des composants magiques, une carte au trésor douteuse, une clé magique… *Quel prix, en plus de l’or, le marchand demandera-t-il pour cette rareté ?*"},{"n":"Sticky Fingers","k":"Action","t":"Un voleur tente de dérober quelque chose à un PJ. Celui-ci doit réussir un jet d’Instinct pour le remarquer, sinon il perd un objet au choix du MJ pendant que le voleur file à portée proche. Pour récupérer l’objet, les PJ doivent terminer un compte à rebours de progression (6) pour rattraper le voleur avant qu’il ne termine un compte à rebours de conséquence (4) et rejoigne sa planque. *Qu’est-ce qui a poussé cette personne au vol à la tire ? Où est sa planque, et comment est-elle restée secrète ?*"},{"n":"Crowd Closes In","k":"Reaction","t":"Quand un PJ s’éloigne du groupe, la foule se déplace et le coupe des autres. *Où le mouvement de la foule l’emporte-t-il ? Que ressent-il, seul mais entouré ?*"}]},{"id":"castle-siege","nom":"Castle Siege","tier":3,"type":"Événement","desc":"Un siège en cours : une armée tente de forcer l’entrée d’un château fortifié.","impulsions":"Saigner la volonté de combattre, percer les murailles, faire monter la tension","diff":"17","adv":"Mercenaires (Harrier, Sellsword, Spellblade, Weaponmaster), Forces nobles (Archer Squadron, Conscript, Elite Soldier, Knight of the Realm)","feats":[{"n":"Secret Entrance","k":"Passive","t":"Un PJ peut trouver ou se rappeler un passage secret vers le château en réussissant un jet d’Instinct ou de Savoir. *Comment entrer sans révéler le passage aux assaillants ? Des défenseurs surveillent-ils ce chemin ?*"},{"n":"Siege Weapons (Environment Change)","k":"Action","t":"*Compte à rebours de conséquence (6).* Les assaillants déploient des engins de siège pour raser les fortifications. Lance le compte à rebours au début du siège (pour un siège qui s’éternise, fais-en plutôt un compte à rebours à long terme). À son terme, les fortifications sont percées et les assaillants s’engouffrent. Tu gagnes 2 Peurs, puis passe à l’environnement Pitched Battle et donne-lui la main. *Quels engins de siège sont déployés ? Magiques, ordinaires, ou un mélange des deux ? Quelles défenses les personnages doivent-ils surmonter pour prendre le château d’assaut ?*"},{"n":"Reinforcements!","k":"Action","t":"Invoque en renfort, à portée lointaine d’un PJ choisi, un Knight of the Realm, autant de Minions de rang 3 que de PJ, et deux adversaires de ton choix. Le Knight of the Realm reçoit aussitôt la main. *Qui visent-ils en premier ? Quelle formation adoptent-ils ?*"},{"n":"Collateral Damage","k":"Reaction","t":"Quand un adversaire est vaincu, tu peux **dépenser une Peur** pour qu’un tir perdu d’engin de siège frappe un point du champ de bataille. Toutes les cibles à portée très proche de ce point font un jet de réaction d’Agilité. *Quels débris le tir projette-t-il ? Qu’est-ce qu’il brise qui ne se réparera pas facilement ?*\n\n- En cas d’échec, elles subissent **3d8+3** dégâts physiques ou magiques et marquent un Stress.\n- En cas de réussite, elles marquent un Stress."}]},{"id":"chaos-realm","nom":"Chaos Realm","tier":4,"type":"Traversée","desc":"Un espace d’un autre monde, où les lois de la réalité sont instables et dangereuses.","impulsions":"Anéantir les certitudes, dévorer le pouvoir, défier la logique","diff":"20","adv":"Monstruosités des Royaumes extérieurs (Abomination, Corruptor, Thrall)","feats":[{"n":"Impossible Architecture","k":"Passive","t":"Le haut est en bas, le bas est à droite, la droite pointe vers les étoiles. La gravité et les directions elles-mêmes changent sans cesse : traverser ce royaume est une odyssée à part entière, qui demande un compte à rebours de progression (8). En cas d’échec, un PJ marque un Stress en plus des autres conséquences du jet. *Que ressent-on à se déplacer dans un espace si étranger au Royaume mortel ? Sur quel repère fixes-tu ton regard pour garder l’équilibre ? Quels repères étranges croises-tu en chemin ?*"},{"n":"Unmaking","k":"Action","t":"**Dépense une Peur** pour qu’un PJ fasse un jet de réaction de Force. En cas d’échec, il subit **4d10** dégâts magiques directs ; en cas de réussite, il marque un Stress. *Quel aperçu d’autres mondes surprends-tu pendant que ce lieu tente de te défaire ? Quelle facette essentielle de ta personnalité cette dissolution tente-t-elle d’effacer ?*"},{"n":"Outer Realms Predators","k":"Action","t":"**Dépense une Peur** pour invoquer une Outer Realms Abomination, un Outer Realms Corruptor et **2d6** Outer Realms Thralls, qui apparaissent à portée proche d’un PJ choisi, au mépris de toute logique et de toute causalité. Donne aussitôt la main à l’un d’eux ; tu peux **dépenser une Peur de plus** pour que son attaque standard réussisse automatiquement. *Quels restes à demi dévorés du monde brisé ces monstruosités rejettent-elles pour courir après la chair vivante ? Quels reflets brisés d’une ancienne personne entrevois-tu entre deux instants de malveillance aveugle ?*"},{"n":"Disorienting Reality","k":"Reaction","t":"Sur un résultat avec la Peur, tu peux demander au PJ de décrire laquelle de ses peurs le Royaume du chaos fait surgir, tandis qu’une vision de la réalité se défait et se recompose devant lui. Le PJ perd un Espoir. Si c’était son dernier, tu gagnes une Peur. *Quel moment voit-il ? Si c’est un souvenir, comment ce lieu le déforme-t-il ? À quel point sera-t-il dur de garder le vrai souvenir ?*"}]},{"id":"cliffside-ascent","nom":"Cliffside Ascent","tier":1,"type":"Traversée","desc":"Une falaise rocheuse et abrupte, assez haute pour que l’escalade soit dangereuse.","impulsions":"Précipiter les imprudents vers une mort rocailleuse, attirer par la promesse de ce qui attend au sommet","diff":"12","adv":"Construct, Deeproot Defender, Giant Scorpion, Glass Snake","feats":[{"n":"The Climb","k":"Passive","t":"Gravir la falaise demande un compte à rebours de progression (12). Il avance selon les critères suivants quand les PJ font un jet d’action pour grimper :\n\n- **Réussite critique** : avance de 3\n- **Réussite avec l’Espoir** : avance de 2\n- **Réussite avec la Peur** : avance de 1\n- **Échec avec l’Espoir** : pas de progrès\n- **Échec avec la Peur** : recule de 1\n\nÀ son terme, le groupe atteint le sommet de la falaise. *Quelles formes étranges dessinent les pierres ? Quels avertissements sinistres d’anciens aventuriers trouve-t-on ?*"},{"n":"Pitons Left Behind","k":"Passive","t":"Des grimpeurs ont laissé derrière eux de grosses tiges de métal qui aident à l’ascension. Un PJ qui utilise ces pitons et rate un jet d’action pour grimper peut marquer un Stress au lieu de faire reculer le compte à rebours. *Que t’apprennent la forme et la matière de ces pitons sur ceux qui les ont plantés ? Quel écart y a-t-il entre eux ?*"},{"n":"Fall","k":"Action","t":"**Dépense une Peur** pour qu’une prise lâche sous un PJ, qui chute vers le sol. Si personne ne le rattrape à l’action suivante, il touche le sol et le compte à rebours recule de 2. Le PJ subit **1d12** dégâts physiques si le compte à rebours est entre 8 et 12, **2d12** entre 4 et 7, et **3d12** à 3 ou moins. *À quoi vois-tu que beaucoup sont tombés ici avant toi ? Qu’est-ce qui vit dans ces parois et pourrait effrayer les aventuriers pour qu’ils tombent, et faire un repas facile ?*"}]},{"id":"cult-ritual","nom":"Cult Ritual","tier":2,"type":"Événement","desc":"Un culte des Déchus se rassemble autour d’un sceau des dieux vaincus et d’un brasier aux flammes d’un vert maladif.","impulsions":"Profaner la terre, unir le Royaume mortel aux Cercles d’en bas","diff":"14","adv":"Culte des Déchus (Cult Adept, Cult Fang, Cult Initiate, Secret-Keeper)","feats":[{"n":"Desecrated Ground","k":"Passive","t":"Les cultistes ont consacré ce lieu aux Dieux Déchus, et leur influence immonde l’imprègne. Le dé d’Espoir des PJ passe à un **d10** dans cet environnement. Retirer la profanation demande un compte à rebours de progression (6). *Comment les PJ remarquent-ils d’abord que quelque chose cloche ici ? Quelles peurs refont surface quand l’espoir est tenu à distance ?*"},{"n":"Blasphemous Might","k":"Action","t":"Une partie de la puissance du rituel est détournée vers un cultiste pour repousser les intrus. Choisis un adversaire : il est *Imprégné* d’une magie terrible jusqu’à la fin de la scène ou jusqu’à sa défaite. Il reçoit aussitôt la main et gagne l’un des avantages suivants, ou les trois si tu **dépenses une Peur** :\n\n- Il a l’avantage à toutes ses attaques.\n- Il inflige **1d10** dégâts de plus quand il réussit une attaque.\n- Il gagne la capacité suivante : *Relentless (2) – Passive* : cet adversaire peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main. *Comment l’apparence de l’ennemi change-t-elle ? Quelles peurs ses coups font-ils remonter ?*"},{"n":"Complete the Ritual","k":"Reaction","t":"Si le meneur du rituel est visé par une attaque ou un sort, un allié à portée très proche de lui peut **marquer un Stress** pour être visé à sa place. *Que ressent-on à voir une telle dévotion mise au service de la peur et de la domination ?*"}]},{"id":"divine-usurpation","nom":"Divine Usurpation","tier":4,"type":"Événement","desc":"Un rituel colossal destiné à forcer les portes des Sanctuaires d’en haut et à détrôner les Nouveaux Dieux eux-mêmes.","impulsions":"Accumuler du pouvoir, écraser de sa présence, faire taire toute opposition","diff":"20","adv":"Arch-Necromancer, Fallen Shock Troops, Mortal Hunter, Oracle of Doom, Perfected Zombie","feats":[{"n":"Final Preparations","k":"Passive","t":"Quand l’environnement reçoit la main pour la première fois, désigne un adversaire comme l’Usurpateur qui veut renverser les dieux. Lance un compte à rebours à long terme (8) pendant que l’Usurpateur rassemble ce qu’il lui faut pour le rituel. À son terme, donne la main à cet environnement pour utiliser la capacité Beginning of the End. Tant que cet environnement est en jeu, tu peux garder jusqu’à 15 Peurs. *Que lui manque-t-il encore : le cœur d’un High Seraph ? La pierre d’aimant d’un ancien portail ? La loyauté de deux ennemis jurés ? Les larmes d’une âme pure au cœur brisé ?*"},{"n":"Divine Blessing","k":"Passive","t":"Quand un PJ obtient une réussite critique, il peut dépenser 2 Espoirs pour recharger une capacité normalement limitée en utilisations (une fois par repos, une fois par session…). *Quel dieu te soutient dans ta lutte contre cette usurpation ? Comment ta puissance renouvelée reflète-t-elle son influence ?*"},{"n":"Defilers Abound","k":"Action","t":"**Dépense 2 Peurs** pour invoquer **1d4+2** Fallen Shock Troops, qui apparaissent à portée proche de l’Usurpateur pour soutenir son siège divin. Donne-leur aussitôt la main pour qu’ils utilisent leur action Group Attack. *Quel Haut Déchu ces troupes servent-elles ? De quel dieu veulent-elles dévorer la chair ?*"},{"n":"Godslayer","k":"Action","t":"Si le compte à rebours du siège divin (voir Beginning of the End) est arrivé à son terme, tu peux **dépenser 3 Peurs** pour décrire l’Usurpateur qui tue l’un des dieux des Sanctuaires d’en haut, se repaît de sa puissance et grandit encore. L’Usurpateur efface 2 PV. Augmente sa Difficulté, ses dégâts ou son modificateur d’attaque, ou donne-lui une nouvelle capacité tirée du dieu tué. *Quel dieu trouve la mort ? Quelles sont ses dernières paroles ? Comment se manifeste le pouvoir volé de l’Usurpateur ?*"},{"n":"Beginning of the End","k":"Reaction","t":"Quand le compte à rebours à long terme de Final Preparations arrive à son terme, l’Usurpateur commence à marteler les portes des Sanctuaires eux-mêmes. Lance un compte à rebours du siège divin (10). Donne la main à l’Usurpateur pour décrire son assaut et fais avancer ce compte à rebours de 1. Si l’Usurpateur subit des dégâts majeurs ou plus, fais-le reculer de 1. À son terme, l’Usurpateur brise la barrière entre le Royaume mortel et les Sanctuaires d’en haut pour tuer les dieux et prendre leur place. Tu gagnes une Peur pour chaque PV non marqué de l’Usurpateur. Tu peux aussitôt utiliser Godslayer sans dépenser de Peur, comme action supplémentaire du MJ. *Comment le Royaume mortel se tord-il quand l’ordre naturel est violé ? Quels mortels assistent de loin à ce blasphème ?*"},{"n":"Ritual Nexus","k":"Reaction","t":"Sur tout échec avec la Peur contre l’Usurpateur, le PJ marque **1d4** Stress à cause du contrecoup de la puissance magique. *Quelles visions d’échecs passés te tourmentent quand tes efforts ne suffisent pas ? Comment l’Usurpateur déforme-t-il ces souvenirs ?*"}]},{"id":"hallowed-temple","nom":"Hallowed Temple","tier":2,"type":"Social","desc":"Un temple animé mais bien tenu, qui soigne les malades et accueille des offices réguliers, sous la garde d’un prêtre ou d’un séraphin.","impulsions":"Relier le Royaume mortel aux Sanctuaires d’en haut, montrer la puissance du divin, secourir et réconforter les fidèles","diff":"13","adv":"Gardes (Archer Guard, Bladed Guard, Head Guard)","feats":[{"n":"A Place of Healing","k":"Passive","t":"Un PJ qui se repose dans le temple efface automatiquement tous ses PV. *Quelle odeur a l’encens ? Quels chants entonnent les acolytes ?*"},{"n":"Divine Guidance","k":"Passive","t":"Un PJ qui prie une divinité dans le temple peut faire un jet d’Instinct pour recevoir des réponses. Si le dieu imploré n’est pas le bienvenu dans ce temple, le jet se fait avec le désavantage. *Que ressens-tu quand cette vision te touche ? Quel sentiment persiste une fois les images passées ?*\n\n- **Réussite critique** : le PJ obtient une information claire. Il gagne aussi **1d4** Espoirs, qu’il peut répartir dans le groupe s’il partage la vision reçue.\n- **Réussite avec l’Espoir** : le PJ obtient une information claire.\n- **Réussite avec la Peur** : le PJ reçoit de brèves lueurs de compréhension et une impression émotionnelle qui suggère une réponse.\n- **Tout échec** : le PJ ne reçoit que de vagues lueurs. Il peut marquer un Stress pour obtenir une image claire, sans contexte."},{"n":"Relentless Hope","k":"Reaction","t":"Une fois par scène, chaque PJ peut marquer un Stress pour transformer un résultat avec la Peur en résultat avec l’Espoir. *À quelles émotions ou à quels souvenirs te raccroches-tu quand la peur t’étreint ?*"},{"n":"Divine Censure","k":"Reaction","t":"Quand les PJ ont violé un lieu interdit, blasphémé ou offensé le clergé, tu peux **dépenser une Peur** pour invoquer un High Seraph et **1d4** Bladed Guards à portée proche du grand prêtre, pour appuyer sa volonté. *Quels symboles ou emblèmes portent-ils, qui montrent qu’ils sont les agents oints de la divinité ? Qui mène le groupe, et qu’est-ce qui l’a conduit à cette vocation ?*"}]},{"id":"haunted-city","nom":"Haunted City","tier":2,"type":"Exploration","desc":"Une ville abandonnée, peuplée par les esprits inquiets d’époques révolues.","impulsions":"Égarer et désorienter, rejouer des fins du monde, collectives ou intimes","diff":"14","adv":"Fantômes (Spectral Archer, Spectral Captain, Spectral Guardian), versions fantômes d’autres adversaires (voir Ghostly Form)","feats":[{"n":"Buried Knowledge","k":"Passive","t":"La ville recèle d’innombrables mystères. Un PJ qui cherche à en savoir plus sur la cité déchue peut faire un jet d’Instinct ou de Savoir pour en apprendre davantage et découvrir du butin (peut-être hanté). *Quels secrets plus grands la ville renferme-t-elle ? Pourquoi tant de fantômes s’attardent-ils ici ? Quels aventuriers malchanceux y ont déjà connu un sort funeste ?*\n\n- **Réussite critique** : une information précieuse et un objet utile qui s’y rapporte.\n- **Réussite avec l’Espoir** : une information précieuse.\n- **Réussite avec la Peur** : une information vague ou incomplète.\n- **Tout échec** : marque un Stress pour trouver une piste après une fouille épuisante."},{"n":"Ghostly Form","k":"Passive","t":"Les adversaires qui apparaissent ici sont des fantômes. Ils sont résistants aux dégâts physiques et peuvent **marquer un Stress** pour se déplacer jusqu’à portée proche à travers les objets solides. *Quelles blessures de leur corps disent comment ils sont morts ? Quel but inaccompli les retient dans le Plan mortel ?*"},{"n":"Dead Ends","k":"Action","t":"Les fantômes d’une autre époque font revivre des scènes de leur temps : une fête de rue, une révolution, un casse… Ces apparitions changent la disposition de la ville autour des PJ : elles bloquent le chemin derrière eux, les forcent à faire un détour ou leur posent un défi (par exemple en les prenant pour des voleurs rivaux pendant le casse). *Que te veulent les fantômes ? De quoi as-tu besoin de leur part ?*"},{"n":"Apocalypse Then","k":"Action","t":"**Dépense une Peur** pour faire surgir l’écho d’une catastrophe passée qui a ravagé la ville. Lance un compte à rebours de progression (5) pendant que la catastrophe se rejoue autour des PJ. Pour le terminer et échapper au désastre, ils doivent surmonter des menaces (incendies déchaînés, foule paniquée, bâtiments qui s’effondrent, rues qui s’écroulent) tout en se rappelant l’histoire et en cherchant des indices pour échapper à l’inévitable. *Est-ce la catastrophe qui a fait abandonner la ville ? Que sait-on d’elle, et comment cela pourrait-il aider les PJ à s’échapper ?*"}]},{"id":"imperial-court","nom":"Imperial Court","tier":4,"type":"Social","desc":"Le domaine majestueux d’un puissant empire, somptueusement garni de trésors volés.","impulsions":"Justifier et perpétuer le pouvoir impérial, séduire les rivaux par des promesses de pouvoir et de confort","diff":"20","adv":"Bladed Guard, Courtesan, Knight of the Realm, Monarch, Spy","feats":[{"n":"All Roads Lead Here","k":"Passive","t":"À la Cour impériale, un PJ a le désavantage aux jets de Présence pour des actions qui ne cadrent pas avec le mode de vie impérial ou ne soutiennent pas la domination de l’empire. *Comment la langue elle-même rend-elle difficile d’évoquer d’autres façons de vivre ? Quels avantages évidents de la loyauté créent des frictions quand tu tentes d’en parler ?*"},{"n":"Rival Vassals","k":"Passive","t":"Les PJ peuvent trouver à la cour des sujets, des vassaux et des solliciteurs de l’empire, tous en quête de faveurs, avides de se rapprocher du pouvoir, échangeant services contre loyauté et cherchant à s’élever au-dessus des autres. Certains veulent désespérément saper leurs rivaux ; d’autres pourraient même écouter des propos qui frôlent la sédition. *Que leur rapporte la vassalité, et que leur a-t-elle coûté ? Quelle exploitation les pousse à envisager de s’opposer à l’inarrêtable ?*"},{"n":"The Gravity of Empire","k":"Action","t":"**Dépense une Peur** pour offrir à un PJ une occasion en or, ou de quoi réaliser un objectif majeur, en échange de son obéissance ou de son soutien à l’empire. La cible fait un jet de réaction de Présence. En cas d’échec, elle marque tout son Stress ou accepte l’offre ; si tout son Stress est déjà marqué, elle accepte l’offre ou s’exile de l’empire. En cas de réussite, elle marque **1d4** Stress, éprouvée par la tentation. *Que veulent les PJ au point d’envisager de s’allier à ce pouvoir impitoyable ? Comment les agents impériaux ont-ils appris leurs plus grands désirs ?*"},{"n":"Imperial Decree","k":"Action","t":"**Dépense une Peur** pour faire avancer de **1d4** un compte à rebours à long terme lié aux projets de l’empire. S’il arrive à son terme, une proclamation est annoncée à la cour tandis que le plan est exécuté. *Quelle démonstration de pouvoir ou quel transfert de richesses a-t-il fallu pour accélérer ce plan ? Quelles vies ont été bouleversées pour y arriver ?*"},{"n":"Eyes Everywhere","k":"Reaction","t":"Sur un résultat avec la Peur, tu peux **dépenser une Peur** pour qu’un fidèle de l’empire surprenne des propos séditieux à la cour. Un PJ doit réussir un jet de réaction d’Instinct pour remarquer que le groupe a été entendu, afin de tenter d’intercepter le témoin avant d’être dénoncé. *Comment l’empire tient-il ce témoin ? Pourquoi son premier réflexe est-il de protéger l’empire, même s’il ne le traite pas bien ?*"}]},{"id":"local-tavern","nom":"Local Tavern","tier":1,"type":"Social","desc":"Une taverne animée, cœur de la vie sociale de la ville.","impulsions":"Offrir des occasions aux aventuriers, entretenir la communauté","diff":"10","adv":"Gardes (Bladed Guard, Head Guard), Mercenaires (Harrier, Sellsword, Spellblade, Weaponmaster), Merchant","feats":[{"n":"What's the Talk of the Town?","k":"Passive","t":"Un PJ peut interroger le tavernier, le personnel ou les clients sur les événements du coin, les rumeurs et le travail possible, avec un jet de Présence. En cas de réussite, il choisit deux des détails ci-dessous (trois sur une réussite critique). En cas d’échec, il en choisit un et marque un Stress, pendant que l’habitué s’étend sur un sujet sans intérêt. *Qui sait quoi ? Quels ragots les habitués commencent-ils à répandre sur les PJ ?*\n\n- Une rumeur fascinante liée au passé d’un PJ\n- Un travail prometteur pour le groupe, lié à une menace ou une situation proche\n- Une légende locale liée à quelque chose qu’ils ont vu\n- Un ragot qui laisse deviner un problème dans la communauté"},{"n":"Sing For Your Supper","k":"Passive","t":"Un PJ peut se produire une fois devant les clients en faisant un jet de Présence. En cas de réussite, il gagne **1d4** poignées d’or (**2d4** sur une réussite critique). En cas d’échec, il marque un Stress. *Quel morceau joues-tu ? Que représente-t-il pour toi ? Quand l’as-tu joué devant un public pour la dernière fois ?*"},{"n":"Mysterious Stranger","k":"Action","t":"Révèle un inconnu qui cache son identité, tapi dans un box à l’ombre. *Que veut-il ? Que pense-t-il des PJ ? Quelles manies ou quels accessoires a-t-il ?*"},{"n":"Someone Comes to Town","k":"Action","t":"Fais entrer un PNJ important qui veut engager le groupe ou qui est lié au passé d’un PJ. *Savait-il que les PJ étaient là ? Que veut-il dans cette ville ?*"},{"n":"Bar Fight!","k":"Action","t":"**Dépense une Peur** pour qu’une bagarre éclate dans la taverne. Tant qu’elle dure, un PJ qui tente de traverser la salle doit réussir un jet d’Agilité ou de Présence, sinon il subit **1d6+2** dégâts physiques à cause d’un coup perdu ou d’un objet lancé. Un PJ peut déclencher cette capacité en réussissant un jet d’action qui provoquerait les clients. *Qui a commencé ? Que faudra-t-il pour arrêter ça ?*"}]},{"id":"mountain-pass","nom":"Mountain Pass","tier":2,"type":"Traversée","desc":"Des pics de pierre qui percent les nuages, avec un sentier sinueux qui grimpe et franchit le col en de nombreux lacets.","impulsions":"Prélever un lourd tribut en vivres et en endurance, révéler une manipulation magique, ralentir le voyage","diff":"15","adv":"Bêtes (Bear, Giant Eagle, Glass Snake), Chaos Skull, Minotaur Wrecker, Mortal Hunter","feats":[{"n":"Engraved Sigils","k":"Passive","t":"De grands symboles ont été gravés dans la montagne. Un PJ au passé ou à l’Expérience adaptés y reconnaît une magie climatique qui renforce les vents glacés. Un PJ qui réussit un jet de Savoir se rappelle des informations sur ces sceaux, peut-être sur leurs auteurs, et sait comment les dissiper. Sur une réussite critique, il reconnaît le style des enchanteurs ridgeborne et a l’avantage au jet pour dissiper les sceaux. *Qui a posé cet enchantement ? Est-il dans les parages ? Pourquoi voulait-il rendre le temps plus redoutable ?*"},{"n":"Avalanche","k":"Action","t":"**Dépense une Peur** pour qu’un torrent de glace entaille la montagne et déclenche une avalanche. Tous les PJ sur son passage doivent réussir un jet de réaction d’Agilité ou de Force, sinon ils sont renversés et emportés. Un PJ qui utilise une corde, des pitons ou un autre matériel d’escalade a l’avantage à ce jet. En cas d’échec, il est emporté à portée lointaine en contrebas, subit **2d20** dégâts physiques et marque un Stress. En cas de réussite, il marque un Stress. *Comment les PJ tentent-ils de résister à l’avalanche ? Comment les personnages se retrouvent-ils quand leurs compagnons dévalent la pente ?*"},{"n":"Raptor Nest","k":"Reaction","t":"Quand les PJ entrent sur le territoire de chasse des rapaces, deux Giant Eagles apparaissent à portée très lointaine d’un PJ choisi et voient en eux des proies. *Depuis quand les aigles n’ont-ils pas trouvé de proie ? Ont-ils des œufs au nid, ou des petits sans plumes ?*"}]},{"id":"necromancer-s-ossuary","nom":"Necromancer's Ossuary","tier":4,"type":"Exploration","desc":"Une crypte poussiéreuse avec une bibliothèque, des couloirs tortueux et des sarcophages à foison, éclaboussée du sang d’envahisseurs malchanceux.","impulsions":"Égarer les intrus, fouiller des secrets qu’il vaudrait mieux laisser enfouis, manifester la non-vie, déchaîner une marée de morts-vivants","diff":"19","adv":"Armée de l’Arch-Necromancer (Perfected Zombie, Zombie Legion)","feats":[{"n":"No Place for the Living","k":"Passive","t":"Une capacité ou une action qui efface des PV coûte un Espoir pour être utilisée. Si elle coûte déjà de l’Espoir, le PJ doit dépenser un Espoir de plus. *Que ressent-on en essayant de guérir dans un lieu si hostile à la vie ?*"},{"n":"Centuries of Knowledge","k":"Passive","t":"Un PJ peut fouiller la bibliothèque et le laboratoire et faire un jet de Savoir pour apprendre des choses sur les arcanes, l’histoire locale et les plans du Nécromancien. *Quels sont les titres des grimoires ? Sur quel projet travaille le nécromancien, et que dit-il de ses plans ?*"},{"n":"Skeletal Burst","k":"Action","t":"Toutes les cibles à portée proche d’un point de ton choix dans cet environnement doivent réussir un jet de réaction d’Agilité, sinon elles subissent **4d8+8** dégâts physiques : une partie de l’ossuaire explose autour d’elles en éclats d’os. *Quelle ancienne architecture d’ossements est détruite ? Quels os restent plantés dans ton armure ?*"},{"n":"Aura of Death","k":"Action","t":"Une fois par scène, lance un **d4**. Chaque mort-vivant à portée lointaine du Nécromancien peut effacer autant de PV et de Stress que le résultat, répartis comme il veut entre PV et Stress. *Comment se manifeste leur vigueur retrouvée ? Ont-ils l’air plus vivants, ou au contraire plus décomposés mais plus vigoureux ?*"},{"n":"They Just Keep Coming!","k":"Action","t":"**Dépense une Peur** pour invoquer **1d6** Rotted Zombies, deux Perfected Zombies ou une Zombie Legion, qui apparaissent à portée proche d’un PJ choisi. *Qui étaient ces gens avant de devenir les pions du nécromancien ? Quels vestiges de ces vies les héros peuvent-ils encore voir ?*"}]},{"id":"outpost-town","nom":"Outpost Town","tier":1,"type":"Social","desc":"Une petite ville aux confins d’une nation ou d’une région, près d’un donjon, de tombeaux ou d’autres buts d’aventure.","impulsions":"Pousser les désespérés vers une perte certaine, tirer profit d’un espoir en lambeaux","diff":"12","adv":"Bandits du Jagged Knife (Hexer, Kneebreaker, Lackey, Lieutenant, Shadow, Sniper), Masked Thief, Merchant","feats":[{"n":"Rumors Abound","k":"Passive","t":"Les ragots sont la monnaie qui circule le plus vite du royaume. Un PJ peut s’enquérir des grands événements avec un jet de Présence ; ce qu’il apprend dépend du résultat, selon les critères ci-dessous. *Quelles nouvelles les PJ pourraient-ils transmettre aux voyageurs curieux ? Qu’en pensent les habitants ?*\n\n- **Réussite critique** : il apprend deux grands événements et peut poser une question sur l’une des rumeurs, à laquelle on lui répond honnêtement (mais pas toujours complètement).\n- **Réussite avec l’Espoir** : il apprend deux événements, dont au moins un lié au passé du personnage.\n- **Réussite avec la Peur** : il apprend une rumeur alarmante liée au passé du personnage.\n- **Tout échec** : les habitants accueillent mal ses questions. Il marque un Stress pour apprendre une rumeur utile."},{"n":"Society of the Broken Compass","k":"Passive","t":"Une société d’aventuriers a une maison ici, où les héros échangent vantardises et rumeurs, trinquent à leurs exploits imaginaires et complotent contre leurs rivaux. *De quoi se vantent les aventuriers ici, et qu’est-ce qui te semble vrai ?*"},{"n":"Rival Party","k":"Passive","t":"Un autre groupe d’aventuriers est là, sur la piste du même trésor ou des mêmes indices que les PJ. *Quel PJ a un lien avec un membre du groupe rival ? Celui-ci l’aborde-t-il le premier, ou attend-il qu’il fasse le premier pas ?*"},{"n":"It'd Be a Shame If Something Happened to Your Store","k":"Action","t":"Les PJ voient les hommes d’un parrain du coin racketter un bazar. *Quels ennuis cela crée-t-il si les PJ interviennent ?*"},{"n":"Wrong Place, Wrong Time","k":"Reaction","t":"La nuit, ou quand le groupe est seul dans une ruelle, tu peux **dépenser une Peur** pour faire surgir une bande de voleurs qui tentent de les détrousser. Ils apparaissent à portée proche d’un PJ choisi : un Jagged Knife Kneebreaker, autant de Lackeys que de PJ et un Lieutenant. Pour un groupe plus grand, ajoute un Hexer ou un Sniper. *Quels détails montrent au groupe que ce sont d’anciens aventuriers désespérés ?*"}]},{"id":"pitched-battle","nom":"Pitched Battle","tier":3,"type":"Événement","desc":"Un affrontement massif entre deux grands groupes de combattants armés.","impulsions":"S’emparer des gens, des terres et des richesses, verser le sang par cupidité et par gloire","diff":"17","adv":"Mercenaires (Sellsword, Harrier, Spellblade, Weaponmaster), Forces nobles (Archer Squadron, Conscript, Elite Soldier, Knight of the Realm)","feats":[{"n":"Adrift on a Sea of Steel","k":"Passive","t":"Traverser un champ de bataille en plein combat est extrêmement dangereux. Un PJ doit réussir un jet d’Agilité pour se déplacer, et ne va que jusqu’à portée proche en cas de réussite. Si un adversaire est à son contact, il doit marquer un Stress pour faire ce jet d’Agilité. *Les combattants te prennent-ils pour l’ennemi, ou pour un intrus ? Arrives-tu à distinguer amis et ennemis dans la mêlée ?*"},{"n":"Raze and Pillage","k":"Action","t":"Les assaillants font monter les enjeux : ils allument un incendie, volent un bien précieux, enlèvent une personne importante ou massacrent la population. *Qu’est-ce qui a de la valeur ici ? Qui est le plus vulnérable ?*"},{"n":"War Magic","k":"Action","t":"**Dépense une Peur** : un mage de l’un des camps déchaîne une magie de destruction à grande échelle. Choisis un point du champ de bataille à portée très lointaine du mage. Toutes les cibles à portée proche de ce point font un jet de réaction d’Agilité. En cas d’échec, elles subissent **3d12+8** dégâts magiques et marquent un Stress. *Quelle forme prend l’attaque : boule de feu, pluie d’acide, tempête de lames ? Quel objectif tactique vise-t-elle, et que se passe-t-il ensuite ?*"},{"n":"Reinforcements!","k":"Action","t":"Invoque en renfort, à portée lointaine d’un PJ choisi, un Knight of the Realm, autant de Minions de rang 3 que de PJ, et deux adversaires de ton choix. Le Knight of the Realm reçoit aussitôt la main. *Qui visent-ils en premier ? Quelle formation adoptent-ils ?*"}]},{"id":"raging-river","nom":"Raging River","tier":1,"type":"Traversée","desc":"Une rivière au courant rapide, sans pont, assez profonde pour emporter la plupart des gens.","impulsions":"Barrer le passage, emporter les imprudents, couper le pays en deux","diff":"10","adv":"Bêtes (Bear, Glass Snake), Bandits du Jagged Knife (Hexer, Kneebreaker, Lackey, Lieutenant, Shadow, Sniper)","feats":[{"n":"Dangerous Crossing","k":"Passive","t":"Traverser la rivière demande au groupe de terminer un compte à rebours de progression (4). Un PJ qui rate un jet avec la Peur subit aussitôt l’action Undertow, sans qu’il faille dépenser de Peur. *Des PJ ont-ils déjà passé à gué des rivières comme celle-ci ? L’un d’eux a-t-il peur de se noyer ?*"},{"n":"Undertow","k":"Action","t":"**Dépense une Peur** pour qu’un PJ soit pris dans le courant de fond. Il fait un jet de réaction d’Agilité. En cas d’échec, il subit **1d6+1** dégâts physiques, il est emporté à portée proche en aval et reste *Vulnérable* jusqu’à ce qu’il sorte de la rivière. En cas de réussite, il marque un Stress. *Quels bibelots et babioles gisent au fond du lit de la rivière ? Des prédateurs nagent-ils dans ces eaux ?*"},{"n":"Patient Hunter","k":"Action","t":"**Dépense une Peur** pour invoquer un Glass Snake à portée proche d’un PJ choisi. Le Serpent apparaît dans la rivière ou tout près, et reçoit aussitôt la main pour utiliser son action Spinning Serpent. *Quels trésors la bête garde-t-elle dans son terrier ? Quels voyageurs ont déjà été victimes de ce prédateur ?*"}]}];
const ADV_HB=[{"id":"rats-de-hamelin","nom":"Rats de Hamelin","tier":1,"type":"Horde (3/HP)","desc":"Une marée de rats qui avance en cadence, comme si une musique invisible les menait.","motifs":"Grouiller, ronger les réserves, suivre la mélodie, submerger","diff":"10","seuils":"6/11","pv":"5","stress":"2","atk":"-2","arme":"Morsures","portee":"Melee","degats":"1d8+2 phy","xp":"Discrétion +2","feats":[{"n":"Horde (1d4+1)","k":"Passive","t":"Quand les rats ont marqué la moitié de leurs PV ou plus, leur attaque standard inflige **1d4+1** dégâts physiques à la place."},{"n":"Au son de la flûte","k":"Passive","t":"Tant qu’une musique joue à portée lointaine, les rats ont l’avantage à leurs jets d’attaque. Un PJ qui fait taire la musique (jet de Présence ou d’Instinct contre la Difficulté des rats) annule cet effet jusqu’à la fin de la scène."},{"n":"Dévorer les vivres","k":"Action","t":"**Marque un Stress** : les rats se ruent sur les provisions du groupe. Au prochain repos, chaque PJ efface 1 Stress de moins que prévu (minimum 0)."}]},{"id":"loup-en-habit","nom":"Loup en habit","tier":1,"type":"Skulk","desc":"Un grand loup en manteau de laine et bonnet de nuit, aussi poli qu’affamé.","motifs":"Se faire passer pour un proche, attirer à l’écart, dévorer, disparaître","diff":"12","seuils":"7/13","pv":"4","stress":"3","atk":"+1","arme":"Crocs","portee":"Melee","degats":"1d10+3 phy","xp":"Imiter les voix +3","feats":[{"n":"Quelle grande bouche","k":"Passive","t":"Le loup a l’avantage aux attaques contre une cible qui lui a parlé pendant la scène sans l’attaquer."},{"n":"Voix de mère-grand","k":"Action","t":"**Marque un Stress** pour imiter la voix de quelqu’un que la cible connaît. Elle fait un jet de réaction d’Instinct (12) ; en cas d’échec, elle vient au contact du loup ou lui ouvre la porte, et elle est *Vulnérable* jusqu’à sa prochaine action."},{"n":"Ventre plein","k":"Reaction","t":"Quand le loup inflige des dégâts graves à une cible de taille humaine ou plus petite, il peut l’avaler : elle est *Entravée* dans son ventre jusqu’à ce que le loup soit vaincu ou subisse des dégâts graves."}]},{"id":"pantin-de-bois","nom":"Pantin de bois","tier":1,"type":"Minion","desc":"Une marionnette taillée dans du bois qui parle, animée par des fils dont on ne voit pas la fin.","motifs":"Imiter, encercler, couper la retraite, ramener à son maître","diff":"10","seuils":"None","pv":"1","stress":"1","atk":"-1","arme":"Mains de bois","portee":"Melee","degats":"2 phy","xp":"","feats":[{"n":"Minion (4)","k":"Passive","t":"Le pantin est vaincu dès qu’il subit des dégâts. Pour chaque tranche de 4 dégâts qu’un PJ inflige à un pantin, un autre pantin à portée de l’attaque est aussi vaincu."},{"n":"Attaque groupée","k":"Action","t":"**Dépense une Peur** pour choisir une cible et donner la main à tous les pantins à portée proche. Ils viennent au contact de la cible et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 2 dégâts physiques ; additionne ces dégâts."},{"n":"Nez qui pousse","k":"Reaction","t":"Quand un PJ ment à portée proche d’un pantin, celui-ci le désigne du doigt : la prochaine attaque contre ce PJ a l’avantage."}]},{"id":"eclat-du-miroir","nom":"Éclat du Miroir","tier":1,"type":"Support","desc":"Un passant ordinaire dont un œil reflète tout ce qu’il regarde, en plus laid.","motifs":"Rabaisser, semer le doute, répandre les éclats, protéger le Miroir","diff":"11","seuils":"7/12","pv":"3","stress":"4","atk":"+0","arme":"Tesson","portee":"Very Close","degats":"1d6+2 phy","xp":"Repérer les failles +2","feats":[{"n":"Regard déformant","k":"Action","t":"**Marque un Stress** pour fixer une cible à portée proche. Elle fait un jet de réaction de Présence (12) ; en cas d’échec, elle marque 2 Stress et perd un Espoir, persuadée que ses alliés la méprisent."},{"n":"Tout est laid","k":"Passive","t":"Les adversaires à portée proche de l’Éclat ont +1 à leurs jets d’attaque contre une cible qui a perdu un Espoir pendant la scène."},{"n":"Éclat contagieux","k":"Reaction","t":"Quand l’Éclat est vaincu, tu peux **dépenser une Peur** pour qu’un éclat se loge dans l’œil d’un PJ à portée très proche : il a le désavantage à ses jets de Présence jusqu’à son prochain repos long, ou jusqu’à ce que quelqu’un l’en libère."}]},{"id":"chasseur-de-la-reine","nom":"Chasseur de la Reine","tier":2,"type":"Standard","desc":"Un veneur en cuir sombre, coutelas à la ceinture et coffret à cœur sous le bras.","motifs":"Traquer, isoler, rapporter une preuve, hésiter","diff":"14","seuils":"10/20","pv":"5","stress":"3","atk":"+2","arme":"Coutelas de chasse","portee":"Melee","degats":"2d8+3 phy","xp":"Pistage +3","feats":[{"n":"Coffret à cœur","k":"Passive","t":"Le Chasseur a l’avantage aux attaques contre la cible que la Reine lui a désignée."},{"n":"Piège à loup","k":"Action","t":"**Marque un Stress** pour révéler un piège dans le sol, à portée très proche d’une cible. Elle fait un jet de réaction d’Agilité (14) ; en cas d’échec, elle subit **2d6** dégâts physiques et elle est *Entravée* jusqu’à ce qu’elle se libère (Force ou Finesse, 14)."},{"n":"Pitié du veneur","k":"Reaction","t":"La première fois que le Chasseur devrait vaincre une cible, il peut hésiter : elle marque 1 PV de moins. Avant sa prochaine action, un PJ qui lui parle peut faire un jet de Présence (14) pour le retourner contre la Reine."}]},{"id":"roi-sanglier","nom":"Le Roi-Sanglier","tier":2,"type":"Leader","desc":"Un enfant à tête de sanglier, couronné de mouches, à la tête d’une bande retournée à l’état sauvage.","motifs":"Chasser, terroriser, briser la loi de la conque, entraîner les autres","diff":"15","seuils":"11/21","pv":"6","stress":"4","atk":"+3","arme":"Épieu durci au feu","portee":"Very Close","degats":"2d10+3 phy","xp":"Chasse +3, Intimidation +2","feats":[{"n":"Voix des mouches","k":"Passive","t":"Les mouches qui l’entourent lui rapportent tout ce qui se dit à portée proche : le Roi-Sanglier ne peut pas être pris par surprise."},{"n":"Tuez la bête !","k":"Action","t":"**Dépense une Peur** pour donner la main au Roi-Sanglier et à **1d4** alliés à portée lointaine. Chacun attaque la même cible, avec +1 au jet par allié qui l’a déjà touchée ce tour-ci."},{"n":"Danse de guerre","k":"Action","t":"**Marque un Stress** : jusqu’à la fin de la scène, ses alliés à portée proche ont l’avantage à leurs jets d’attaque, mais ne pensent plus qu’à la chasse et poursuivent toute cible qui fuit."},{"n":"Faites-le taire","k":"Reaction","t":"Quand un PJ tente de raisonner la bande, le Roi-Sanglier peut **marquer un Stress** pour lui imposer le désavantage à ce jet."}]},{"id":"gardien-du-haricot","nom":"Gardien du Haricot","tier":2,"type":"Bruiser","desc":"Un ogre-portier chargé de garder la tige géante et les trésors d’en haut.","motifs":"Écraser, bloquer l’escalade, flairer les voleurs, secouer la tige","diff":"13","seuils":"13/24","pv":"8","stress":"3","atk":"+3","arme":"Massue en racine","portee":"Very Close","degats":"2d12+4 phy","xp":"Flairer les voleurs +3","feats":[{"n":"Fee-fi-fo-fum","k":"Passive","t":"Le Gardien sait toujours où se trouve un PJ qui porte un objet volé à son maître."},{"n":"Balayage","k":"Action","t":"Fais une attaque contre toutes les cibles à portée très proche. Celles que le Gardien touche subissent **2d8+3** dégâts physiques et sont repoussées à portée proche."},{"n":"Secouer la tige","k":"Action","t":"**Marque un Stress** : tous ceux qui grimpent la tige ou se tiennent dessus font un jet de réaction d’Agilité (14). En cas d’échec, ils tombent d’une portée et subissent **2d8** dégâts physiques."},{"n":"Colère du géant","k":"Reaction","t":"La première fois que le Gardien marque des PV, il gagne +2 à ses jets de dégâts jusqu’à la fin de la scène."}]},{"id":"fetard-d-oeyama","nom":"Fêtard d’Ōeyama","tier":2,"type":"Social","desc":"Un noceur en kimono défait, coupe de saké à la main, toujours prêt à t’en servir une.","motifs":"Tenter, flatter, retenir à la fête, dénoncer les rabat-joie","diff":"13","seuils":"9/18","pv":"3","stress":"4","atk":"+0","arme":"Coupe brisée","portee":"Melee","degats":"1d10+2 phy","xp":"Bon vivant +3, Rumeurs +2","feats":[{"n":"Encore un verre","k":"Action","t":"**Marque un Stress** pour offrir à boire à un PJ à portée proche. S’il accepte, il efface 2 Stress mais a le désavantage à son prochain jet d’action. S’il refuse, il fait un jet de réaction de Présence (13) ; en cas d’échec, il marque un Stress."},{"n":"La fête ne finit jamais","k":"Passive","t":"Tant que trois Fêtards ou plus sont présents, quitter la fête demande un jet de Présence (13). En cas d’échec, le PJ reste une scène de plus et tu gagnes une Peur."},{"n":"Rabat-joie !","k":"Reaction","t":"Quand un PJ attaque pendant la fête, les Fêtards à portée lointaine le désignent : les adversaires ont l’avantage contre lui jusqu’à la fin de son prochain tour."}]},{"id":"creancier-de-rumpelstiltskin","nom":"Créancier de Rumpelstiltskin","tier":2,"type":"Skulk","desc":"Un petit homme gris, un registre relié de cuir sous le bras et une plume qui ne sèche jamais.","motifs":"Réclamer son dû, lire les petites lignes, disparaître, revenir","diff":"14","seuils":"9/18","pv":"4","stress":"5","atk":"+2","arme":"Plume acérée","portee":"Very Close","degats":"2d6+4 mag","xp":"Contrats +3, Discrétion +2","feats":[{"n":"Clause en petits caractères","k":"Passive","t":"Un PJ qui a passé un marché avec Rumpelstiltskin a le désavantage à ses attaques contre le Créancier."},{"n":"Saisie","k":"Action","t":"**Marque un Stress** : une cible à portée proche fait un jet de réaction de Savoir (14). En cas d’échec, elle perd un objet de ton choix ou une poignée d’or, qui disparaît dans le registre."},{"n":"Disparaître","k":"Action","t":"**Marque un Stress** pour devenir *Caché* et réapparaître où tu veux, à portée lointaine."},{"n":"Devine mon nom","k":"Reaction","t":"Quand un PJ prononce le vrai nom du Créancier, celui-ci est vaincu sur-le-champ. À toi de décider comment ce nom peut s’apprendre."}]},{"id":"eveille-du-tresor","nom":"Éveillé du trésor","tier":3,"type":"Bruiser","desc":"Un ancien héros que l’or de Fáfnir a couvert d’écailles dorées et rendu incapable de lâcher son butin.","motifs":"Amasser, défendre le magot, soupçonner tout le monde, dormir sur l’or","diff":"17","seuils":"22/38","pv":"8","stress":"4","atk":"+4","arme":"Gantelet d’écailles","portee":"Very Close","degats":"3d10+5 phy","xp":"Estimer un trésor +3","feats":[{"n":"Peau d’or","k":"Passive","t":"Tant qu’il se tient sur un tas d’or, l’Éveillé est résistant aux dégâts physiques."},{"n":"Malédiction de l’avarice","k":"Action","t":"**Marque un Stress** : chaque PJ à portée proche qui porte de l’or fait un jet de réaction d’Instinct (16). En cas d’échec, il marque 2 Stress et a le désavantage à ses attaques contre l’Éveillé jusqu’à ce qu’il jette au moins une poignée d’or."},{"n":"Rugissement du dragon","k":"Action","t":"**Dépense une Peur** : toutes les cibles à portée proche font un jet de réaction de Force (17). En cas d’échec, elles subissent **3d8+3** dégâts physiques et sont repoussées à portée lointaine."},{"n":"Avidité","k":"Reaction","t":"Quand un PJ ramasse de l’or à portée lointaine, l’Éveillé peut aussitôt se déplacer à son contact et l’attaquer."}]},{"id":"isba-de-baba-yaga","nom":"Isba de Baba Yaga","tier":2,"type":"Solo","desc":"Une cabane de rondins montée sur deux pattes de poule géantes, palissade d’os et crânes-lanternes compris.","motifs":"Tourner le dos, piétiner, enfermer les impolis, obéir à sa maîtresse","diff":"15","seuils":"14/26","pv":"9","stress":"4","atk":"+3","arme":"Serres","portee":"Very Close","degats":"2d10+4 phy","xp":"Sentir la peur +3","feats":[{"n":"Isba, isba","k":"Passive","t":"Un PJ qui prononce la formule « Isba, isba, tourne le dos à la forêt et la face vers moi » oblige l’isba à s’arrêter et à s’ouvrir : elle ne peut plus l’attaquer pendant la scène."},{"n":"Coup de patte","k":"Action","t":"Fais une attaque contre une cible à portée très proche. En cas de réussite, elle subit **2d10+4** dégâts physiques, elle est repoussée à portée proche et elle est *Vulnérable*."},{"n":"Les crânes s’allument","k":"Action","t":"**Marque un Stress** : les crânes-lanternes éclairent toute la scène. Les PJ *Cachés* cessent de l’être et tu gagnes une Peur."},{"n":"Porte qui avale","k":"Reaction","t":"Quand un PJ termine son déplacement au contact de l’isba, tu peux **dépenser une Peur** pour qu’elle l’avale : il est *Entravé* à l’intérieur jusqu’à ce qu’il réussisse un jet de Finesse ou de Force (15), ou qu’on l’aide de l’extérieur."}]},{"id":"dullahan","nom":"Le Dullahan","tier":3,"type":"Solo","desc":"Un cavalier sans tête sur un cheval noir, sa tête blafarde à la main, qui fouette ceux qui l’épient.","motifs":"Annoncer la mort, poursuivre, aveugler les curieux, s’arrêter devant une porte","diff":"18","seuils":"22/40","pv":"10","stress":"5","atk":"+5","arme":"Fouet","portee":"Close","degats":"3d10+4 phy","xp":"Présage +4","feats":[{"n":"Implacable (2)","k":"Passive","t":"Le Dullahan peut recevoir la main jusqu’à deux fois par tour du MJ. Dépense une Peur comme d’habitude pour lui donner la main."},{"n":"Il s’arrête à ta porte","k":"Action","t":"**Dépense une Peur** pour lancer un compte à rebours de la Mort (3) sur un PJ à portée lointaine. Il descend de 1 chaque fois que le Dullahan reçoit la main. À 0, ce PJ marque 2 PV. Le compte à rebours disparaît si le Dullahan est vaincu."},{"n":"Fouet des curieux","k":"Action","t":"Fais une attaque contre une cible à portée proche. En cas de réussite, elle subit **3d8+4** dégâts physiques et a le désavantage à tous les jets qui demandent de voir, jusqu’à son prochain repos court."},{"n":"Carrosse sourd","k":"Action","t":"**Marque un Stress** : le carrosse traverse la scène en ligne droite. Toutes les cibles sur son passage font un jet de réaction d’Agilité (17). En cas d’échec, elles subissent **3d10** dégâts physiques et sont *Vulnérables*."}]}];
</script>
<script>
/* ---------- Adversaires : bestiaire du SRD, homebrew, combat ---------- */
ICONS.claw='<path d="M6 20c1.6-5 2.2-10 1.2-16M11 20c1.2-5 1.6-10 .9-16M16 20c.9-4.5 1.2-8.6.7-13.5M20 20c.4-3.6.5-6.6.2-10"/>';
const ADV_COST={Minion:1,Social:1,Support:1,Horde:2,Ranged:2,Skulk:2,Standard:2,Leader:3,Bruiser:4,Solo:5};
const ADV_TYPES=['Solo','Bruiser','Leader','Standard','Skulk','Ranged','Horde','Minion','Social','Support'];
const RANGE_FR={'Melee':'Mêlée','Very Close':'Très proche','Close':'Proche','Far':'Loin','Very Far':'Très loin'};
const KIND_FR={Passive:'Passive',Action:'Action',Reaction:'Réaction'};
const BENCH={1:{atk:'+1',degats:'1d8+3 phy',diff:11,maj:7,gra:12},2:{atk:'+2',degats:'2d8+3 phy',diff:14,maj:10,gra:20},3:{atk:'+3',degats:'3d10+4 phy',diff:17,maj:20,gra:32},4:{atk:'+4',degats:'4d10+12 phy',diff:20,maj:25,gra:45}};
const SRC_FR={srd:'Livre de base (SRD)',fdq:'Homebrew Faim de Quête',perso:'Mes adversaires'};
const baseType=t=>String(t||'').split(' ')[0];
const rangeFR=r=>RANGE_FR[r]||r||'';
const seuilsFR=s=>!s||s==='None'?'Aucun':s;
S.adv={q:'',tier:'',type:'',src:'',tab:'adv',modal:null,party:LS.get('advParty',0),adj:{}};

function advAll(){
  return [...ADV_HB.map(a=>({...a,src:'fdq',key:'fq:'+a.id})),
    ...list('adversaires').map(a=>({...a,src:'perso',key:'hb:'+a.id})),
    ...ADV_SRD.map(a=>({...a,src:'srd',key:'srd:'+a.id}))];
}
function advByKey(k){
  const i=String(k||'').indexOf(':'),s=k.slice(0,i),id=k.slice(i+1);
  if(s==='srd'){const a=ADV_SRD.find(x=>x.id===id);return a?{...a,src:'srd',key:k}:null;}
  if(s==='fq'){const a=ADV_HB.find(x=>x.id===id);return a?{...a,src:'fdq',key:k}:null;}
  if(s==='hb'){const a=(D.adversaires||{})[id];return a?{...a,id,src:'perso',key:k}:null;}
  if(s==='env'){const e=ENV_SRD.find(x=>x.id===id);return e?{...e,src:'srd',key:k,env:true}:null;}
  return null;
}
function atkExpr(a){const m=String(a.atk||'').replace(/\s+/g,'').match(/^[+-]?\d+/);return '1d20'+(m?(m[0][0]==='-'||m[0][0]==='+'?m[0]:'+'+m[0]):'');}
function dmgOf(a){const m=String(a.degats||'').toLowerCase().replace(/\s+/g,'').match(/^(\d*d\d+(?:[+-]\d+)?|\d+)/);return m?m[1]:'';}

/* Bloc de stats complet */
function advBlockHTML(a){
  const feats=(a.feats||[]).map(f=>`<div class="sb-feat"><div class="sb-fh"><b>${esc(f.n)}</b><span class="sb-kind k-${esc(f.k)}">${KIND_FR[f.k]||esc(f.k)}</span></div>${md(f.t)}</div>`).join('');
  if(a.env) return `<article class="statblock env"><header><h3>${esc(a.nom)}</h3><span>Environnement · palier ${a.tier} · ${esc(a.type)}</span></header>
    ${a.desc?`<p class="sb-desc"><em>${esc(a.desc)}</em></p>`:''}
    <p><b>Impulsions :</b> ${esc(a.impulsions||'')}</p>
    <div class="sb-stats"><span>Difficulté <b>${esc(a.diff||'–')}</b></span></div>
    ${a.adv?`<p><b>Adversaires possibles :</b> ${esc(a.adv)}</p>`:''}
    <h4>Capacités</h4>${feats}</article>`;
  return `<article class="statblock"><header><h3>${esc(a.nom)}</h3><span>Palier ${a.tier} · ${esc(a.type)}</span></header>
    ${a.desc?`<p class="sb-desc"><em>${esc(a.desc)}</em></p>`:''}
    ${a.motifs?`<p><b>Motivations et tactiques :</b> ${esc(a.motifs)}</p>`:''}
    <div class="sb-stats"><span>Difficulté <b>${esc(a.diff||'–')}</b></span><span>Seuils <b>${esc(seuilsFR(a.seuils))}</b></span><span>PV <b>${esc(a.pv||'–')}</b></span><span>Stress <b>${esc(a.stress||'–')}</b></span></div>
    <div class="sb-atk"><span>ATK <b>${esc(a.atk||'–')}</b></span><span><b>${esc(a.arme||'Attaque')}</b> · ${esc(rangeFR(a.portee))} · ${esc(a.degats||'')}</span></div>
    ${a.xp?`<p><b>Expérience :</b> ${esc(a.xp)}</p>`:''}
    ${feats?`<h4>Capacités</h4>${feats}`:''}</article>`;
}

/* Combat en cours et budget de rencontre */
function partySize(){return S.adv.party||Math.max(1,list('persos').length)||4;}
function combatEntries(){return list('combat').sort((a,b)=>num(a.ordre)-num(b.ordre));}
function battleBudget(){
  const n=partySize(),adj=S.adv.adj,es=combatEntries().map(e=>({e,a:advByKey(e.ref)})).filter(x=>x.a);
  const types=es.map(x=>baseType(x.a.type));
  let spent=0;const minions={};
  es.forEach(({e,a})=>{const t=baseType(a.type);if(t==='Minion') minions[e.ref]=(minions[e.ref]||0)+1;else spent+=ADV_COST[t]||2;});
  Object.values(minions).forEach(c=>{spent+=Math.ceil(c/n);});
  let budget=3*n+2;const notes=[];
  if(adj.facile){budget-=1;notes.push('−1 plus facile');}
  if(types.filter(t=>t==='Solo').length>=2){budget-=2;notes.push('−2 deux Solos ou plus');}
  if(adj.degats){budget-=2;notes.push('−2 dégâts renforcés');}
  if(adj.palier){budget+=1;notes.push('+1 palier inférieur');}
  if(es.length&&!types.some(t=>['Bruiser','Horde','Leader','Solo'].includes(t))){budget+=1;notes.push('+1 ni Bruiser, Horde, Leader ni Solo');}
  if(adj.dur){budget+=2;notes.push('+2 plus dur');}
  return {n,budget,spent,notes};
}
function slotsRow(e,a,f,max,kind){let h='';for(let i=1;i<=max;i++) h+=`<button type="button" class="slot ${kind} ${i<=num(e[f])?'on':''}" data-act="cbslot" data-id="${e.id}" data-f="${f}" data-n="${i}" aria-label="${f==='pv'?'PV':'Stress'} ${i}"></button>`;return h;}
function combatHTML(){
  const es=combatEntries(),bb=battleBudget(),adj=S.adv.adj;
  const tog=(k,l)=>`<button type="button" class="chip ${adj[k]?'on':''}" data-act="advadj" data-k="${k}" aria-pressed="${!!adj[k]}">${l}</button>`;
  const cards=es.map(e=>{const a=advByKey(e.ref);if(!a) return '';const pvMax=Math.max(1,num(a.pv,1)),stMax=num(a.stress),down=num(e.pv)>=pvMax;
    return `<div class="cb ${down?'down':''}"><div class="cb-h"><button type="button" class="cb-name" data-act="advopen" data-k="${esc(e.ref)}">${esc(e.nom||a.nom)}</button><span class="muted small">P${a.tier} · ${esc(a.type)}</span><button type="button" class="cb-x" data-act="cbdel" data-id="${e.id}" aria-label="Retirer du combat">×</button></div>
      <div class="cb-stats"><span>Diff <b>${esc(a.diff)}</b></span><span>Seuils <b>${esc(seuilsFR(a.seuils))}</b></span><span>ATK <b>${esc(a.atk)}</b></span></div>
      <div class="cb-track"><span class="label">PV</span>${slotsRow(e,a,'pv',pvMax,'hp')}</div>
      ${stMax?`<div class="cb-track"><span class="label">Stress</span>${slotsRow(e,a,'stress',stMax,'st')}</div>`:''}
      <div class="cb-btns"><button type="button" class="btn small" data-act="cbatk" data-id="${e.id}">${ico('de')} Attaque ${esc(atkExpr(a).slice(4)||'')}</button>${dmgOf(a)?`<button type="button" class="btn small ghost" data-act="cbdmg" data-id="${e.id}">Dégâts ${esc(dmgOf(a))}</button>`:''}</div>
      ${down?'<span class="cb-down">Vaincu</span>':''}</div>`;}).join('');
  return `<section class="panel combat"><header><h2>Combat</h2><span class="label">${es.length} adversaire${es.length>1?'s':''}</span></header>
    <div class="cb-budget"><span>Joueurs</span><button type="button" class="step" data-act="advparty" data-v="-1" aria-label="Un joueur de moins">−</button><b>${bb.n}</b><button type="button" class="step" data-act="advparty" data-v="1" aria-label="Un joueur de plus">+</button>
      <span class="cb-bp ${bb.spent>bb.budget?'over':''}">Points de bataille : <b>${bb.spent}</b> / ${bb.budget}</span></div>
    <div class="chips">${tog('facile','Plus facile (−1)')}${tog('dur','Plus dur (+2)')}${tog('degats','+1d4 aux dégâts (−2)')}${tog('palier','Adversaire d’un palier inférieur (+1)')}</div>
    ${bb.notes.length?`<p class="hint">Ajustements : ${esc(bb.notes.join(' · '))}.</p>`:''}
    ${es.length?`<div class="cb-grid">${cards}</div><div class="btns">${S.adv.confirmClear?`<button type="button" class="btn small danger" data-act="cbclear">Confirmer : vider le combat</button><button type="button" class="btn small ghost" data-act="cbclearno">Annuler</button>`:`<button type="button" class="btn small ghost" data-act="cbclearask">${ico('trash')} Vider le combat</button>`}</div>`:'<p class="empty">Aucun adversaire en jeu. Ajoute-en depuis le bestiaire ci-dessous.</p>'}
    <p class="hint">Les jets d’attaque et de dégâts passent par le lanceur de dés. Coche « Jet caché » dans la barre de dés pour les garder pour toi.</p></section>`;
}

/* Bestiaire */
function advFiltered(){
  const f=S.adv,q=norm(f.q);
  const src=f.tab==='env'?ENV_SRD.map(e=>({...e,src:'srd',key:'env:'+e.id,env:true})):advAll();
  return src.filter(a=>(!f.tier||String(a.tier)===f.tier)&&(f.tab==='env'||!f.type||baseType(a.type)===f.type)&&(f.tab==='env'||!f.src||a.src===f.src)
    &&(!q||norm(a.nom+' '+(a.desc||'')+' '+(a.motifs||a.impulsions||'')).includes(q)))
    .sort((a,b)=>(a.tier-b.tier)||a.nom.localeCompare(b.nom,'fr'));
}
function vAdversaires(){
  const f=S.adv,rows=advFiltered(),nAdv=advAll().length;
  const row=a=>`<div class="advrow"><button type="button" class="advmain" data-act="advopen" data-k="${esc(a.key)}"><span class="advtier">P${a.tier}</span><span class="min0"><b>${esc(a.nom)}</b><small>${esc(a.env?a.type:a.type)}${a.env?'':` · Diff ${esc(a.diff)} · PV ${esc(a.pv)} · Seuils ${esc(seuilsFR(a.seuils))}`}</small></span>${a.src!=='srd'?`<span class="chip">${a.src==='fdq'?'Homebrew':'Perso'}</span>`:''}</button>${a.env?'':`<button type="button" class="advadd" data-act="advadd" data-k="${esc(a.key)}" title="Ajouter au combat" aria-label="Ajouter ${esc(a.nom)} au combat">+</button>`}</div>`;
  return `<div class="wrap">
  <div class="page-head row-between"><div><h1>Adversaires</h1><p class="muted">${nAdv} adversaires et ${ENV_SRD.length} environnements : le livre de base, le homebrew de la campagne et les tiens.</p></div>
   <div class="btns"><button type="button" class="btn primary" data-act="advnew">${ico('plus')} Nouvel adversaire</button></div></div>
  ${combatHTML()}
  <section class="panel"><header><h2>Bestiaire</h2><span class="label">${rows.length} résultat${rows.length>1?'s':''}</span></header>
   <div class="advtabs" role="tablist"><button type="button" role="tab" aria-selected="${f.tab==='adv'}" class="${f.tab==='adv'?'on':''}" data-act="advtab" data-t="adv">Adversaires</button><button type="button" role="tab" aria-selected="${f.tab==='env'}" class="${f.tab==='env'?'on':''}" data-act="advtab" data-t="env">Environnements</button></div>
   <div class="advfilters">
    <input type="search" id="adv-q" placeholder="Chercher un nom, un mot…" value="${esc(f.q)}" aria-label="Chercher" autocomplete="off">
    <select id="adv-tier" data-advf="tier" aria-label="Palier"><option value="">Tous les paliers</option>${[1,2,3,4].map(t=>`<option value="${t}" ${f.tier===String(t)?'selected':''}>Palier ${t}</option>`).join('')}</select>
    ${f.tab==='adv'?`<select id="adv-type" data-advf="type" aria-label="Type"><option value="">Tous les types</option>${ADV_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select>
    <select id="adv-src" data-advf="src" aria-label="Source"><option value="">Toutes les sources</option>${Object.entries(SRC_FR).map(([k,l])=>`<option value="${k}" ${f.src===k?'selected':''}>${l}</option>`).join('')}</select>`:''}
   </div>
   <div class="advlist">${rows.map(row).join('')||'<p class="empty">Aucun résultat.</p>'}</div>
  </section>
  <p class="hint small">Adversaires et environnements du livre de base tirés du Daggerheart SRD 1.0 © Critical Role LLC, utilisés selon la Darrington Press Community Gaming License. Daggerheart est une marque de Critical Role LLC ; ce site n’est ni affilié ni approuvé.</p>
  </div>`;
}
function advModalHTML(){
  const a=advByKey(S.adv.modal);if(!a) return '';
  return `<div class="modal" data-act="advclose-bg"><div class="modal-box advmodal" role="dialog" aria-modal="true" aria-label="${esc(a.nom)}">${advBlockHTML(a)}
   <div class="btns">${a.env?'':`<button type="button" class="btn primary" data-act="advadd" data-k="${esc(a.key)}">${ico('plus')} Ajouter au combat</button>`}
   ${a.src==='perso'?`<button type="button" class="btn" data-act="advedit" data-id="${esc(a.id)}">${ico('edit')} Modifier</button>${delBtn('adversaires',a.id,false)}`:a.env?'':`<button type="button" class="btn" data-act="advdup" data-k="${esc(a.key)}">Dupliquer et modifier</button>`}
   <button type="button" class="btn ghost" data-act="advclose">Fermer</button></div></div></div>`;
}

/* Création d'un adversaire maison */
function advForm(){
  const e=S.editing,a=e.id?(D.adversaires||{})[e.id]||{}:e.draft||{},fs=(a.feats||[]).slice();while(fs.length<6) fs.push({n:'',k:'Action',t:''});
  const [maj,gra]=String(a.seuils||'').split('/');
